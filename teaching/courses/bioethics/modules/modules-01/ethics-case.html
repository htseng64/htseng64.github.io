<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>護理倫理：效益論進階挑戰</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f0f2f5; padding: 20px; line-height: 1.6; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; border-bottom: 3px solid #3498db; padding-bottom: 15px; }
        .progress-bar { height: 10px; background: #eee; border-radius: 5px; margin-bottom: 20px; overflow: hidden; }
        .progress-fill { height: 100%; background: #3498db; width: 0%; transition: 0.5s; }
        .scenario-box { background: #ebf5fb; padding: 20px; border-radius: 10px; margin-bottom: 25px; border-left: 6px solid #3498db; }
        .options { display: grid; gap: 15px; }
        .option-btn { background: white; border: 2px solid #3498db; padding: 15px; border-radius: 10px; cursor: pointer; text-align: left; font-size: 16px; transition: 0.3s; }
        .option-btn:hover { background: #3498db; color: white; transform: translateY(-2px); }
        #feedback-area { margin-top: 25px; display: none; padding: 20px; border-radius: 10px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .warning { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .next-btn { background: #2c3e50; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin-top: 15px; float: right; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏥 護理倫理：效益論決策挑戰</h1>
    <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>
    
    <div id="game-content">
        </div>

    <div id="feedback-area"></div>
</div>

<script>
    const levels = [
        {
            title: "第一關：資源分配（誰能進 ICU？）",
            scenario: "加護病房只剩最後一床。兩位患者同時送達：",
            pA: "患者 A：25歲青年，車禍外傷，存活率 85%，預後極佳。",
            pB: "患者 B：82歲長者，多重器官衰竭，存活率 15%，預期餘命短。",
            correct: "A",
            explanationA: "✅ 符合效益論：選擇 A 能最大化生命的年數與社會生產力。這就是典型的『最大幸福原則』。",
            explanationB: "⚠️ 不符合效益論：雖然尊重長者是美德，但效益論認為將稀缺資源投向成功率極低的個案，會降低整體的醫療效益。"
        },
        {
            title: "第二關：資訊透明（該不該隱瞞病情？）",
            scenario: "一位癌末患者 A 希望知道真相，但家屬強烈要求護理師隱瞞，擔心患者知道後會崩潰自殺，增加醫療負擔。",
            pA: "實話實說：尊重病人自主權，但可能導致其情緒崩潰。",
            pB: "暫時隱瞞：維持病患情緒穩定，方便後續照護，減少混亂。",
            correct: "B",
            explanationA: "⚠️ 效益論的糾結：這通常符合『義務論』，但在效益論下，若實話導致病患自殺或照護難度劇增，其『總產出幸福值』會降低。",
            explanationB: "✅ 符合效益論（某種程度上）：如果隱瞞能讓病患平靜走完最後一段路，且減少醫療端與家庭的衝突，效益論者可能支持隱瞞。"
        },
        {
            title: "第三關：公共衛生（疫苗分配）",
            scenario: "新興傳染病爆發，疫苗數量有限。身為公衛護理師，你會優先分給：",
            pA: "醫療前線人員：確保醫療體系不崩潰，能救治更多人。",
            pB: "極高齡長者：他們死亡風險最高，最需要保護。",
            correct: "A",
            explanationA: "✅ 符合效益論：保護醫護人員是『乘數效應』，一人不倒能救百人，產生的總體利益最高。",
            explanationB: "⚠️ 情感與效益的拉扯：保護長者是道義，但若醫護全倒，死亡人數將大幅攀升，總體效益較低。"
        }
    ];

    let currentLevel = 0;

    function renderLevel() {
        const level = levels[currentLevel];
        const progress = ((currentLevel + 1) / levels.length) * 100;
        document.getElementById('progress').style.width = progress + "%";

        let html = `
            <div class="scenario-box">
                <h3>${level.title}</h3>
                <p>${level.scenario}</p>
            </div>
            <div class="options">
                <button class="option-btn" onclick="checkAnswer('A')">選項 1：${level.pA}</button>
                <button class="option-btn" onclick="checkAnswer('B')">選項 2：${level.pB}</button>
            </div>
        `;
        document.getElementById('game-content').innerHTML = html;
        document.getElementById('feedback-area').style.display = 'none';
    }

    function checkAnswer(choice) {
        const level = levels[currentLevel];
        const feedback = document.getElementById('feedback-area');
        feedback.style.display = 'block';

        if (choice === level.correct) {
            feedback.className = "success";
            feedback.innerHTML = `<h3>你的選擇：${choice}</h3><p>${level['explanation' + choice]}</p>`;
        } else {
            feedback.className = "warning";
            feedback.innerHTML = `<h3>你的選擇：${choice}</h3><p>${level['explanation' + choice]}</p>`;
        }

        if (currentLevel < levels.length - 1) {
            feedback.innerHTML += `<button class="next-btn" onclick="nextLevel()">下一關</button>`;
        } else {
            feedback.innerHTML += `<h3>🎉 課程完成！</h3><p>你已完成所有效益論的臨床情境練習。</p>`;
        }
    }

    function nextLevel() {
        currentLevel++;
        renderLevel();
    }

    renderLevel();
</script>

</body>
</html>
