<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>護理倫理 UCS 教學學習平台</title>
<style>
:root{
  --purple1:#667eea; --purple2:#764ba2; --pink1:#f093fb; --pink2:#f5576c;
  --gold:#d4af37; --gold-dark:#b8912a;
  --ink:#2b2b38; --muted:#6b6b7b; --line:#e6e6ee;
  --card:#ffffff; --bg:#f4f4fa;
  --ok:#2e9e6b; --warn:#c77b00;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",Arial,sans-serif;
  background:linear-gradient(135deg,var(--purple1) 0%,var(--purple2) 100%);
  color:var(--ink); line-height:1.75; min-height:100vh;
}
a{color:inherit;}
.wrap{max-width:1180px;margin:0 auto;padding:16px;}
header.top{
  background:linear-gradient(135deg,var(--purple1) 0%,var(--purple2) 100%);
  color:#fff; padding:26px 90px 18px; text-align:center;
  position:relative;
}
header.top h1{margin:0 0 6px; font-size:1.9em;}
header.top p.sub{margin:0; opacity:.92; font-size:1.02em;}
.brand-logo{
  position:absolute; top:16px; left:18px; font-weight:900; font-size:1.3em;
  background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.4);
  border-radius:10px; padding:4px 12px; letter-spacing:.03em;
}
.header-status{
  position:absolute; top:16px; right:18px; font-size:.8em; text-align:right;
  background:rgba(255,255,255,.14); border-radius:10px; padding:6px 10px; max-width:220px;
}
@media (max-width:640px){
  header.top{padding:50px 14px 16px;}
  .brand-logo{top:10px; left:10px; font-size:1.05em; padding:3px 9px;}
  .header-status{position:static; display:block; margin:10px auto 0; max-width:none;}
}
.login-bar{
  max-width:1180px;margin:14px auto 0; background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.35); border-radius:14px; padding:12px 16px;
  display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center;
}
.login-bar input[type=text]{
  padding:9px 12px; border-radius:8px; border:none; font-size:1em; width:200px; max-width:60vw;
}
.login-bar button, .btn{
  background:var(--gold); color:#3a2c00; border:none; padding:9px 16px; border-radius:8px;
  font-weight:700; cursor:pointer; font-size:.95em;
}
.login-bar button:hover, .btn:hover{background:var(--gold-dark);}
.login-bar .status{color:#fff; font-size:.9em; opacity:.95;}
.btn.secondary{background:rgba(255,255,255,.9); color:var(--purple2);}
.btn.ghost{background:transparent; color:#fff; border:1px solid rgba(255,255,255,.6);}
.btn.small{padding:6px 12px; font-size:.85em;}
.btn:disabled{opacity:.5; cursor:not-allowed;}

nav.tabs{
  max-width:1180px;margin:14px auto 0; display:flex; flex-wrap:wrap; gap:8px;
  justify-content:center; padding:0 12px;
}
nav.tabs button{
  background:rgba(255,255,255,.9); border:none; padding:10px 16px; border-radius:20px;
  font-weight:700; color:var(--purple2); cursor:pointer; font-size:.92em;
  transition:.2s;
}
nav.tabs button.active{background:var(--gold); color:#3a2c00;}
nav.tabs button .badge{
  display:inline-block; margin-left:6px; background:var(--ok); color:#fff; border-radius:10px;
  padding:1px 7px; font-size:.75em;
}

main{max-width:1180px;margin:16px auto 100px; padding:0 12px;}
.panel{display:none;}
.panel.active{display:block;}

.card{
  background:var(--card); border-radius:16px; box-shadow:0 8px 30px rgba(0,0,0,.15);
  padding:22px 24px; margin-bottom:18px;
}
.card h2{color:var(--purple2); margin-top:0; border-bottom:3px solid var(--purple1); padding-bottom:10px;}
.card h3{color:var(--purple2); margin:18px 0 8px;}
.intro-box{
  background:#f8f7ff; border-left:4px solid var(--purple1); border-radius:8px; padding:14px 18px; margin:12px 0;
}
.progress-track{background:#eceafc; border-radius:10px; height:12px; overflow:hidden; margin:8px 0 4px;}
.progress-fill{background:linear-gradient(90deg,var(--purple1),var(--pink2)); height:100%; border-radius:10px; transition:width .3s;}
.grid-modules{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; margin-top:14px;}
.mod-tile{
  background:#faf9ff; border:1px solid var(--line); border-radius:12px; padding:16px; cursor:pointer;
}
.mod-tile:hover{border-color:var(--purple1);}
.mod-tile h4{margin:0 0 6px; color:var(--purple2);}
.mod-tile .count{font-size:.85em; color:var(--muted);}

details.case-block{
  border:1px solid var(--line); border-radius:12px; margin-bottom:14px; overflow:hidden;
}
details.case-block summary{
  list-style:none; cursor:pointer; padding:16px 18px; background:linear-gradient(135deg,var(--purple1),var(--purple2));
  color:#fff; font-weight:700; display:flex; align-items:center; justify-content:space-between; gap:10px;
}
details.film-block summary{background:linear-gradient(135deg,var(--pink1),var(--pink2));}
details.case-block summary::-webkit-details-marker{display:none;}
details.case-block summary .tag{background:rgba(255,255,255,.28); border-radius:12px; padding:2px 10px; font-size:.8em; margin-right:8px;}
details.case-block summary .prog{font-size:.8em; background:rgba(0,0,0,.2); padding:2px 8px; border-radius:10px;}
.case-body{padding:18px 20px;}
.seg{border-top:1px dashed var(--line); padding-top:14px; margin-top:14px;}
.seg:first-child{border-top:none; margin-top:0; padding-top:0;}
.seg h4{margin:0 0 8px; color:#4a3b7a; font-size:1.05em;}
.seg h4 .stage-tag{
  display:inline-block; font-size:.72em; background:var(--purple1); color:#fff; border-radius:8px; padding:2px 8px; margin-right:6px;
  vertical-align:middle;
}
.seg-content{font-size:.97em;}
.seg-content p{margin:6px 0;}
.seg-content strong{color:#4a3b7a;}
.field{margin:10px 0;}
.field label{display:block; font-weight:700; font-size:.9em; margin-bottom:4px; color:#4a3b7a;}
.field textarea, .field input[type=text]{
  width:100%; border:1px solid var(--line); border-radius:8px; padding:9px 11px; font-family:inherit; font-size:.95em;
  resize:vertical;
}
.field textarea{min-height:64px;}
.checkrow{display:flex; flex-wrap:wrap; gap:12px; font-size:.92em; margin:6px 0;}
.checkrow label{font-weight:400; display:flex; align-items:center; gap:5px;}
.rating-row{display:flex; align-items:center; gap:10px; margin:8px 0; flex-wrap:wrap;}
.rating-row label{min-width:180px; font-weight:600; font-size:.9em; color:#4a3b7a;}
.rating-row input[type=range]{flex:1; min-width:120px;}
.rating-row .val{font-weight:700; color:var(--purple2); width:20px; text-align:center;}

.ai-box{
  margin-top:14px; border:1px dashed var(--gold-dark); border-radius:12px; padding:12px 14px; background:#fffaf0;
}
.ai-box .ai-head{display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;}
.ai-log{max-height:260px; overflow-y:auto; margin:10px 0; font-size:.92em;}
.ai-msg{padding:8px 12px; border-radius:10px; margin-bottom:8px; white-space:pre-wrap;}
.ai-msg.user{background:#ece8ff; margin-left:20%;}
.ai-msg.assistant{background:#fff2d9; margin-right:10%;}
.ai-input-row{display:flex; gap:8px;}
.ai-input-row input{flex:1; padding:8px 10px; border-radius:8px; border:1px solid var(--line);}

.toolbar{
  position:fixed; right:16px; bottom:16px; left:auto; background:#1f1a33; color:#fff;
  padding:12px; display:flex; flex-direction:column; align-items:flex-end; gap:8px;
  box-shadow:0 6px 24px rgba(0,0,0,.35); z-index:50; border-radius:16px; max-width:260px;
}
.toolbar .status{font-size:.78em; opacity:.85; text-align:right;}
.toolbar button, .toolbar label.btn{width:100%; text-align:center;}
@media (max-width:640px){
  .toolbar{right:8px; bottom:8px; left:8px; max-width:none; flex-direction:row; flex-wrap:wrap; justify-content:center;}
  .toolbar button, .toolbar label.btn{width:auto;}
}
.teacher-table{width:100%; border-collapse:collapse; font-size:.92em;}
.teacher-table th,.teacher-table td{border:1px solid var(--line); padding:8px 10px; text-align:left;}
.teacher-table th{background:#f3f1ff;}
.note{font-size:.85em; color:var(--muted);}
.hidden{display:none !important;}

@media (max-width:720px){
  header.top h1{font-size:1.5em;}
  nav.tabs button{padding:8px 12px; font-size:.85em;}
  .card{padding:16px 14px;}
  .rating-row label{min-width:130px;}
}

@media print{
  body{background:#fff !important;}
  header.top, .login-bar, nav.tabs, .toolbar, .ai-box, details.case-block summary{ }
  .toolbar, .ai-box, .login-bar{display:none !important;}
  nav.tabs{display:none !important;}
  .panel{display:block !important; page-break-after:always;}
  details.case-block{border:1px solid #999; break-inside:avoid;}
  .card{box-shadow:none; border:1px solid #ccc;}
  summary{color:#000 !important; background:#eee !important;}
}
.btn.ghost-dark{background:#f0f0f0; color:#b23; border:1px solid #d9baba;}
.btn.ghost-dark:hover{background:#f6dede;}
.login-bar .clearbtn{background:rgba(255,255,255,.25); color:#fff; border:1px solid rgba(255,255,255,.5); padding:9px 12px; border-radius:8px; cursor:pointer; font-weight:700;}
.login-bar .clearbtn:hover{background:rgba(255,255,255,.4);}
.field label{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.fcode{font-size:.68em; font-weight:400; color:#a89bd6; background:#f1eefc; border-radius:6px; padding:1px 6px;}
.seg-content p.story{background:#f8f7ff; border-left:3px solid var(--purple1); padding:8px 12px; border-radius:6px;}
.seg-content p.focus{color:#4a3b7a;}
.unit-list{list-style:none; padding:0; margin:8px 0 16px;}
.unit-list li{padding:7px 4px; border-bottom:1px solid var(--line); font-size:.94em;}
.toolbar button{white-space:nowrap;}
.uidwrap{display:flex; align-items:center; gap:6px;}
.uidwrap input{width:70px; padding:9px 10px; border-radius:8px; border:none; font-size:1em;}
.week-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-top:14px;}
.week-card{background:#faf9ff; border:1px solid var(--line); border-radius:12px; padding:14px;}
.week-card .wk-label{font-weight:800; color:var(--purple2); font-size:1.05em;}
.week-card .wk-topic{font-size:.9em; margin:6px 0 10px; min-height:2.6em;}
.week-card .wk-actions{display:flex; gap:6px; flex-wrap:wrap;}
.export-one{margin:10px 0;}
.uidwrap label{white-space:nowrap;}
</style>
</head>
<body>

<header class="top">
  <div class="brand-logo">UCS</div>
  <h1>護理倫理 Unfolding Case Study 教學學習平台</h1>
  <p class="sub" id="headerSub">以演變型情境案例建構護理學生三階倫理能力｜敏感度 → 推理 → 行動力</p>
  <div class="header-status" id="capNote"></div>
</header>

<div class="login-bar">
  <span class="uidwrap">
    <label style="color:#fff;font-weight:700;">UCS-</label>
    <input type="text" id="uidInput" maxlength="3" inputmode="numeric" placeholder="請填三位數字" autocomplete="off">
  </span>
  <button class="btn" id="enterBtn">進入課程 / 載入我的紀錄</button>
</div>

<nav class="tabs hidden" id="appNav">
  <button data-tab="home" class="active">首頁（18週總覽）</button>
  <button data-tab="A">Module A 敏感度暖身<span class="badge">0%</span></button>
  <button data-tab="B">Module B 演變型案例<span class="badge">0%</span></button>
  <button data-tab="C">Module C 電影推理<span class="badge">0%</span></button>
  <button data-tab="D">Module D 綜合行動<span class="badge">0%</span></button>
  <button data-tab="E">Module E 課程講義</button>
  <button data-tab="teacher">教師檢視</button>
</nav>

<main id="appMain" class="hidden">
  <div class="panel active" id="panel-home"></div>
  <div class="panel" id="panel-A"></div>
  <div class="panel" id="panel-B"></div>
  <div class="panel" id="panel-C"></div>
  <div class="panel" id="panel-D"></div>
  <div class="panel" id="panel-E"></div>
  <div class="panel" id="panel-teacher"></div>
</main>

<div class="toolbar hidden" id="appToolbar">
  <span class="status" id="saveStatus">尚未載入</span>
  <button class="btn secondary" id="finishBtn">✅ 完成並雙重存檔（雲端＋TronClass無研究碼PDF）</button>
  <button class="btn ghost" id="exportPdfBtn">🖨️ 匯出整學期報表PDF</button>
  <button class="btn ghost" id="exportJsonBtn">⬇️ 匯出 JSON 備份</button>
  <label class="btn ghost" style="cursor:pointer;">⬆️ 匯入備份<input type="file" id="importJsonInput" accept=".json" hidden></label>
  <button class="btn ghost" id="weeklySnapshotBtn">🗓️ 儲存本週進度快照</button>
  <button class="btn ghost" id="gasConfigBtn">⚙ 雲端設定</button>
  <button class="btn ghost" id="gasSyncBtn">☁ 同步至Google雲端</button>
</div>

/* ============ Field research-code mapping ============ */
function fieldCode(path){
  let m;
  if((m = path.match(/^cases\.case(\d)\.s(\d)\.(\w+)$/))) return "C0"+m[1]+"_S"+m[2]+"_"+m[3];
  if((m = path.match(/^cases\.case(\d)\.rubric\.(\w+)$/))) return "C0"+m[1]+"_RB_"+m[2];
  if((m = path.match(/^films\.film(\d)\.rating\.(\w+)$/))) return "F"+m[1]+"_RB_"+m[2];
  if((m = path.match(/^films\.film(\d)\.(\w+)$/))) return "F"+m[1]+"_"+m[2];
  if((m = path.match(/^moduleA\.rating\.(\w+)$/))) return "MA_RB_"+m[1];
  if((m = path.match(/^moduleA\.(\w+)$/))) return "MA_"+m[1];
  if((m = path.match(/^moduleD\.(\w+)$/))) return "MD_"+m[1];
  if((m = path.match(/^studentRubric\.(\w+)$/))) return "SR_"+m[1];
  if((m = path.match(/^ai5ce\.(pre|post)\.(\w+)$/))) return "AI5CE_"+m[1].toUpperCase()+"_"+m[2];
  return path;
}
function codeToPath(code){
  let m;
  if((m = code.match(/^C0(\d)_S(\d)_(\w+)$/))) return "cases.case"+m[1]+".s"+m[2]+"."+m[3];
  if((m = code.match(/^C0(\d)_RB_(\w+)$/))) return "cases.case"+m[1]+".rubric."+m[2];
  if((m = code.match(/^F(\d)_RB_(\w+)$/))) return "films.film"+m[1]+".rating."+m[2];
  if((m = code.match(/^F(\d)_(\w+)$/))) return "films.film"+m[1]+"."+m[2];
  if((m = code.match(/^MA_RB_(\w+)$/))) return "moduleA.rating."+m[1];
  if((m = code.match(/^MA_(\w+)$/))) return "moduleA."+m[1];
  if((m = code.match(/^MD_(\w+)$/))) return "moduleD."+m[1];
  if((m = code.match(/^SR_(\w+)$/))) return "studentRubric."+m[1];
  if((m = code.match(/^AI5CE_(PRE|POST)_(\w+)$/))) return "ai5ce."+m[1].toLowerCase()+"."+m[2];
  return null;
}

/* ============ Utility ============ */
function sanitizeId(name){
  return (name||"").trim().replace(/[^A-Za-z0-9_\-\.~:@\u4e00-\u9fff]+/g,"_").slice(0,80) || "guest";
}
function getPath(obj, path){
  return path.split(".").reduce((o,k)=> (o==null?undefined:o[k]), obj);
}
function setPath(obj, path, value){
  const parts = path.split(".");
  let o = obj;
  for(let i=0;i<parts.length-1;i++){
    if(o[parts[i]] === undefined) o[parts[i]] = {};
    o = o[parts[i]];
  }
  o[parts[parts.length-1]] = value;
}
function escapeHtml(s){
  return (s||"").toString().replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function flattenAnswers(state){
  const flat = {};
  CASES.forEach(c=>{
    c.segments.forEach(seg=>{
      FIELD_DEFS.forEach(fd=>{
        const path = "cases."+c.id+".s"+seg.seg+"."+fd.key;
        flat[fieldCode(path)] = getPath(state, path) || "";
      });
    });
    ["sensitivity","reasoning","action","emotion"].forEach(k=>{
      const path = "cases."+c.id+".rubric."+k;
      flat[fieldCode(path)] = getPath(state, path);
    });
  });
  FILMS.forEach(f=>{
    FILM_FIELDS.forEach(ff=>{
      const path = "films."+f.id+"."+ff.key;
      flat[fieldCode(path)] = getPath(state, path) || "";
    });
    ["emotionAware","respectDiff","transform"].forEach(k=>{
      const path = "films."+f.id+".rating."+k;
      flat[fieldCode(path)] = getPath(state, path);
    });
    flat[fieldCode("films."+f.id+".selfCheck_shortAnswer")] = getPath(state, "films."+f.id+".selfCheck_shortAnswer") || "";
  });
  MODULE_A_PATHS.forEach(p=>{ flat[fieldCode(p)] = getPath(state,p) || ""; });
  ["moduleA.rating.clue","moduleA.rating.expression","moduleA.rating.recognize"].forEach(p=>{ flat[fieldCode(p)] = getPath(state,p); });
  MODULE_D_PATHS.forEach(p=>{ flat[fieldCode(p)] = getPath(state,p) || ""; });
  STUDENT_RUBRIC_LIKERT.forEach(it=>{ const p="studentRubric."+it.key; flat[fieldCode(p)] = getPath(state,p); });
  STUDENT_RUBRIC_TEXT.forEach(it=>{ const p="studentRubric."+it.key; flat[fieldCode(p)] = getPath(state,p) || ""; });
  ["aiUsed","aiTool","aiHelp"].forEach(k=>{ const p="studentRubric."+k; flat[fieldCode(p)] = getPath(state,p); });
  ["pre","post"].forEach(mode=>{
    AI5CE_STRUCTURE.forEach(g=>{
      g.items.forEach((txt,idx)=>{
        const p = "ai5ce."+mode+"."+g.code+"_"+(idx+1);
        flat[fieldCode(p)] = getPath(state,p);
      });
    });
  });
  return flat;
}

/* ============ Progress ============ */
function CASE_FIELD_PATHS(c){
  const paths = [];
  c.segments.forEach(seg=>{
    FIELD_DEFS.forEach(fd=> paths.push("cases."+c.id+".s"+seg.seg+"."+fd.key));
  });
  return paths;
}
const FILM_FIELD_PATHS = f => FILM_FIELDS.map(ff => `films.${f.id}.${ff.key}`);
const MODULE_A_PATHS = ["moduleA.clues","moduleA.unsettled","moduleA.stakeholders","moduleA.whyEthical","moduleA.firstQuestion","moduleA.emotionEffect","moduleA.silenceReason","moduleA.nextTime"];
const MODULE_D_PATHS = ["moduleD.goal","moduleD.optionA","moduleD.optionB","moduleD.optionC","moduleD.preferred","moduleD.preferReason","moduleD.followup","moduleD.report_initial","moduleD.report_roleplay","moduleD.report_transform","moduleD.report_future"];

function pct(paths){
  let filled = 0;
  paths.forEach(p=>{ if((getPath(STATE,p)||"").toString().trim().length>0) filled++; });
  return paths.length ? Math.round(filled/paths.length*100) : 0;
}
function overallPct(){
  let all = [...MODULE_A_PATHS, ...MODULE_D_PATHS];
  CASES.forEach(c=> all = all.concat(CASE_FIELD_PATHS(c)));
  FILMS.forEach(f=> all = all.concat(FILM_FIELD_PATHS(f)));
  return pct(all);
}
function studentRubricPaths(){
  return [...STUDENT_RUBRIC_LIKERT, ...STUDENT_RUBRIC_TEXT].map(it=>"studentRubric."+it.key);
}
function ai5cePaths(mode){
  const paths = [];
  AI5CE_STRUCTURE.forEach(g=>{ g.items.forEach((txt,idx)=> paths.push("ai5ce."+mode+"."+g.code+"_"+(idx+1))); });
  return paths;
}
function pctOn(stateObj, paths){
  let filled = 0;
  paths.forEach(p=>{ if((getPath(stateObj,p)||"").toString().trim().length>0) filled++; });
  return paths.length ? Math.round(filled/paths.length*100) : 0;
}
function overallPctOn(stateObj){
  let all = [...MODULE_A_PATHS, ...MODULE_D_PATHS];
  CASES.forEach(c=> all = all.concat(CASE_FIELD_PATHS(c)));
  FILMS.forEach(f=> all = all.concat(FILM_FIELD_PATHS(f)));
  return pctOn(stateObj, all);
}

/* ============ Persistence (Claude cloud) ============ */
async function initCapabilities(){
  if(window.claude && typeof window.claude.use === "function"){
    try{ dbCap = await window.claude.use("db"); }catch(e){ dbCap = null; }
    try{ downloadsCap = await window.claude.use("downloads"); }catch(e){ downloadsCap = null; }
    try{ sampleCap = await window.claude.use("sample"); }catch(e){ sampleCap = null; }
  }
}
async function loadState(id){
  if(dbCap){
    try{
      const ref = dbCap.collection("students").doc(id);
      const snap = await ref.get();
      if(snap.exists && snap.data()) return Object.assign(defaultState(), snap.data());
      return defaultState();
    }catch(e){ console.warn("db load failed, falling back to local", e); }
  }
  try{
    const raw = localStorage.getItem("ucs_state_"+id);
    if(raw) return Object.assign(defaultState(), JSON.parse(raw));
  }catch(e){}
  return defaultState();
}
function scheduleSave(){
  clearTimeout(saveTimer);
  setSaveStatus("編輯中…");
  saveTimer = setTimeout(doSave, 1100);
}
async function doSave(){
  if(saving){ pendingSave = true; return; }
  saving = true;
  STATE.name = STATE.name || studentId;
  STATE.updatedAt = new Date().toISOString();
  try{
    if(dbCap){
      const ref = dbCap.collection("students").doc(studentId);
      await ref.set(STATE);
      setSaveStatus("已同步至雲端（"+ new Date().toLocaleTimeString() +"）");
    }else{
      localStorage.setItem("ucs_state_"+studentId, JSON.stringify(STATE));
      setSaveStatus("已儲存於本機瀏覽器（"+ new Date().toLocaleTimeString() +"）");
    }
  }catch(e){
    console.warn("save failed", e);
    try{
      localStorage.setItem("ucs_state_"+studentId, JSON.stringify(STATE));
      setSaveStatus("雲端同步失敗，已改存本機");
    }catch(e2){ setSaveStatus("儲存失敗，請匯出JSON備份"); }
  }
  saving = false;
  if(pendingSave){ pendingSave = false; scheduleSave(); }
}
function setSaveStatus(text){
  const el = document.getElementById("saveStatus");
  if(el) el.textContent = text;
}

/* ============ Weekly snapshot (history) ============ */
async function saveWeeklySnapshot(presetLabel){
  let label = presetLabel;
  if(label === undefined){
    label = prompt("為這次存檔輸入一個標籤（例如：第5週 / W5-W6），方便之後回顧本週進度：", "");
    if(label === null) return;
  }
  const snap = {
    name: STATE.name || studentId, uid: STATE.uid || "",
    label: label || ("存檔 "+new Date().toLocaleDateString()),
    time: new Date().toISOString(),
    percent: overallPct(),
    flatAnswers: flattenAnswers(STATE)
  };
  if(dbCap){
    try{
      const ref = dbCap.collection("history").doc(studentId+"_"+Date.now());
      await ref.set(snap);
      setSaveStatus("已儲存本週進度快照（雲端）");
      return;
    }catch(e){ console.warn("history save failed", e); }
  }
  try{
    const key = "ucs_history_"+studentId;
    const arr = JSON.parse(localStorage.getItem(key) || "[]");
    arr.push(snap);
    localStorage.setItem(key, JSON.stringify(arr));
    setSaveStatus("已儲存本週進度快照（本機）");
  }catch(e){
    alert("快照儲存失敗，請改用「匯出JSON」備份整份資料。");
  }
}

async function loadTeacherList(){
  const wrap = document.getElementById("teacherTableWrap");
  if(!wrap) return;
  wrap.innerHTML = "<p>載入中…</p>";
  const rowsFor = (id, data)=>{
    const course = overallPctOn(data);
    const sr = data.studentRubric && data.studentRubric.submittedAt ? "✓" : "－";
    const pre = data.ai5ce && data.ai5ce.preSubmittedAt ? "✓" : "－";
    const post = data.ai5ce && data.ai5ce.postSubmittedAt ? "✓" : "－";
    return `<tr><td>${escapeHtml(id)}</td><td>${course}%</td><td style="text-align:center">${sr}</td><td style="text-align:center">${pre}</td><td style="text-align:center">${post}</td><td>${data.updatedAt? new Date(data.updatedAt).toLocaleString() : "-"}</td><td><button class="btn small ghost-dark" data-delrecord="${escapeHtml(id)}">刪除此筆</button></td></tr>`;
  };
  const head = `<tr><th>研究序號</th><th>課程完成度</th><th>學生自評量表</th><th>AI5C+E前測</th><th>AI5C+E後測</th><th>最後更新</th><th></th></tr>`;
  if(dbCap){
    try{
      const q = dbCap.collection("students").orderBy("updatedAt","desc").limit(100);
      const snap = await q.get();
      if(snap.empty){ wrap.innerHTML = "<p>目前尚無雲端提交紀錄。</p>"; return; }
      let rows = "";
      snap.docs.forEach(d=>{ rows += rowsFor(d.id, d.data() || {}); });
      wrap.innerHTML = `<table class="teacher-table">${head}${rows}</table>`;
    }catch(e){
      wrap.innerHTML = "<p>讀取雲端名單失敗：" + escapeHtml(String(e && e.message || e)) + "</p>";
    }
  }else{
    let rows = "";
    let count = 0;
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf("ucs_state_")===0){
        try{
          const d = JSON.parse(localStorage.getItem(k));
          const id = k.replace("ucs_state_","");
          rows += rowsFor(id, d);
          count++;
        }catch(e){}
      }
    }
    wrap.innerHTML = count? `<table class="teacher-table">${head}${rows}</table>` : "<p>本機瀏覽器目前沒有紀錄（雲端資料庫未連線）。</p>";
  }
}
async function deleteRecord(id){
  if(!confirm(`確定要刪除「${id}」這筆學習紀錄嗎？此動作無法復原。`)) return;
  if(dbCap){
    try{ await dbCap.collection("students").doc(id).delete(); }
    catch(e){ alert("雲端刪除失敗：" + (e && e.message || e)); return; }
  }
  try{ localStorage.removeItem("ucs_state_"+id); }catch(e){}
  if(id === studentId){ STATE = defaultState(); populateInputs(); }
  loadTeacherList();
}

/* ============ Event binding ============ */
function bindEvents(){
  document.body.addEventListener("input", (e)=>{
    const t = e.target;
    if(t.matches("[data-path]")){
      const path = t.getAttribute("data-path");
      if(t.type === "range"){
        setPath(STATE, path, Number(t.value));
        const valEl = document.querySelector(`[data-valfor="${path}"]`);
        if(valEl) valEl.textContent = t.value;
      }else{
        setPath(STATE, path, t.value);
      }
      refreshProgressUI();
      scheduleSave();
    }
  });
  document.body.addEventListener("change", (e)=>{
    const t = e.target;
    if(t.matches("[data-emocheck]")){
      const v = t.getAttribute("data-emocheck");
      let arr = STATE.moduleA.emotions || [];
      if(t.checked){ if(arr.indexOf(v)===-1) arr.push(v); }
      else{ arr = arr.filter(x=>x!==v); }
      STATE.moduleA.emotions = arr;
      scheduleSave();
    }
  });

  document.body.addEventListener("click", (e)=>{
    const goto = e.target.closest("[data-goto]");
    if(goto){
      const tab = goto.getAttribute("data-goto");
      const caseId = goto.getAttribute("data-case");
      switchTab(tab);
      if(caseId){
        setTimeout(()=>{
          const d = document.querySelector(`details[data-caseid="${caseId}"]`);
          if(d){ d.open = true; d.scrollIntoView({behavior:"smooth", block:"start"}); }
        }, 60);
      }
      return;
    }
    const toggle = e.target.closest(".ai-toggle");
    if(toggle){
      const panel = toggle.closest(".ai-box").querySelector(".ai-panel");
      panel.classList.toggle("hidden");
      toggle.textContent = panel.classList.contains("hidden") ? "展開詢問" : "收合";
      return;
    }
    const send = e.target.closest(".ai-send");
    if(send){ handleAiSend(send); return; }
    const del = e.target.closest("[data-delrecord]");
    if(del){ deleteRecord(del.getAttribute("data-delrecord")); return; }
    const wg = e.target.closest("[data-weekgoto]");
    if(wg){
      const wk = WEEK_MAP.find(w=> String(w.week) === wg.getAttribute("data-weekgoto"));
      if(wk){
        if(wk.type === "moduleA") switchTab("A");
        else if(wk.type === "moduleD") switchTab("D");
        else if(wk.type === "case"){
          switchTab("B");
          setTimeout(()=>{ const d = document.querySelector(`details[data-caseid="${wk.ref}"]`); if(d){ d.open = true; d.scrollIntoView({behavior:"smooth", block:"start"}); } }, 60);
        }else if(wk.type === "film"){
          switchTab("C");
          setTimeout(()=>{ const d = document.querySelector(`details[data-caseid="${wk.ref}"]`); if(d){ d.open = true; d.scrollIntoView({behavior:"smooth", block:"start"}); } }, 60);
        }
      }
      return;
    }
    const ws = e.target.closest("[data-weeksave]");
    if(ws){
      const wk = WEEK_MAP.find(w=> String(w.week) === ws.getAttribute("data-weeksave"));
      saveWeeklySnapshot(wk ? (wk.label+"｜"+wk.topic) : undefined);
      return;
    }
    const ec = e.target.closest("[data-exportcase]");
    if(ec){ exportCasePdf(ec.getAttribute("data-exportcase")); return; }
    const ef = e.target.closest("[data-exportfilm]");
    if(ef){ exportFilmPdf(ef.getAttribute("data-exportfilm")); return; }
  });

  document.body.addEventListener("keydown", (e)=>{
    if(e.target.matches(".ai-input") && e.key === "Enter"){
      const box = e.target.closest(".ai-box");
      const btn = box.querySelector(".ai-send");
      handleAiSend(btn);
    }
  });

  document.querySelectorAll("nav.tabs button").forEach(btn=>{
    btn.addEventListener("click", ()=> switchTab(btn.getAttribute("data-tab")));
  });
}

function switchTab(tab){
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.remove("active"));
  const panel = document.getElementById("panel-"+tab);
  const btn = document.querySelector(`nav.tabs button[data-tab="${tab}"]`);
  if(panel) panel.classList.add("active");
  if(btn) btn.classList.add("active");
  window.scrollTo({top:0, behavior:"smooth"});
  if(tab === "teacher") loadTeacherList();
}

/* ============ AI Assistant ============ */
const aiHistory = {};
async function handleAiSend(btn){
  const box = btn.closest(".ai-box");
  const scope = box.getAttribute("data-scope");
  const input = box.querySelector(".ai-input");
  const log = box.querySelector(".ai-log");
  const q = input.value.trim();
  if(!q) return;
  if(!sampleCap){
    appendAiMsg(log, "assistant", "（AI 助教僅在透過 Claude 發布的頁面中可用；目前此檢視無法使用 AI 功能，但你仍可繼續填寫學習單並儲存進度。）");
    input.value = "";
    return;
  }
  appendAiMsg(log, "user", q);
  input.value = "";
  const thinking = appendAiMsg(log, "assistant", "思考中…");

  const caseInfo = CASES.find(c=>c.id===scope) || FILMS.find(f=>f.id===scope);
  const contextTitle = caseInfo ? (caseInfo.title) : (scope==="moduleA" ? "前測反思" : "期末整合反思");
  const studentWork = collectScopeText(scope);

  const prompt = "你是護理倫理課程的蘇格拉底式助教。學生正在討論案例「" + contextTitle + "」。" +
    "以下是學生目前寫下的內容（可能不完整）：\n" + (studentWork || "（尚未填寫）") +
    "\n\n學生的問題：" + q +
    "\n\n請用繁體中文回答，語氣溫和鼓勵。不要直接給答案或替學生做出倫理判斷，" +
    "而是用1到2個具體的提問引導學生看到被忽略的角色觀點、倫理原則或情境線索，" +
    "並可簡短提醒可運用的分析工具（如四原則、四象限）。回答控制在120字以內。";

  aiHistory[scope] = aiHistory[scope] || [];
  aiHistory[scope].push({role:"user", content: prompt});

  try{
    const result = await sampleCap(aiHistory[scope], {
      modelTier:"quick", cache:false,
      onText: ({text})=>{ thinking.textContent = text; }
    });
    thinking.textContent = result.text;
    aiHistory[scope].push({role:"assistant", content: result.text});
  }catch(err){
    const code = err && err.code;
    let msg = "AI 助教暫時無法回應，請稍後再試。";
    if(code === "not_granted") msg = "你尚未允許本頁使用 AI 功能。";
    else if(code === "rate_limited") msg = "詢問太頻繁了，請稍等片刻再問。";
    thinking.textContent = msg;
  }
}
function appendAiMsg(log, role, text){
  const div = document.createElement("div");
  div.className = "ai-msg " + role;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}
function collectScopeText(scope){
  let obj = null;
  if(scope === "moduleA") obj = STATE.moduleA;
  else if(scope === "moduleD") obj = STATE.moduleD;
  else if(STATE.cases[scope]) obj = STATE.cases[scope];
  else if(STATE.films[scope]) obj = STATE.films[scope];
  if(!obj) return "";
  const parts = [];
  (function walk(o){
    Object.keys(o).forEach(k=>{
      const v = o[k];
      if(typeof v === "string" && v.trim()) parts.push(k+"："+v);
      else if(v && typeof v === "object" && !Array.isArray(v)) walk(v);
    });
  })(obj);
  return parts.join("\n");
}

async function exportJson(){
  const payload = {
    format: "UCS-platform-export-v2",
    name: STATE.name || studentId, uid: STATE.uid || "",
    time: new Date().toISOString(), overallPercent: overallPct(),
    state: STATE, flatAnswers: flattenAnswers(STATE)
  };
  const data = JSON.stringify(payload, null, 2);
  const filename = (studentId||"student") + "_UCS學習紀錄.json";
  if(downloadsCap){
    try{ await downloadsCap.save({filename, data}); setSaveStatus("已匯出 JSON 備份"); return; }
    catch(e){ console.warn("downloads.save failed, falling back", e); }
  }
  try{
    const blob = new Blob([data], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setSaveStatus("已匯出 JSON 備份");
  }catch(e){
    alert("匯出失敗，請改用「列印/存為PDF」功能保存紀錄。");
  }
}
function importJsonFile(file){
  if(!file) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const o = JSON.parse(r.result);
      if(!confirm("匯入會覆蓋目前這台裝置上對應欄位的作答，是否繼續？")) return;
      if(o.state){
        STATE = Object.assign(defaultState(), o.state);
        if(o.uid) STATE.uid = o.uid;
      }else if(o.answers || o.flatAnswers){
        const flat = o.answers || o.flatAnswers;
        Object.keys(flat).forEach(code=>{
          const path = codeToPath(code);
          if(path) setPath(STATE, path, flat[code]);
        });
        if(o.uid) STATE.uid = o.uid;
      }else{
        alert("這個檔案看起來不是本平台或 UCS-v5 的備份格式。");
        return;
      }
      populateInputs();
      scheduleSave();
      setSaveStatus("已匯入備份資料");
    }catch(e){
      alert("備份檔格式不正確：" + (e && e.message || e));
    }
  };
  r.readAsText(file);
}

function getGasUrl(){ try{ return localStorage.getItem("ucs_gas_url") || ""; }catch(e){ return ""; } }
function setGasUrl(url){ try{ localStorage.setItem("ucs_gas_url", url); }catch(e){} }
function configureGas(){
  const cur = getGasUrl();
  const url = prompt("請貼上老師的 Google Apps Script Web App 網址（部署後的 /exec 連結）：\n（此設定僅存在你目前使用的瀏覽器）", cur);
  if(url === null) return;
  setGasUrl(url.trim());
  alert(url.trim() ? "已設定雲端同步網址。" : "已清除雲端同步網址。");
}
async function cloudSaveGas(status){
  const url = getGasUrl();
  if(!url){ alert("尚未設定 Google 雲端同步網址，請按「⚙ 雲端設定」輸入老師提供的網址。"); return; }
  const uid = (STATE.uid||"").trim();
  if(!/^\d{3}$/.test(uid)){ alert("同步前請先在上方輸入 3 位數研究序號（001–300）。"); return; }
  const flat = flattenAnswers(STATE);
  const answers = Object.keys(flat)
    .map(k=>({key:k, answer: flat[k]===undefined||flat[k]===null ? "" : String(flat[k])}));
  setSaveStatus("同步 Google 雲端中…");
  try{
    const res = await fetch(url, {
      method: "POST",
      headers: {"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({code: uid, status: status, answers: answers})
    });
    const j = await res.json().catch(()=>({ok:true}));
    if(j && j.ok===false) throw new Error(j.error || "未知錯誤");
    setSaveStatus("☁ 已同步 Google 雲端（"+(j.time || new Date().toLocaleTimeString())+"）");
  }catch(e){
    console.warn("GAS sync failed", e);
    setSaveStatus("Google 雲端同步失敗，請確認網址或稍後再試（資料已在本機/Claude雲端保存）");
  }
}

function moduleDSectionHtml(){
  let h = `<h2>Module D · 綜合行動與期末反思</h2>`;
  MODULE_D_PATHS.forEach(p=>{ h += fld(MODULE_D_LABELS[p.split(".")[1]] || p, p); });
  return h;
}
function reportShell(title, bodyHtml){
  return `<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8">
  <title>${escapeHtml(title)}</title>
  <style>
    body{font-family:"Microsoft JhengHei","PingFang TC",Arial,sans-serif; line-height:1.7; color:#222; max-width:840px; margin:30px auto; padding:0 20px;}
    h1{color:#5a3d99; border-bottom:3px solid #764ba2; padding-bottom:8px;}
    h2{color:#764ba2; margin-top:34px; border-bottom:2px solid #ddd; padding-bottom:6px;}
    h3{color:#4a3b7a; margin-top:24px;}
    p.meta{color:#666; font-size:.92em;}
    p.printtip{background:#fff5da; border:1px solid #e2c46b; border-radius:8px; padding:8px 12px; font-size:.9em;}
    p.stagehead{font-weight:700; color:#fff; background:#8a7ac2; display:inline-block; padding:2px 10px; border-radius:6px; margin:12px 0 6px;}
    p{margin:6px 0;}
    .rcode{color:#aaa; font-size:.75em; margin-left:6px;}
    .pagebreak{page-break-before:always;}
    @media print{ a{color:#000;} p.printtip{display:none;} .rcode{display:none;} }
  </style>
  </head><body><h1>${escapeHtml(title)}</h1>${reportHeaderHtml()}${bodyHtml}
  <script>window.onload=function(){ setTimeout(function(){ try{ window.print(); }catch(e){} }, 350); };<\/script>
  </body></html>`;
}
function buildReportHtml(){
  let body = moduleASectionHtml();
  body += `<div class="pagebreak"></div><h2>Module B · 演變型情境案例</h2>`;
  CASES.forEach(c=>{ body += caseSectionHtml(c); });
  body += `<div class="pagebreak"></div><h2>Module C · 電影倫理推理</h2>`;
  FILMS.forEach(f=>{ body += filmSectionHtml(f); });
  body += `<div class="pagebreak"></div>` + moduleDSectionHtml();
  return reportShell("護理倫理 UCS 學習歷程報告", body);
}
function buildCaseReportHtml(caseId){
  const c = CASES.find(x=>x.id===caseId);
  if(!c) return reportShell("找不到案例", "<p>找不到此案例。</p>");
  const body = `<h2>Module B · 演變型情境案例</h2>` + caseSectionHtml(c);
  return reportShell(c.code+"｜"+c.title+"｜學習報告", body);
}
function buildFilmReportHtml(filmId){
  const f = FILMS.find(x=>x.id===filmId);
  if(!f) return reportShell("找不到電影", "<p>找不到此電影。</p>");
  const body = `<h2>Module C · 電影倫理推理</h2>` + filmSectionHtml(f);
  return reportShell(f.title+"｜反思報告", body);
}

async function deliverReport(html, filenameBase){
  let opened = null;
  try{ opened = window.open("", "_blank"); }catch(e){ opened = null; }
  if(opened && !opened.closed){
    try{
      opened.document.open();
      opened.document.write(html);
      opened.document.close();
      setTimeout(()=>{ try{ opened.focus(); }catch(e){} try{ opened.print(); }catch(e){ console.warn("auto-print failed", e); } }, 500);
      setSaveStatus("已在新分頁開啟報表；若未自動跳出列印視窗，請在該分頁按 Ctrl+P（Mac：Cmd+P）另存為PDF");
      return;
    }catch(e){
      console.warn("open/write failed", e);
      try{ opened.close(); }catch(e2){}
    }
  }
  const filename = filenameBase + ".html";
  if(downloadsCap){
    try{ await downloadsCap.save({filename, data: html}); setSaveStatus("已下載報表檔案，請開啟後用瀏覽器「列印 → 另存為PDF」"); return; }
    catch(e){ console.warn("downloads save failed", e); }
  }
  try{
    const blob = new Blob([html], {type:"text/html"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setSaveStatus("已下載報表檔案，請開啟後列印為PDF");
  }catch(e){
    alert("目前瀏覽器封鎖了新視窗與下載，請改用「匯出JSON」備份資料，再請老師協助列印。");
  }
}
function idBase(){ return studentId || "student"; }
async function exportPdf(){ await deliverReport(buildReportHtml(), idBase()+"_UCS學習報告"); }
async function exportCasePdf(caseId){
  const c = CASES.find(x=>x.id===caseId);
  await deliverReport(buildCaseReportHtml(caseId), idBase()+"_"+(c?c.code:caseId)+"_學習報告");
}
async function exportFilmPdf(filmId){
  await deliverReport(buildFilmReportHtml(filmId), idBase()+"_"+filmId+"_反思報告");
}

/* ============ Login / boot ============ */
async function enterCourse(){
  const uidInput = document.getElementById("uidInput");
  const uidVal = uidInput.value.trim();
  if(!/^\d{3}$/.test(uidVal)){ alert("請輸入研究助理提供的 3 位數研究序號（例如 007），格式為 UCS-XXX。"); return; }
  studentId = "UCS-" + uidVal;
  document.getElementById("enterBtn").disabled = true;
  setSaveStatus("載入紀錄中…");
  STATE = await loadState(studentId);
  STATE.uid = uidVal;
  STATE.name = studentId;
  document.getElementById("appMain").classList.remove("hidden");
  const standaloneKind = getStandaloneFormKind();
  if(standaloneKind){
    document.getElementById("appToolbar").classList.remove("hidden");
    renderStandaloneForm(standaloneKind);
    setSaveStatus(dbCap ? "已連線雲端資料庫" : "以本機瀏覽器模式運作（未連線雲端）");
    try{ localStorage.setItem("ucs_uid", uidVal); }catch(e){}
    document.getElementById("enterBtn").disabled = false;
    return;
  }
  document.getElementById("appNav").classList.remove("hidden");
  document.getElementById("appToolbar").classList.remove("hidden");
  renderHome(); renderModuleA(); renderCases(); renderFilms(); renderModuleD(); renderResources(); renderTeacher();
  populateInputs();
  switchTab("home");
  setSaveStatus(dbCap ? "已連線雲端資料庫" : "以本機瀏覽器模式運作（未連線雲端）");
  try{ localStorage.setItem("ucs_uid", uidVal); }catch(e){}
  document.getElementById("enterBtn").disabled = false;
}
function getStandaloneFormKind(){
  try{
    const v = new URLSearchParams(location.search).get("form");
    if(v==="sr" || v==="ai5ce-pre" || v==="ai5ce-post") return v;
  }catch(e){}
  return null;
}

async function boot(){
  await initCapabilities();
  bindEvents();
  document.getElementById("enterBtn").addEventListener("click", enterCourse);
  document.getElementById("uidInput").addEventListener("keydown", (e)=>{ if(e.key==="Enter") enterCourse(); });
  document.getElementById("exportJsonBtn").addEventListener("click", exportJson);
  document.getElementById("exportPdfBtn").addEventListener("click", exportPdf);
  document.getElementById("weeklySnapshotBtn").addEventListener("click", ()=> saveWeeklySnapshot());
  document.getElementById("gasConfigBtn").addEventListener("click", configureGas);
  document.getElementById("gasSyncBtn").addEventListener("click", ()=> cloudSaveGas("Draft"));
  const finishBtn = document.getElementById("finishBtn");
  if(finishBtn){
    finishBtn.addEventListener("click", async ()=>{
      await doSave();
      if(getGasUrl() && /^\d{3}$/.test((STATE.uid||"").trim())) await cloudSaveGas("Final");
      await exportPdf();
    });
  }
  document.getElementById("importJsonInput").addEventListener("change", (e)=>{
    importJsonFile(e.target.files[0]);
    e.target.value = "";
  });
  try{
    const last = localStorage.getItem("ucs_uid");
    if(last) document.getElementById("uidInput").value = last;
  }catch(e){}
  const capNote = document.getElementById("capNote");
  if(capNote){
    if(dbCap && sampleCap) capNote.textContent = "✅ 雲端儲存與 AI 助教已就緒";
    else if(window.claude) capNote.textContent = "⚠️ 部分功能（雲端儲存／AI助教）未授權，將以本機模式運作";
    else capNote.textContent = "ℹ️ 目前以本機檔案模式開啟：學習紀錄僅儲存在此瀏覽器，AI助教與Claude雲端提交需在 Claude 發布頁面中使用；可用「⚙ 雲端設定」串接老師的 Google 雲端同步";
  }
  const kind = getStandaloneFormKind();
  if(kind){
    const sub = document.getElementById("headerSub");
    const titles = {sr:"學生自評量表（附件七）", "ai5ce-pre":"AI-5C+E 能力量表｜前測（W1）", "ai5ce-post":"AI-5C+E 能力量表｜後測（W18）"};
    if(sub) sub.textContent = titles[kind] + " — 請先輸入研究序號再作答";
  }
}

document.addEventListener("DOMContentLoaded", boot);
})();
