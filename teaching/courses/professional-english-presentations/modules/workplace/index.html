<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Workplace English｜Modules</title>

  <style>
    :root{
      --bg:#fbf7ef;
      --card:#ffffff;
      --ink:#222;
      --muted:#666;
      --line:#e6e0d6;
      --pill:#111;
      --accent:#b63a2b;
      --shadow: 0 10px 28px rgba(0,0,0,.08);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      color:var(--ink);
      background:var(--bg);
      min-height:100vh;
    }

    .wrap{
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 18px 44px;
    }

    .topbar{
      display:flex;
      gap:14px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
      margin-bottom: 18px;
    }

    .title{
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .title h1{
      margin:0;
      font-size: 22px;
      letter-spacing:.2px;
    }
    .title .sub{
      color:var(--muted);
      font-size: 13px;
    }

    .controls{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    .search{
      display:flex;
      align-items:center;
      gap:10px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background:#fff;
      min-width: 260px;
    }
    .search input{
      border:none;
      outline:none;
      width: 100%;
      font-size: 14px;
      background:transparent;
    }

    .chip{
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background:#fff;
      font-size: 13px;
      cursor:pointer;
      user-select:none;
    }
    .chip.active{
      background: var(--accent);
      border-color: var(--accent);
      color:#fff;
      font-weight:600;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin-top: 14px;
    }

    @media (max-width: 980px){
      .grid{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px){
      .grid{ grid-template-columns: 1fr; }
      .search{ min-width: 100%; }
    }

    .card{
      background:var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow:hidden;
      box-shadow: none;
      transition: transform .15s ease, box-shadow .15s ease;
      cursor:pointer;
      position:relative;
    }
    .card:hover{
      transform: translateY(-3px);
      box-shadow: var(--shadow);
    }

    .thumb{
      width:100%;
      aspect-ratio: 16/9;
      background: #0c1a3a;
      display:block;
      object-fit: cover;
    }

    .meta{
      padding: 14px 14px 16px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 9px 12px;
      border-radius: 999px;
      background: var(--pill);
      color:#fff;
      font-weight:800;
      letter-spacing: .8px;
      font-size: 14px;
      min-width: 92px;
    }

    .open{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 10px 12px;
      border-radius: 999px;
      background: #f1c232;
      color:#2a2100;
      font-weight:700;
      font-size: 13px;
      white-space:nowrap;
    }

    .desc{
      padding: 0 14px 16px;
      color: var(--muted);
      font-size: 13px;
      line-height:1.45;
      min-height: 38px;
    }

    .footer{
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
    }

    .kbd{
      border:1px solid var(--line);
      background:#fff;
      border-bottom-width:2px;
      padding: 2px 8px;
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      color:#333;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title">
        <h1>Workplace English Presentation</h1>
        <div class="sub">點選 Unit 直接開啟「開始課程.html」｜不使用 overlay / modal（避免出現 Web Object 本機路徑文字）</div>
      </div>

      <div class="controls">
        <div class="search" title="搜尋單元">
          🔎 <input id="q" type="text" placeholder="Search unit (e.g., 01 / 1 / Unit 3)" />
        </div>
        <div id="chipAll" class="chip active">全部 All</div>
        <div id="chipWork" class="chip">Workplace</div>
      </div>
    </div>

    <div id="grid" class="grid"></div>

    <div class="footer">
      如果你剛替換縮圖但網頁仍顯示舊畫面，請用 <span class="kbd">Ctrl</span> + <span class="kbd">F5</span> 強制重新整理（清快取）。
    </div>
  </div>

  <script>
    // ✅ 只要確保每個 Unit 資料夾底下都有「開始課程.html」
    // 例如：modules/workplace/Unit1/開始課程.html
    //      modules/workplace/Unit2/開始課程.html

    const UNITS = Array.from({length: 15}, (_, i) => {
      const n = i + 1;
      const unitDir = `Unit${n}`;
      const startPage = `${unitDir}/開始課程.html`;
      // 若你已經把 mobile 的縮圖全部換成同一張藍圖，也可以不顯示任何 thumb。
      // 這裡我們仍嘗試用 mobile 裡的第一張 jpg 當縮圖（抓不到也沒關係）。
      const thumbFallback = `${unitDir}/mobile/`; // 只是佔位，真正顯示不依賴它
      return { n, unitDir, startPage, thumbFallback };
    });

    const grid = document.getElementById('grid');
    const q = document.getElementById('q');
    const chipAll = document.getElementById('chipAll');
    const chipWork = document.getElementById('chipWork');

    function pad2(x){ return String(x).padStart(2,'0'); }

    // 只顯示簡潔資訊（Coursera-like）
    function render(list){
      grid.innerHTML = '';
      list.forEach(u => {
        const card = document.createElement('div');
        card.className = 'card';
        card.setAttribute('data-unit', u.n);

        // 不強依賴任何圖片，避免「no image / cache」問題。
        // 你若想要顯示縮圖：把 src 改成你確認存在的某張圖（或改成 cover）。
        const img = document.createElement('img');
        img.className = 'thumb';
        img.alt = `UNIT ${pad2(u.n)}`;
        img.src = `../nursing/../workplace/${u.unitDir}/mobile/` + 'cover.jpg'; // 不存在也沒關係，會顯示背景色
        img.onerror = () => { img.removeAttribute('src'); img.style.background = '#0c1a3a'; };

        const meta = document.createElement('div');
        meta.className = 'meta';

        const pill = document.createElement('div');
        pill.className = 'pill';
        pill.textContent = `UNIT ${pad2(u.n)}`;

        const open = document.createElement('div');
        open.className = 'open';
        open.textContent = '▶ 開始';

        meta.appendChild(pill);
        meta.appendChild(open);

        const desc = document.createElement('div');
        desc.className = 'desc';
        desc.textContent = 'Click to start the lesson.';

        card.appendChild(img);
        card.appendChild(meta);
        card.appendChild(desc);

        card.addEventListener('click', () => {
          // 直接跳轉，不用 modal/overlay
          window.location.href = u.startPage;
        });

        grid.appendChild(card);
      });
    }

    function filter(){
      const keyword = (q.value || '').trim().toLowerCase();
      let list = UNITS;

      if(keyword){
        list = list.filter(u => {
          const a = String(u.n);
          const b = pad2(u.n);
          return (`unit ${a}`.includes(keyword) || `unit ${b}`.includes(keyword) || a.includes(keyword) || b.includes(keyword));
        });
      }
      render(list);
    }

    q.addEventListener('input', filter);

    chipAll.addEventListener('click', () => {
      chipAll.classList.add('active');
      chipWork.classList.remove('active');
      q.value = '';
      render(UNITS);
    });

    chipWork.addEventListener('click', () => {
      chipWork.classList.add('active');
      chipAll.classList.remove('active');
      filter();
    });

    render(UNITS);
  </script>
</body>
</html>
