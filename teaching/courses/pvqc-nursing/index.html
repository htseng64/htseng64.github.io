<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PVQC NURSING ESCAPE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-wrapper">
        <div id="stage-banner" class="stage-learning">
            PHASE: <span id="stage-text">STAGE 1 - RECOGNITION</span>
        </div>

        <header>
            <input type="text" id="student-id" placeholder="ENTER STUDENT ID">
            <div id="xp-display">XP: 0</div>
        </header>

        <div class="monitor">
            <div id="clinical-hint">ENTER ID TO START SHIFT</div>
            
            <div id="choice-area" class="button-grid"></div>

            <div id="spelling-area" class="hidden">
                <input type="text" id="user-answer" placeholder="TYPE SPELLING HERE..." autocomplete="off">
                <br>
                <button onclick="processAnswer()" id="submit-btn">UNLOCK WARD</button>
            </div>
        </div>
        <div id="feedback"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
