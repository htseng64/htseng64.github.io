<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>成果報告</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script src="../../config/course-config.js"></script><style>body{background:#070c1a;color:#e2e8f0;font-family:Arial;margin:0;padding:24px}.wrap{max-width:1100px;margin:auto}.card{background:#0d1628;border-radius:20px;padding:20px;margin:14px 0}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.num{font-size:32px;color:#2dd4bf;font-weight:900}a,button{background:#f5c842;color:#111;border:0;border-radius:12px;padding:10px;text-decoration:none;font-weight:900}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid rgba(255,255,255,.1);padding:8px;text-align:left}</style></head><body><div class=wrap><a href=index.html>← 總控台</a><button onclick=exportExcel()>匯出 Excel</button><button onclick=window.print()>列印/PDF</button><h1>📊 成果報告</h1><div class=kpis><div class=card><div class=num id=n1>0</div>參與學生</div><div class=card><div class=num id=n2>0</div>組別</div><div class=card><div class=num id=n3>0</div>成績紀錄</div><div class=card><div class=num id=n4>--</div>平均分</div></div><div class=card><h2>課程目標</h2><ul id=obj></ul></div><div class=card><h2>成績紀錄</h2><table><thead><tr><th>時間</th><th>暱稱</th><th>組別</th><th>遊戲</th><th>個人分</th><th>團體分</th></tr></thead><tbody id=rows></tbody></table></div></div><script>let data=[];obj.innerHTML=COURSE_CONFIG.objectives.map(x=>'<li>'+x+'</li>').join('');async function load(){const sb=supabase.createClient(localStorage.getItem('SUPABASE_URL'),localStorage.getItem('SUPABASE_KEY'));const p=await sb.from('participants').select('*');const s=await sb.from('scores').select('*').order('created_at',{ascending:false});data=s.data||[];const teams=new Set((p.data||[]).map(x=>x.team_name).filter(Boolean));n1.textContent=(p.data||[]).length;n2.textContent=teams.size;n3.textContent=data.length;n4.textContent=data.length?(data.reduce((a,b)=>a+Number(b.individual_score||0),0)/data.length).toFixed(1):'--';rows.innerHTML=data.map(x=>'<tr><td>'+new Date(x.created_at).toLocaleString('zh-TW')+'</td><td>'+x.nickname+'</td><td>'+x.team_name+'</td><td>'+x.game_name+'</td><td>'+x.individual_score+'</td><td>'+x.team_score+'</td></tr>').join('')}function exportExcel(){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data),'scores');XLSX.writeFile(wb,'研究與實證護理概論_成果資料.xlsx')}load()</script></body></html>
