<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>開課展示</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>body{background:#070c1a;color:#e2e8f0;font-family:Arial,'Noto Sans TC';margin:0}.main{max-width:1100px;margin:auto;padding:30px;display:grid;grid-template-columns:1fr 380px;gap:20px}.card{background:#0d1628;border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:24px;text-align:center}h1{font-size:42px;color:#f5c842}#qr{background:white;padding:18px;border-radius:22px;display:inline-block;min-width:300px;min-height:300px;color:#111}.pass{font-size:30px;font-weight:900;color:#f5c842;margin:18px}button,a{border:0;border-radius:12px;padding:12px 16px;font-weight:900;background:#f5c842;color:#111;margin:6px;cursor:pointer;text-decoration:none}input{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:white;margin:8px 0}</style></head><body><div style="padding:14px"><a href="index.html">← 總控台</a></div><div class=main><section class=card><h1>研究與實證護理概論</h1><p>請掃描 QR Code 加入課堂</p><div id=qr>請先建立課堂</div><div id=pass class=pass></div><div id=link style="word-break:break-all;color:#8892a8"></div></section><section class=card><h2 style="color:#f5c842">老師設定</h2><input id=url placeholder="Supabase URL"><input id=key placeholder="Publishable key"><input id=name value="研究與實證護理概論"><input id=code placeholder="今日通關密語"><button onclick=start()>🚀 一鍵開課</button><div id=msg></div></section></div><script>url.value=localStorage.getItem('SUPABASE_URL')||'';key.value=localStorage.getItem('SUPABASE_KEY')||'';code.value=localStorage.getItem('LAST_PASSCODE')||'';async function start(){if(!url.value||!key.value||!code.value){alert('請填 URL/key/通關密語');return}localStorage.setItem('SUPABASE_URL',url.value.trim());localStorage.setItem('SUPABASE_KEY',key.value.trim());localStorage.setItem('LAST_PASSCODE',code.value.trim());const sb=supabase.createClient(url.value.trim(),key.value.trim());const r=await sb.from('sessions').insert({session_name:name.value,passcode:code.value.trim(),active:true}).select().single();if(r.error){msg.textContent='建立失敗：'+r.error.message;return}localStorage.setItem('LAST_SESSION_ID',r.data.id);const u=new URL('student-entry.html',location.href).href+'?session_id='+encodeURIComponent(r.data.id)+'&sb_url='+encodeURIComponent(url.value.trim())+'&sb_key='+encodeURIComponent(key.value.trim());qr.innerHTML='';new QRCode(qr,{text:u,width:280,height:280});pass.textContent='通關密語：'+code.value.trim();link.textContent=u}</script></body></html>
