<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>排行榜</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>body{background:#070c1a;color:#e2e8f0;font-family:Arial;margin:0;padding:24px}.wrap{max-width:1000px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#0d1628;border-radius:20px;padding:20px}.row{display:grid;grid-template-columns:40px 1fr 80px;gap:10px;padding:10px;border-bottom:1px solid rgba(255,255,255,.08)}.score{color:#f5c842;font-weight:900;text-align:right}a,button{background:#f5c842;color:#111;border:0;border-radius:12px;padding:10px;text-decoration:none;font-weight:900}</style></head><body><div class=wrap><a href=index.html>← 總控台</a><button onclick=load()>更新</button><h1>🏆 排行榜</h1><div class=grid><div class=card><h2>個人</h2><div id=personal></div></div><div class=card><h2>小組</h2><div id=team></div></div></div></div><script>async function load(){const sb=supabase.createClient(localStorage.getItem('SUPABASE_URL'),localStorage.getItem('SUPABASE_KEY'));const r=await sb.from('scores').select('*');if(r.error){alert(r.error.message);return}const p={},t={};(r.data||[]).forEach(x=>{p[x.nickname||'匿名']=(p[x.nickname||'匿名']||0)+Number(x.individual_score||0);t[x.team_name||'未分組']=(t[x.team_name||'未分組']||0)+Number(x.team_score||0)});function o(obj){return Object.entries(obj).sort((a,b)=>b[1]-a[1]).map((x,i)=>'<div class=row><div>'+(i+1)+'</div><div>'+x[0]+'</div><div class=score>'+x[1]+'</div></div>').join('')||'尚無資料'}personal.innerHTML=o(p);team.innerHTML=o(t)}load()</script></body></html>
