<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>評值QR</title><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>body{background:#070c1a;color:#e2e8f0;font-family:Arial;margin:0;padding:24px}.wrap{max-width:900px;margin:auto}.card{background:#0d1628;border-radius:20px;padding:20px;margin:14px 0}.qr{background:white;padding:12px;border-radius:12px;display:inline-block;min-width:170px;min-height:170px;color:#111}input{width:100%;padding:12px;border-radius:12px;background:rgba(255,255,255,.06);color:white;margin:8px 0}button,a{background:#f5c842;color:#111;border:0;border-radius:12px;padding:10px;text-decoration:none;font-weight:900}</style></head><body><div class=wrap><a href=index.html>← 總控台</a><h1>🔗 評值表單 QR</h1><div class=card><input id=course placeholder='課程評值 viewform'><input id=peer placeholder='小組互評 viewform'><button onclick=save()>儲存</button></div><div id=out></div></div><script>function save(){localStorage.setItem('FORM_COURSE',course.value);localStorage.setItem('FORM_PEER',peer.value);render()}function render(){course.value=localStorage.getItem('FORM_COURSE')||'';peer.value=localStorage.getItem('FORM_PEER')||'';out.innerHTML='';[['課程評值',course.value],['小組互評',peer.value]].forEach((x,i)=>{const d=document.createElement('div');d.className='card';d.innerHTML='<h2>'+x[0]+'</h2><div class=qr id=q'+i+'>'+(x[1]?'':'尚未設定')+'</div><p style=word-break:break-all;color:#8892a8>'+x[1]+'</p>';out.appendChild(d);if(x[1])new QRCode(document.getElementById('q'+i),{text:x[1],width:150,height:150})})}render()</script></body></html>
