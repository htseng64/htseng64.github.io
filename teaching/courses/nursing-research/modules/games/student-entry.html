<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>學生加入課堂</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>body{background:#070c1a;color:#e2e8f0;font-family:Arial,'Noto Sans TC';min-height:100vh;display:flex;align-items:center;justify-content:center}.card{max-width:460px;width:94%;background:#0d1628;border-radius:24px;padding:28px;text-align:center}h1{color:#f5c842}input{width:100%;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:white;margin:8px 0;text-align:center}button{width:100%;padding:14px;border:0;border-radius:14px;background:#2dd4bf;font-weight:900;margin-top:10px}.box{display:none;text-align:left;background:rgba(45,212,191,.08);border-radius:14px;padding:14px;margin:12px 0}.on{display:block}.msg{color:#f472b6}.ok{color:#2dd4bf}</style></head><body><div class=card><h1>📱 加入課堂</h1><input id=pass placeholder=通關密語><input id=sid placeholder=學號><button onclick=verify()>查詢學號</button><div id=found class=box></div><input id=nick placeholder=遊戲暱稱 style=display:none><button id=joinBtn onclick=join() style=display:none;background:#f5c842>加入課堂</button><div id=msg class=msg></div></div><script>const p=new URLSearchParams(location.search);let sb,session,stu;function m(t,ok=false){msg.textContent=t;msg.className=ok?'msg ok':'msg'}async function init(){const u=p.get('sb_url'),k=p.get('sb_key'),s=p.get('session_id');if(!u||!k||!s){m('請重新掃描老師產生的 QR Code');return}sb=supabase.createClient(u,k);const r=await sb.from('sessions').select('*').eq('id',s).single();if(r.error){m('找不到課堂');return}session=r.data;m('已連線，請輸入資料',true)}async function verify(){if(pass.value.trim()!==session.passcode){m('通關密語錯誤');return}const r=await sb.from('students').select('*').eq('student_id',sid.value.trim()).limit(1);if(r.error||!r.data.length){m('查無此學號');return}stu=r.data[0];found.innerHTML='✅ 找到：'+(stu.name||'')+'<br>組別：'+(stu.team_name||'');found.classList.add('on');nick.style.display='';nick.value=stu.nickname||'';joinBtn.style.display='';m('請輸入暱稱後加入',true)}async function join(){const row={session_id:session.id,student_id:stu.student_id,name:stu.name||'',nickname:nick.value.trim(),team_name:stu.team_name||'',created_at:new Date().toISOString()};const r=await sb.from('participants').insert(row);if(r.error){m('加入失敗：'+r.error.message);return}localStorage.setItem('CURRENT_STUDENT',JSON.stringify(row));m('✅ 加入成功！',true)}init()</script></body></html>
