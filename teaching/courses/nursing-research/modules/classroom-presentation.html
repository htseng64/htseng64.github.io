{num:11,title:"研究工具之信度與效度",en:"Reliability and Validity of Research Tools",
content:`
<div class="def-box"><span class="def-term">信度（Reliability）</span><span class="def-en">測試研究工具的<span class="hl-gold">一致性（Consistency）</span>、<span class="hl-teal">穩定性（Stability）</span>及<span class="hl-coral">準確性（Accuracy）</span>是否值得信賴，三者缺一不可。</span></div>
<div class="imp-box"><span class="hl-gold">信度是效度的先決條件：</span>一個可信的工具不一定有效；但若工具根本不可信，效度一定有問題。<br>比喻：一把每次量都不一樣的尺，根本無法說它準不準。</div>

<div class="sh">體重計範例：理解信度與效度的關係</div>
<table class="cmp-table">
<tr><th>情境</th><th>三次測量值</th><th>真實體重</th><th>信度</th><th>效度</th><th>問題所在</th></tr>
<tr><td>體重計A</td><td>60, 70, 80 kg</td><td>70 kg</td><td class="bad">低（差異大）</td><td class="bad">無法評估</td><td>一致性、穩定性差</td></tr>
<tr><td>體重計B</td><td>39, 40, 41 kg</td><td>70 kg</td><td class="good">高（一致）</td><td class="bad">低（偏差大）</td><td>準確性不足</td></tr>
<tr><td>理想工具</td><td>69, 70, 71 kg</td><td>70 kg</td><td class="good">高</td><td class="good">高</td><td>✓ 可信賴</td></tr>
</table>

<div class="sh">信度的四種類型</div>

<div class="sh2">① 再測信度（Test-Retest Reliability）</div>
<div class="cp">在<span class="hl-gold">不同時間</span>重複測試，應得到相同結果；又稱穩定信度（Stability Reliability）。</div>
<div class="cp">使用 <span class="kp">皮爾森相關係數（r）</span> 檢定，一般以 <span class="hl-gold">r ≥ 0.7</span> 為高度相關標準（非金科玉律，僅為經驗值）。</div>
<div class="imp-box">再測信度完整判斷需同時滿足兩條件：<br>① <span class="hl-gold">r ≥ 0.7（高度相關）</span> + ② 成對t檢定（paired t-test）或 Wilcoxon符號等級檢定顯示<span class="hl-teal">兩次無顯著差異</span><br>建議亦使用 <span class="kp-t">ICC（內在等級相關係數）</span> 作為更嚴謹的指標。<br>間隔時間：以<span class="hl-coral">1-4週（平均2週）</span>為宜——太久外在因素介入，太短受記憶影響。</div>

<div class="sh2">② 內在一致性（Internal Consistency）— Cronbach's Alpha（α）</div>
<div class="cp">假設量表內12個題目都與「疲憊程度」有關，若這些題目<span class="hl-teal">相互間存在相關性且能互相補足</span>，則稱為內在一致性高。可將12題分數相加成一個「疲憊程度總分」統一分析。</div>
<div class="g3">
  <div class="c-card-r"><div class="c-head">α &lt; 0.7</div>部分題目同質性受到質疑，<span class="hl-coral">問卷可能需要修改</span>。</div>
  <div class="c-card-g"><div class="c-head">α = 0.7 ~ 0.9</div><span class="hl-green">一般認為可以接受</span>的範圍。</div>
  <div class="c-card-r"><div class="c-head">α &gt; 0.9</div>各題目間重複過多，<span class="hl-coral">或許可以刪減部分題目</span>。</div>
</div>
<div class="cp">若量表每個題目只有<strong>是/否（0/1）</strong>兩個答案，應使用 <span class="kp">KR-20（Kuder-Richardson 20）係數</span>，計算方式與Cronbach's α 相似。</div>

<div class="sh2">③ 折半信度（Split-Half Reliability）</div>
<div class="cp">把量表的題目一分為二（<span class="hl-gold">奇數題為一組、偶數題為另一組</span>），若兩部分的平均得分相差無幾且具高度相關，則信度得到進一步證實。注意：不要以前半部和後半部作分組（會因題目性質相似而使後段受試者感到厭倦，影響信度）。</div>

<div class="sh2">④ 測試者一致性信度（Inter-Rater Reliability）</div>
<div class="cp">由<span class="hl-teal">不同的研究人員</span>觀察同一名個案，應得到十分類似的結果。若兩名評分者分數相類似，便可算評審程序具可靠性、客觀性。使用的統計方法與再測信度相同（連續型：ICC；類別型：Kappa係數）。</div>

<div class="sh2">⑤ 類別型數據的信度指標——Kappa 係數</div>
<div class="cp">類別型數據應使用 <span class="kp">Kappa係數</span> 代替皮爾森相關係數，用 <span class="kp">McNemar檢定</span> 代替成對t檢定。</div>
<table class="cmp-table">
<tr><th>Kappa值</th><th>信度判讀</th></tr>
<tr><td>&gt; 0.75</td><td class="good">極佳信度</td></tr>
<tr><td>0.4 ~ 0.75</td><td>可接受之良好信度</td></tr>
<tr><td>&lt; 0.4</td><td class="bad">研究工具信度不可靠</td></tr>
</table>

<div class="sh">信度測試常見錯誤</div>
<ul class="b-list">
  <li><span class="hl-coral">以偏概全：</span>只測試Cronbach's α，以為工具可信。殊不知量表雖有高度內在一致性，但不同訪員訪問同一對象可能有不同答案（測試者一致性信度未建立）</li>
  <li><span class="hl-gold">未說明信度係數種類：</span>只報告係數數值，未說明是哪一種信度係數</li>
  <li>建議：在可能且合適的情況下，進行<strong>最少兩項</strong>信度檢定</li>
</ul>

<div class="sh">效度（Validity）的三大類型</div>
<div class="def-box"><span class="def-term">效度</span><span class="def-en">測量工具能<span class="hl-gold">精準測量到所欲測量概念</span>的程度；即測量的準確性。證明效度比證明信度更複雜、更困難。</span></div>

<div class="sh2">① 內容效度（Content Validity）</div>
<div class="cp">在量表設計完成後，請該領域的<span class="hl-gold">專家及研究對象</span>對量表內容提供意見，評估工具是否充分涵蓋所要測量的概念。</div>
<div class="g2">
  <div class="c-card-t"><div class="c-head">專家效度（Expert Validity）</div>完全由<span class="hl-teal">專家</span>審定工具之有效與否；需選擇該研究領域的權威專家進行審查，提供具體建議。</div>
  <div class="c-card"><div class="c-head">表面效度（Face Validity）</div>以比較粗淺的方法，就量表或工具是否「<span class="hl-gold">看似</span>」足夠收集研究所需資料進行評估；是最簡單但也是最主觀的效度評估方式。</div>
</div>

<div class="sh2">② 建構效度（Construct Validity）</div>
<div class="cp"><span class="hl-gold">建構（Construct）</span>是一個概念（concept）、一種特質（trait），利用一些可以觀察到的事物來反映無法直接測量的理念。<br>例如：「失智」是一個建構——無法直接測量，但可透過定向感、反應時間、語言及分析能力等可觀察的表現加以評估。</div>
<div class="g2">
  <div class="c-card accent-gold"><div class="c-head">因素分析（Factor Analysis）</div>將問卷中有相關的變項組合成「因子」，每個因子代表一個建構；若p個題目可濃縮為k個因子（k&lt;p），每個因子代表一種概念。<br><span class="hl-coral">限制：</span>若問卷包含兩個高度相關的建構（如「憂鬱」和「焦慮」），因素分析可能將兩者混合。<span class="hl-teal">解決：</span>使用羅素分析（Rasch Analysis）篩選題目。</div>
  <div class="c-card accent-teal"><div class="c-head">對照組比較法（Contrasted Group）</div>又稱「已知組別比較」，刻意選擇在欲研究建構上有顯著差異的兩組，以t檢定或ANOVA證實兩組在該建構上有顯著差異，間接肯定建構效度。<br><em>例：用「憂鬱量表」比較憂鬱病人 vs 健康人群，若能顯著區分則建構效度成立。</em></div>
  <div class="c-card accent-coral"><div class="c-head">收斂法（Convergent Validity）</div>與另一份已具良好效度的相關量表進行相關分析，若<span class="hl-green">相關係數高</span>，表示兩份量表測量相同的構念。<br><em>例：新憂鬱量表與已驗證的BDI量表高度相關（r=0.85）。</em></div>
  <div class="c-card accent-green"><div class="c-head">分歧法（Divergent Validity）</div>又稱辨別效度，若是<span class="hl-coral">兩個不同建構</span>，則應該沒有多大相關。<br><em>例：「憂鬱量表」與「社會支持量表」應呈<strong>負相關</strong>（憂鬱高者社會支持較少）；若相關係數為負且低於設定值，則分歧效度成立。</em></div>
</div>
<div class="imp-box">建構效度需經過<span class="hl-gold">一連串步驟</span>，而非只執行其中一個方法。最起碼應執行<strong>兩個或兩個以上</strong>的建構效度檢定方法。</div>

<div class="sh2">③ 效標關聯效度（Criterion-Related Validity）</div>
<div class="cp">計算量表得分與<span class="hl-gold">實際效果、實際現象的相關</span>（並非與另一建構的相關）。</div>
<div class="g2">
  <div class="c-card accent-gold"><div class="c-head">預估效度（Predictive Validity）</div>量表目的在<span class="hl-gold">預測</span>個案未來的狀態。例如：入院時的壓瘡風險評估量表（Braden Scale）得分，與個案日後實際是否發生壓瘡的機率相關——若有壓瘡者得分顯著低於無壓瘡者，表示預估效度成立。<br>統計方法：雙樣本t檢定比較兩組平均分數是否達顯著差異。</div>
  <div class="c-card accent-teal"><div class="c-head">同時效度（Concurrent Validity）</div>不需要等待結果，<span class="hl-teal">同時</span>收集量表得分與效標資料進行相關分析。例如：護生的考試成績與其畢業後立即評估的臨床照護能力的相關性。<br>統計方法：皮爾森或斯皮爾曼相關係數。</div>
</div>

<div class="sh">信度 vs 效度 關係總整理</div>
<table class="cmp-table">
<tr><th>類型</th><th>問的問題</th><th>評估方式</th><th>常用統計</th></tr>
<tr><td><span class="hl-gold">再測信度</span></td><td>不同時間測量結果是否一致？</td><td>間隔1-4週重測</td><td>r, ICC, paired t-test</td></tr>
<tr><td><span class="hl-teal">內在一致性</span></td><td>量表題目間是否測量同一構念？</td><td>所有題目同時施測</td><td>Cronbach's α, KR-20</td></tr>
<tr><td><span class="hl-coral">測試者一致性</span></td><td>不同評分者的判斷是否一致？</td><td>兩位評分者同時評估</td><td>Kappa, ICC</td></tr>
<tr><td><span class="hl-gold">內容效度</span></td><td>量表是否涵蓋所要測量的概念？</td><td>專家審查</td><td>內容效度指標（CVI）</td></tr>
<tr><td><span class="hl-teal">建構效度</span></td><td>量表是否真正測量到目標構念？</td><td>因素分析、對照組比較</td><td>FA, t-test, r</td></tr>
<tr><td><span class="hl-coral">效標關聯效度</span></td><td>量表得分是否與實際結果相符？</td><td>與效標（標準）比較</td><td>t-test, r</td></tr>
</table>
`,
quiz:[
{q:"信度（Reliability）的三個必要條件是？",opts:["準確性、可行性、穩定性","一致性、穩定性、準確性","信效度、可信度、可靠性","敏感性、特異性、準確性"],ans:1,exp:"信度建立目的為測試研究工具的一致性、穩定性及準確性，三者缺一不可。"},
{q:"某壓瘡風險量表的得分可以預測病人日後是否發生壓瘡，有壓瘡者得分顯著低於無壓瘡者，此量表具有哪種效度？",opts:["內容效度","建構效度","預估效度（效標關聯效度）","表面效度"],ans:2,exp:"預估效度是效標關聯效度的一種，量表的目的在預測個案未來的狀態，用t檢定比較有壓瘡與無壓瘡兩組的量表平均分數是否達顯著差異，來驗證預估效度。"},
{q:"「折半信度」在量表題目分組時，建議採用哪種方式？",opts:["前半部題目為一組，後半部為另一組","奇數題為一組，偶數題為另一組","隨機選取題目分為兩組","研究者依判斷決定分組方式"],ans:1,exp:"折半信度建議以奇數題為一組、偶數題為另一組，避免使用前後半部分組，因為後半段受試者容易因題目性質類似而感到厭倦，影響後半段信度，造成前後半部信度不一。"},
{q:"「建構效度（Construct Validity）」的核心概念是什麼？",opts:["量表包含足夠的題目涵蓋研究主題","量表確實測量到所欲測量的抽象概念（建構），而非只是看起來像","量表在不同時間施測結果一致","量表題目間具有高度相關"],ans:1,exp:"建構效度是指量表確實測量到目標「建構」（概念/特質）的程度；建構是用可觀察事物反映無法直接測量的理念，如以定向感等測量「失智程度」這個建構。"},
{q:"「收斂法（Convergent Validity）」與「分歧法（Divergent Validity）」的差異是？",opts:["前者需要使用因素分析，後者需要對照組比較","前者驗證兩個相關構念量表間的高相關；後者驗證兩個不同構念量表間的低相關（或負相關）","前者適用於量性研究，後者適用於質性研究","兩者使用完全相同的統計方法"],ans:1,exp:"收斂法：新量表與已驗證的相關量表呈高度正相關，表示兩者測量相同構念。分歧法：與不同構念的量表呈低相關或負相關（如憂鬱與社會支持），表示能辨別不同構念，具辨別效度。"}
]},

{num:12,title:"資料收集方法與處理技巧",en:"Data Collection and Management Techniques",
content:`
<div class="def-box"><span class="def-term">資料（Data）</span><span class="def-en">來自不同研究對象的許多變項所組成，包含<span class="hl-gold">變項值（variables）</span>和<span class="hl-teal">研究對象（subjects）</span>。變項值依所屬型態歸為：文字型、數字型、日期型及邏輯型。</span></div>

<div class="sh">資料的排列方式</div>
<table class="cmp-table">
<tr><th>排列方式</th><th>意涵</th><th>範例</th></tr>
<tr><td><span class="hl-gold">直欄（Column）</span></td><td>相同意義的資料值，稱為變項；給予每個變項一個名稱</td><td>「身高」欄：170, 165, 162</td></tr>
<tr><td><span class="hl-teal">橫列（Row）</span></td><td>表示變項的值來自哪一位研究對象</td><td>「張三」列：男, 170cm, 68kg</td></tr>
</table>

<div class="sh">變項收集方法（六大類）</div>
<div class="g2">
  <div class="c-card accent-gold"><div class="c-head">① 自我陳述（Self-Report）</div>由研究對象本人述說；資料常是<span class="hl-gold">主觀或心理感受</span>。<br><span class="hl-coral">不適合：</span>資料非常敏感、研究對象無法提供，或需測量的客觀數據（如血液生化值）。<br>分為<span class="kp">自填</span>與<span class="kp">訪談</span>兩種形式。</div>
  <div class="c-card accent-teal"><div class="c-head">② 他人陳述（Report by Others）</div>研究對象無法親自提供資料時，由<span class="hl-teal">親友代為提供</span>（如辭世者、無意識者、幼兒）。<br><span class="hl-coral">限制：</span>若資料為心理感受，他人未必能反映真相。</div>
  <div class="c-card accent-coral"><div class="c-head">③ 觀察法（Observation）</div>由第三者觀察研究對象一段時間；分為<span class="kp-r">參與性觀察</span>（研究者參與其中）與<span class="kp-r">非參與性觀察</span>（旁觀者角色）。</div>
  <div class="c-card accent-green"><div class="c-head">④ 儀器測量（Instrument Measurement）</div>使用儀器設備測量生理指標，如血壓計、心電圖、血氧測定儀等；結果較為<span class="hl-green">客觀精準</span>。</div>
  <div class="c-card accent-purple"><div class="c-head">⑤ 生理測量（Physiological Measurement）</div>包括血液生化檢查、尿液分析等實驗室檢查；資料客觀可靠但侵入性較高。</div>
  <div class="c-card accent-gold"><div class="c-head">⑥ 現有資料（Existing Data）</div>使用病歷、健保資料庫、醫院記錄等已存在的資料；即次級資料分析（Secondary Analysis）。</div>
</div>

<div class="sh">自填 vs 訪談的比較</div>
<table class="cmp-table">
<tr><th>方法</th><th>優點</th><th>缺點</th><th>適用對象</th></tr>
<tr><td><span class="hl-gold">自填（Self-written）</span></td><td>經濟、可短期收集大量資料；不受訪員偏差影響</td><td>研究對象可能對題目有不同解讀</td><td>識字的研究對象</td></tr>
<tr><td><span class="hl-teal">訪談（Interview）</span></td><td>訪員可解釋題目、提高資料品質、判斷答案合理性</td><td>耗費人力金錢；可能產生<span class="hl-coral">訪員偏差</span>；只適合小樣本</td><td>識字程度低或需要解釋的情況</td></tr>
</table>

<div class="imp-box">避免訪員偏差的方法：製作<span class="hl-gold">訪談手冊</span>、訓練訪員、採用<span class="hl-teal">雙盲（Double Blind）</span>設計——不讓評估者知道研究對象接受哪一種處置。</div>
`,
quiz:[
{q:"在研究資料表格中，「直欄（Column）」代表什麼？",opts:["來自某一位研究對象的所有資料","相同意義的資料值，稱為變項，並給予每個變項一個名稱","資料的收集日期","研究對象的編號"],ans:1,exp:"研究者通常把相同意義的資料值以直欄列出，稱為變項，並給予每個變項一個名稱以便日後統計分析；橫列代表某位研究對象的資料。"},
{q:"「自我陳述（Self-Report）」的最大限制是？",opts:["需要特殊儀器設備","只能用於量性研究","資料常具主觀性，且無法取得需測量的客觀數據（如血液生化值）","花費時間比訪談更長"],ans:2,exp:"自我陳述的資料常是主觀或心理感受；若需要客觀測量（如血液生化值），自我陳述無法提供此類資料，此為其主要限制。"},
{q:"「雙盲（Double Blind）設計」在資料收集中的目的是？",opts:["讓所有研究人員都知道分組情況","不讓評估者或訪員知道研究對象接受哪一種藥物或護理方案，避免訪員偏差","要求研究對象自行填寫問卷","減少研究樣本數"],ans:1,exp:"雙盲設計中，不讓評估者或訪員知道研究對象接受哪一種藥物或護理方案，可以避免評估者或訪員偏差，提高資料的客觀性。"},
{q:"「他人陳述（Report by Others）」最適合用於何種情況？",opts:["研究對象能清楚表達自身感受","研究對象為一般健康成人","研究對象為無意識者、幼兒或已辭世者等無法親自提供資料的情況","資料需要高度客觀測量"],ans:2,exp:"他人陳述適用於研究對象無法親自提供資料時，如已辭世者、無意識者、幼兒等，可由研究對象的親友代為提供所需資料。"},
{q:"「參與性觀察（Participant Observation）」與「非參與性觀察（Nonparticipant Observation）」的主要差異是？",opts:["前者由儀器進行，後者由人工完成","前者研究者參與其中，後者研究者只是旁觀者","前者適用於量性研究，後者適用於質性研究","兩者收集的資料類型完全不同"],ans:1,exp:"觀察法中，參與性觀察是研究者參與研究對象的活動中進行觀察；非參與性觀察則是以旁觀者角色，不介入研究對象的活動而進行觀察。"}
]},

{num:13,title:"資料統計分析與方法",en:"Data Analysis Techniques",
content:`
<div class="sh">數據的分類體系</div>
<div class="g2">
  <div class="c-card accent-gold"><div class="c-head">📊 數量型數據（Numerical Data）</div>與數字有關，數值大小及差異均有意義。<br>
    <ul class="b-list" style="margin-top:6px">
      <li><span class="kp">連續型（Continuous）</span>：理論上可有小數點<br>例：血壓、血糖、身高、體重</li>
      <li><span class="kp">離散型（Discrete）</span>：只有整數值，不可能有小數點<br>例：病床數、小孩數目</li>
    </ul>
  </div>
  <div class="c-card accent-teal"><div class="c-head">🏷️ 類別型數據（Categorical Data）</div>性質是分類的，數字本身無具體意義。<br>
    <ul class="b-list" style="margin-top:6px">
      <li><span class="kp-t">無排序（Nominal）</span>：無先後次序，可互調<br>例：性別（男/女）、血型、婚姻狀況</li>
      <li><span class="kp-t">有排序（Ordinal）</span>：有先後次序，不能互調<br>例：傷情嚴重度（輕度/中度/重度）、Likert量表</li>
    </ul>
  </div>
</div>
<div class="imp-box">研究者<span class="hl-gold">不應一成不變</span>，宜靈活選擇統計方法。Likert量表嚴格屬Ordinal數據，應用卡方；但使用t檢定也不一定不合理，且通常所需樣本數較低，提高<span class="hl-teal">統計效度（Statistical Power）</span>。</div>

<div class="sh">描述統計（Descriptive Statistics）</div>
<div class="g2">
  <div class="c-card accent-gold"><div class="c-head">集中趨勢（Central Tendency）</div>
    <ul class="b-list">
      <li><span class="hl-gold">平均值（Mean）</span>：所有數值相加÷樣本數；優點：概念簡單；<span class="hl-coral">缺點：受極端值影響</span></li>
      <li><span class="hl-teal">中位數（Median）</span>：排序後中間的點（左右各占50%）；<span class="hl-green">優點：不受極端值影響</span>；<span class="hl-coral">缺點：未完全利用每個數值</span></li>
    </ul>
  </div>
  <div class="c-card accent-teal"><div class="c-head">分散幅度（Spread）</div>
    <ul class="b-list">
      <li><span class="hl-gold">標準差（SD）</span>：各數值與平均值的平均距離；容易受極端值影響</li>
      <li><span class="hl-teal">變異數（Variance）</span>：標準差的平方</li>
      <li><span class="hl-green">四分位差（IQR）</span>：第75百分點 - 第25百分點；<strong>穩健（Robust）</strong>，不受極端值影響</li>
    </ul>
  </div>
</div>

<div class="sh">推論統計：假設檢定的基本概念</div>
<div class="def-box"><span class="def-term">p 值（p-value）</span><span class="def-en">在虛無假設為真的前提下，觀察到「此樣本或更極端結果」的機率。<span class="hl-gold">p值越小，越有證據推翻虛無假設</span>。<br>判斷規則：若 p值 ≤ α（通常設定為<span class="hl-coral">0.05</span>，即5%顯著水準）→ 推翻虛無假設；若 p值 ＞ α → 不能推翻虛無假設。</span></div>
<div class="imp-box">⚠️ <strong>重要提醒：</strong>統計上「顯著差異」≠「臨床上有意義的差異」。研究者需同時考量效應量（Effect Size）與臨床意義。</div>

<div class="sh">七大常用統計方法詳解</div>

<div class="sh2">① 雙樣本 t 檢定（Two-Sample t-Test）</div>
<div class="cp">目的：比較<span class="hl-gold">兩個獨立群體</span>的平均值是否有所差異（又稱「非成對t檢定」）。</div>
<div class="g2">
  <div class="def-box" style="margin:0"><span class="def-term">使用時機</span><span class="def-en">比較A、B兩家醫院病人的平均住院天數 / 比較實驗組與對照組的後測分數</span></div>
  <div class="def-box" style="margin:0"><span class="def-term">合併vs分開t檢定</span><span class="def-en">先以 <span class="hl-coral">Levene's F 檢定</span>檢驗兩組變異數是否相同：<br>若 p &gt; α → 兩組變異數相等 → 使用<span class="hl-green">合併t檢定（Pooled t-test）</span><br>若 p ≤ α → 兩組變異數不等 → 使用<span class="hl-coral">分開t檢定（Separate t-test）</span></span></div>
</div>

<div class="sh2">② 成對 t 檢定（Paired t-Test）</div>
<div class="cp">目的：比較<span class="hl-teal">同一組個案在不同時間點</span>（前後測）的差異，或同一個人兩種條件下的比較（配對設計）。</div>
<div class="ex-box"><div class="ex-tag">臨床範例</div>
比較參加減重計畫者<strong>減重前後</strong>的體重差異；5人減重前後平均差3公斤<br>
<strong>95%信賴區間（Confidence Interval）：</strong>有95%的信心，真正的減重效果介於-2.8到8.8公斤之間<br>
<strong>p值判斷：</strong>若p = 0.113 &gt; 0.05 → 未達統計顯著，不能說減重計畫有效（樣本太少）</div>

<div class="sh2">③ 變異數分析（ANOVA）</div>
<div class="cp">目的：比較<span class="hl-gold">三組或三組以上</span>的平均值。不可分別進行多次t檢定（會使錯誤機率累積至15%），ANOVA可維持整體顯著水準在5%以內。</div>
<div class="cp">ANOVA後若達顯著（p ≤ 0.05），只能說「並非每一組的平均都一樣」，需進行<span class="hl-gold">多重比較（Post-hoc test）</span>（如Scheffe或Tukey法）進一步了解哪兩組間有差異。</div>
<div class="ex-box"><div class="ex-tag">臨床範例</div>
比較三家醫院門診部的平均候診時間（分鐘）是否相等。若ANOVA的p值 = 0.0022 &lt; 0.05，推翻虛無假設，三組平均候診時間不完全相同。再以Scheffe事後檢定確認哪兩組間有顯著差異。</div>

<div class="sh2">④ 共變數分析（ANCOVA）</div>
<div class="cp">目的：在比較兩組或多組差異時，<span class="hl-teal">控制共變數（Covariate）的影響</span>。相當於先統計「調整」某個已知影響因子後，再比較組間差異。</div>
<div class="imp-box">使用ANCOVA的前提：需先確認<span class="hl-coral">無交互作用（No Interaction）</span>——即共變數對依變項的影響不會因組別不同而有差異。若有交互作用（p ≤ 0.05），則不可使用ANCOVA。</div>
<div class="ex-box"><div class="ex-tag">臨床範例</div>
比較A藥 vs B藥的康復時間，但A藥組年齡較輕、B藥組年齡較大。若直接比較，年齡可能是混淆因素。<br>以ANCOVA「調整年齡影響」後，若p = 0.9973 &gt; 0.05 → 兩種藥物的康復時間<strong>無顯著差異</strong>，原來的差異是年齡造成的！</div>

<div class="sh2">⑤ 相關（Correlation）</div>
<div class="cp">目的：分析兩個變項之間是否有相關存在，及相關的方向、程度與強度。</div>
<div class="g2">
  <div class="def-box" style="margin:0"><span class="def-term">相關係數（r）的範圍</span><span class="def-en">+1 = 完全正相關 ／ -1 = 完全負相關 ／ 0 = 無相關<br>r的解讀（一般參考）：0.6以上=強相關；0.4=中度；0.2以下=弱相關</span></div>
  <div class="def-box" style="margin:0"><span class="def-term">選擇哪種相關係數？</span><span class="def-en"><span class="hl-gold">皮爾森相關（Pearson r）</span>：兩個連續型變項，且具有線性關係<br><span class="hl-teal">斯皮爾曼相關（Spearman r）</span>：有排序的類別型數據，或非線性關係<br><span class="hl-coral">Phi 係數（φ）</span>：兩個二元變項（是/否）</span></div>
</div>
<div class="imp-box">⚠️ r = 0 並非代表完全無關，只代表<span class="hl-coral">無線性關係</span>！兩變項間可能存在曲線關係。</div>

<div class="sh2">⑥ 簡單線性迴歸（Simple Linear Regression）</div>
<div class="cp">目的：由<span class="hl-gold">自變項的數值預估依變項</span>的數值；探討自變項每增加一個單位，依變項增加（或減少）多少。</div>
<div class="cp">公式：<strong>y = a + bx</strong>（a = 截距；b = 斜率）</div>
<div class="ex-box"><div class="ex-tag">臨床範例</div>
以「支持程度（x，0-10分）」預測「憂鬱程度（y，0-40分）」<br>
迴歸方程式：y = 36.5 + (-3.42)x<br>
→ <span class="hl-gold">b = -3.42</span>：支持程度每增加1分，憂鬱程度平均<strong>下降3.42分</strong>（負相關）<br>
→ <span class="hl-teal">a = 36.5</span>：完全無支持（x=0）時，預期憂鬱程度為36.5分<br>
→ 若某人支持程度10分：預期憂鬱 = 36.5 - (3.42×10) = <strong>2.3分</strong></div>

<div class="sh2">⑦ 卡方檢定（Chi-Squared Test, χ²）</div>
<div class="cp">目的：檢定<span class="hl-gold">類別型數據</span>之間是否有相關；最常見為「獨立性檢定」——探討兩個類別變項是否彼此相關。</div>
<div class="ex-box"><div class="ex-tag">臨床範例</div>
研究「性別」與「職業滿意度」之間是否有相關（2×2列聯表）<br>
若 p = 0.674 &gt; 0.05 → 未推翻虛無假設 → 無足夠證據顯示性別和職業滿意度有相關<br>
<span class="hl-coral">注意：</span>若樣本過小（超過50%的格子期望值 &lt; 5），使用 <span class="kp-r">Fisher's Exact Test</span> 取代卡方檢定</div>

<div class="sh">無母數分析（Non-Parametric Analysis）</div>
<div class="cp">當母群體分布未知、不符合常態分布假設，或樣本數過小時，使用無母數分析。將原始數據轉換為等級（Rank）進行分析，又稱「排序檢定」。</div>
<table class="cmp-table">
<tr><th>情境</th><th>參數檢定法</th><th>對應無母數方法</th></tr>
<tr><td>兩獨立樣本比較</td><td>雙樣本t檢定</td><td>Wilcoxon等級和檢定（Mann-Whitney U）</td></tr>
<tr><td>配對樣本比較</td><td>成對t檢定</td><td>Wilcoxon符號等級檢定</td></tr>
<tr><td>三組以上比較</td><td>ANOVA</td><td>Kruskal-Wallis檢定</td></tr>
</table>

<div class="sh">統計方法選擇全覽</div>
<table class="cmp-table">
<tr><th>研究問題</th><th>數據類型</th><th>最適統計方法</th></tr>
<tr><td>比較兩組差異（獨立）</td><td>連續型</td><td><span class="kp">獨立樣本t檢定</span></td></tr>
<tr><td>同一組前後測比較</td><td>連續型</td><td><span class="kp">成對t檢定</span></td></tr>
<tr><td>比較三組以上差異</td><td>連續型</td><td><span class="kp">ANOVA + 事後檢定</span></td></tr>
<tr><td>控制共變數後比較組間差異</td><td>連續型</td><td><span class="kp">ANCOVA</span></td></tr>
<tr><td>兩連續變項的相關</td><td>連續型</td><td><span class="kp">皮爾森相關係數</span></td></tr>
<tr><td>由自變項預測依變項</td><td>連續型</td><td><span class="kp">線性迴歸</span></td></tr>
<tr><td>兩類別變項的相關</td><td>類別型</td><td><span class="kp-t">卡方檢定（χ²）</span></td></tr>
<tr><td>不符常態分布，兩組比較</td><td>任何型</td><td><span class="kp-r">Wilcoxon等級和檢定</span></td></tr>
</table>
`,
quiz:[
{q:"「病床數」屬於哪種類型的數據？",opts:["連續型數據","離散型數據","有排序的類別型數據（Ordinal）","無排序的類別型數據（Nominal）"],ans:1,exp:"離散型數據只可能有整數值，不可能有小數點；病床數只能是整數（如50床，不能是50.5床），屬離散型數據。"},
{q:"若研究者想同時比較A、B、C三家醫院護理師的職業倦怠平均分數，應使用哪種統計方法？",opts:["進行三次雙樣本t檢定分別比較","卡方檢定","變異數分析（ANOVA）","皮爾森相關係數"],ans:2,exp:"比較三組以上的平均值應使用ANOVA，而非分別進行多次t檢定（多次t檢定會使錯誤機率累積至約15%）；ANOVA可維持整體顯著水準在5%以內。"},
{q:"在比較A藥與B藥的治療效果時，發現兩組病人的年齡分佈有很大差異，應使用哪種統計方法來排除年齡的干擾？",opts:["成對t檢定","共變數分析（ANCOVA）","皮爾森相關係數","卡方檢定"],ans:1,exp:"ANCOVA（共變數分析）的目的在比較兩組或多組差異時，控制共變數（如年齡）的影響，調整共變數後再比較組間差異，相當於「排除年齡干擾後的真正比較」。"},
{q:"迴歸分析中，若「b（斜率）= -3.42」代表什麼意義？",opts:["自變項增加3.42個單位，依變項不會改變","自變項每增加1個單位，依變項平均減少3.42個單位","自變項與依變項完全不相關","自變項每增加1個單位，依變項平均增加3.42個單位"],ans:1,exp:"斜率（b）代表當自變項（x）每增加一個單位時，依變項（y）會增加（b為正）或減少（b為負）多少個單位；b = -3.42表示自變項每增加1分，依變項平均下降3.42分（負向關係）。"},
{q:"若卡方檢定的電腦報表出現「50%的格子期望值小於5」的警告，應改用哪種方法？",opts:["改用ANOVA","改用成對t檢定","改用Fisher's Exact Test","改用皮爾森相關係數"],ans:2,exp:"卡方檢定的統計量只是近似值，樣本數過小時不準確；若超過50%的格子期望值小於5，應改用Fisher's Exact Test（費雪精確檢定）取代卡方檢定。"}
]},

{num:14,title:"撰寫研究計畫書",en:"Writing Research Proposal",
content:`
<div class="sh">撰寫研究計畫書的三大目的</div>
<div class="g3">
  <div class="c-card accent-gold"><div class="c-head">① 增進研究者學習</div>要求學生事先設想，掌握研究問題；強調研究目的、文獻查證、研究方法的具體性與可行性；可分送同儕與領域專長教授批判。</div>
  <div class="c-card accent-teal"><div class="c-head">② 爭取研究經費</div>提報研究計畫書，受理機構依特定需要有不同格式；研究計畫審查委員會審慎評核，決定是否核發補助經費。計畫書印製裝訂不可草率。</div>
  <div class="c-card accent-coral"><div class="c-head">③ 爭取行政支持（IRB）</div>透過<span class="kp-r">IRB</span>（Institutional Review Board）及<span class="kp-r">HRC</span>（Human Rights Committee），評值是否針對人權保護採取防範措施，決定是否核准研究執行。</div>
</div>

<div class="sh">撰寫計畫書應掌握的三大原則</div>
<div class="g3">
  <div class="c-card accent-gold"><div class="c-head">① 考慮審查者認知背景</div>
    <ul class="b-list">
      <li>專有名詞應具體說明，<span class="hl-coral">避免過量使用專業術語</span></li>
      <li>核心概念用詞保持<strong>一致</strong>，以邏輯方式串連</li>
      <li>適需加入<strong>流程圖、理論架構、表格</strong>等輔助說明</li>
      <li>敘述需符合現有理論或以近期研究實證為<strong>佐證</strong></li>
    </ul>
  </div>
  <div class="c-card accent-teal"><div class="c-head">② 善加包裝提升競爭性</div>
    <ul class="b-list">
      <li>展現研究主題的<span class="hl-teal">創新性</span></li>
      <li>印刷精美、排版適中、附 <span class="kp-t">QR code</span></li>
      <li>全文標上頁碼，符合申請機構格式</li>
      <li>研究目的與申請機構的<strong>整體發展方向契合</strong></li>
    </ul>
  </div>
  <div class="c-card accent-coral"><div class="c-head">③ 兼顧詳盡與彈性</div>
    <ul class="b-list">
      <li>詳盡包含研究執行過程</li>
      <li>尊重篇幅字數之<span class="hl-coral">限制</span>，不宜過於冗長</li>
      <li>過於繁瑣的資料（問卷、設備說明）置於<strong>附錄</strong></li>
    </ul>
  </div>
</div>

<div class="sh">研究計畫書的核心內容架構</div>
<div class="flow">
  <div class="flow-step"><div class="fs-num">1</div><div class="fs-txt">研究背景</div>目的、重要性、政策走勢</div>
  <div class="flow-step"><div class="fs-num">2</div><div class="fs-txt">文獻查證</div>近5年實證研究</div>
  <div class="flow-step"><div class="fs-num">3</div><div class="fs-txt">研究方法</div>名詞界定、設計、取樣</div>
  <div class="flow-step"><div class="fs-num">4</div><div class="fs-txt">資料收集</div>工具信效度測試</div>
  <div class="flow-step"><div class="fs-num">5</div><div class="fs-txt">統計分析</div>與研究目的對應</div>
  <div class="flow-step"><div class="fs-num">6</div><div class="fs-txt">倫理考量</div>IRB審查、人權保護</div>
  <div class="flow-step"><div class="fs-num">7</div><div class="fs-txt">預期效益</div>學術與實務貢獻</div>
</div>
`,
quiz:[
{q:"撰寫研究計畫書「爭取行政支持」目的，主要涉及哪個審查機構？",opts:["教育部課程審查委員會","人體試驗委員會（IRB）","衛生福利部","國科會研究補助審查委員會"],ans:1,exp:"IRB（人體試驗委員會）審慎評值研究計畫書，決定是否針對人權保護採取各項防範措施，以此作為是否核准研究在機構中執行之依據。"},
{q:"研究計畫書撰寫時，「考慮審查者之認知背景」的主要建議是？",opts:["使用越多專業術語越能展現研究深度","專有名詞應具體說明，避免過量使用專業術語，文詞盡量簡單清晰","不需考慮審查者背景，以研究者慣用語言呈現","計畫書越長越好"],ans:1,exp:"計畫書中專有名詞應具體說明，避免過量使用專業術語或名詞縮寫，文詞盡量簡單清晰，以利審查者理解研究內容。"},
{q:"研究計畫書若資料過於繁瑣（如問卷、設備說明），最佳處理方式是？",opts:["刪除這些繁瑣資料","全部放在正文中以顯示研究的完整性","有系統地置於附錄中，供審查者依需要自行參閱","縮小字體放入計畫書中"],ans:2,exp:"研究者應尊重篇幅字數之限制，可將過於繁瑣的資料（問卷、研究情境、設備等）有系統地置於附錄中，以供審查者依需要自行參閱。"},
{q:"為使研究計畫書順利通過審核，研究者可採取哪些策略？",opts:["只申請熟悉的審查委員所在機構","諮詢相關人員、參閱已核准計畫書，使研究目的與申請機構的整體發展方向契合","盡量縮短計畫書篇幅節省審查者時間","避免附上圖表以保持計畫書的簡潔性"],ans:1,exp:"研究者可諮詢申請機構受理研究計畫之相關人員，或參閱該機構曾核准的研究計畫書，使計畫目的能與申請機構的整體發展方向、組織目標相契合，提升計畫通過的成功率。"},
{q:"研究計畫書中文獻查證的建議重點是？",opts:["只需引用10年以上的經典文獻","以近五年與實證研究成果為佳","文獻越多越好，不限年代","只引用臺灣本土研究文獻"],ans:1,exp:"文獻查證有助於研究者界定研究問題的範圍，了解相關理論，掌握研究工具；計畫書中文獻查證以近五年與實證研究成果為佳。"}
]},

{num:15,title:"判讀研究報告",en:"The Critique of Research Report",
content:`
<div class="sh">判讀量性研究報告的步驟</div>
<div class="flow">
  <div class="flow-step"><div class="fs-num">1</div><div class="fs-txt">瀏覽全文架構</div>研究者學經歷背景</div>
  <div class="flow-step"><div class="fs-num">2</div><div class="fs-txt">初步概略閱讀</div>主體、邏輯、流暢度</div>
  <div class="flow-step"><div class="fs-num">3</div><div class="fs-txt">逐步深入批判</div>依研究報告各步驟</div>
</div>
<div class="cp" style="margin-top:14px">判讀時應先了解文章的主體為何？次標題是否清楚？文字的流暢性與清晰度如何？是否使用過於華麗或複雜的詞彙？內容的邏輯安排如何？</div>

<div class="sh">量性研究報告的十三大批判要素</div>

<div class="sh2">① 題目（Title）</div>
<div class="c-card accent-gold" style="margin-bottom:12px">
  <div class="c-head">好的研究題目標準</div>
  <ul class="b-list">
    <li><span class="hl-gold">言簡意賅</span>，能清楚表達整篇研究的範疇</li>
    <li>包含<span class="kp">研究的樣本群體</span></li>
    <li>包含<span class="kp">主要的變項</span>（自變項與依變項）</li>
    <li>能看出<span class="kp">研究設計的種類</span></li>
    <li>最好<span class="hl-coral">不超過15個字</span>（英文字母少於100個）</li>
  </ul>
</div>
<div class="ex-box"><div class="ex-tag">改善範例</div>
<strong>原題目（過長）：</strong>臺北市低收入戶民眾生活型態與罹患高血壓關係之調查<br>
→ 樣本群體：臺北市低收入戶民眾；變項：生活型態 + 罹患高血壓；研究設計：調查（Survey）<br>
<strong>改善後（次標題形式）：</strong>生活型態與罹患高血壓之研究：以臺北市低收入戶為例</div>

<div class="sh2">② 摘要（Abstract）</div>
<div class="c-card accent-teal" style="margin-bottom:12px">
  <div class="c-head">摘要的六大要素（麻雀雖小，五臟俱全）</div>
  <ul class="b-list">
    <li><span class="hl-teal">背景（Background）</span>：研究為何需要進行</li>
    <li><span class="hl-gold">目的（Purpose）</span>：研究要達到什麼</li>
    <li><span class="hl-coral">材料與方法（Methods）</span>：如何研究、樣本情況</li>
    <li><span class="hl-green">結果（Results）</span>：主要發現數據</li>
    <li><span class="hl-purple">評論與展望（Discussion & Conclusion）</span></li>
    <li>關鍵字：3~5個</li>
  </ul>
  <div class="imp-box" style="margin-top:8px">APA建議：<span class="hl-gold">不超過250個英文字</span>；中文以200-300字為宜，不超過500字。</div>
</div>

<div class="sh2">③ 前言（Introduction）</div>
<div class="cp">目的：劃定研究領域和引起動機，說明背景知識及目標企圖。</div>
<ul class="num-list">
  <li><strong class="hl-gold">研究問題的背景</strong>：詳實說明背景，交代研究議題發展的相關沿革</li>
  <li><strong class="hl-teal">先前的相關研究（現況）</strong>：適當引證重要數據，交代過去的相關研究發現</li>
  <li><strong class="hl-coral">這個研究的問題所在</strong>：知識缺口（Gap）——讓讀者相信研究者提出了正確問題</li>
  <li><strong class="hl-green">如何解決問題（構想）</strong>：研究動機，研究者為何想做此研究</li>
  <li><strong class="hl-purple">預期成果</strong>：此研究對護理理論、實務工作或教育上是否有所貢獻？</li>
</ul>

<div class="sh2">④ 文獻查證（Literature Review）</div>
<div class="cp">文獻查證是研究的<span class="hl-gold">基礎</span>，研究者有責任讓讀者了解該領域最新研究現況。</div>
<ul class="b-list">
  <li>文獻需<span class="hl-gold">切題</span>、具有組織邏輯性和系統性</li>
  <li>說明研究問題<strong>如何形成</strong>？為何選擇此研究策略？</li>
  <li>是否同時呈現正、反兩面（不同觀點）的研究結果？或只採一面倒的資料？</li>
  <li>是否為最近期文獻？（<span class="hl-teal">近五年</span>的文獻資料最為理想）</li>
  <li>是否能以<strong>批判性態度</strong>評論或比較各文獻？</li>
</ul>

<div class="sh2">⑤ 研究架構（Research Framework）</div>
<div class="cp">清楚列出<span class="hl-gold">研究變項</span>（包括自變項和依變項），並說明這些變項間的關係；通常用<strong>圖示</strong>呈現較為簡單清楚。</div>
<ul class="b-list">
  <li>是否與研究主題相關？是否有<strong>理論依據</strong>？</li>
  <li>概念間或研究變項間的關係是否說明詳盡、定義清楚？</li>
  <li>研究架構圖的表達是否清楚、明確？</li>
</ul>

<div class="sh2">⑥ 研究目的與假設（Research Purpose & Hypothesis）</div>
<div class="g2">
  <div class="def-box" style="margin:0"><span class="def-term">研究目的</span><span class="def-en">以<span class="hl-gold">肯定句</span>呈現，建立研究問題並確認研究者如何及為何想找到答案。較為籠統、整體、重點式的敘述，屬包裹式論說。</span></div>
  <div class="def-box" style="margin:0"><span class="def-term">研究問題</span><span class="def-en">以<span class="hl-teal">疑問句</span>呈現，隨著研究目的延伸而來，具體闡述研究想探究的問題。一個研究目的可能會有許多研究問題。</span></div>
</div>
<div class="g2" style="margin-top:8px">
  <div class="def-box" style="margin:0"><span class="def-term">零假設（Null Hypothesis）</span><span class="def-en">如：「教育程度和對高血壓的認知<span class="hl-coral">具有相關性</span>」——未指明方向</span></div>
  <div class="def-box" style="margin:0"><span class="def-term">方向假設（Directional Hypothesis）</span><span class="def-en">如：「教育程度和對高血壓的認知<span class="hl-gold">呈正相關</span>」——明確指出預測方向，更具說服力、更有統計意義</span></div>
</div>

<div class="sh2">⑦ 名詞界定（Define Research Variables）</div>
<div class="cp">名詞界定的目的是<span class="hl-gold">定義研究中的重要變項</span>，使讀者能清楚了解變項的意思，整篇研究中對同一變項的描述須保持一致。需兼具<strong>概念性（一般性）定義</strong>與<strong>操作性定義</strong>。</div>
<div class="ex-box"><div class="ex-tag">判讀範例</div>
<strong>研究題目：</strong>老年人健康行為之研究<br>
→ 必須清楚界定「老年人」是<strong>60歲、65歲，還是70歲以上</strong>？<br>
→ 「健康行為」包括哪些項目？是<strong>休閒、運動，還是不抽菸、不喝酒</strong>？<br>
不同的操作性定義會有不同的研究結果，研究者必須詳加定義，避免認知差異。</div>

<div class="sh2">⑧ 研究方法（Research Methods）</div>
<div class="cp">研究方法是整篇研究報告中敘述觀察計畫的精髓，必須受到最嚴格的監督。研究方法需呼應研究目的，並清楚指出研究細節以作為整個研究的操作指南。</div>
<div class="g2">
  <div class="c-card accent-gold"><div class="c-head">研究設計批判要點</div>
    <ul class="b-list">
      <li>屬於橫斷面還是縱貫面研究？</li>
      <li>使用的研究方法是否適合研究目的？</li>
      <li>是否盡量排除各種可能影響研究的變數？</li>
      <li>是否能經得起重複驗證？</li>
    </ul>
  </div>
  <div class="c-card accent-teal"><div class="c-head">研究對象批判要點</div>
    <ul class="b-list">
      <li>樣本的<span class="hl-teal">納入條件</span>與<span class="hl-coral">排除條件</span>是否清楚？</li>
      <li>樣本數和其估算依據是否說明？</li>
      <li>取樣方法是否適當？樣本的回覆率為何？</li>
      <li>是否陳述取樣可能遭遇的偏差？</li>
      <li>是否有適當的<strong>倫理/人權保護</strong>（匿名處理、知情同意書）？</li>
    </ul>
  </div>
  <div class="c-card accent-coral"><div class="c-head">研究工具批判要點</div>
    <ul class="b-list">
      <li>研究工具（量表、問卷）是否具有<span class="hl-coral">客觀性</span>——信效度是否已驗證？</li>
      <li>若使用自行研發的量表：如何發展而來？信效度如何測試？</li>
      <li>若使用他人量表：是否重新測試信效度？</li>
      <li>量表用字是否清晰？封閉式答案是否周延且互斥？</li>
    </ul>
  </div>
  <div class="c-card accent-green"><div class="c-head">資料收集批判要點</div>
    <ul class="b-list">
      <li>是否經過<span class="hl-green">前驅試驗（Pilot Test）</span>？</li>
      <li>資料收集方法（個案自填或訪員面談）是否說明？</li>
      <li>若由訪員填寫，是否有進行<strong>訪員訓練</strong>？</li>
      <li>若縱貫性研究，是否每個時間點都使用相同的測量？</li>
    </ul>
  </div>
</div>

<div class="sh2">⑨ 研究結果（Research Results）</div>
<div class="cp">「研究結果」呈現經過研究者整理、統計、分析後的研究發現——給予讀者一個有關資料的<span class="hl-gold">完整圖像</span>。必須<span class="hl-teal">回應研究目的</span>，盡量客觀，不摻雜情感，避免呈現不相干的資料。</div>
<div class="imp-box">⚠️ <strong>常見錯誤：</strong>「竟然高達50%的老年人罹患高血壓」——「竟然」二字含有個人價值判斷，不適合在研究結果中出現。</div>
<ul class="b-list">
  <li>敘述是否<span class="hl-gold">清楚客觀</span>？統計結果是否清楚書寫出來？</li>
  <li>是否根據<span class="hl-teal">研究架構</span>陳述？是否與研究假設相符合？</li>
  <li>圖表呈現是否清楚易懂？是否有對圖表內容加以說明或解釋？</li>
  <li>所使用的統計分析方式是否合適？是否說明統計軟體名稱？</li>
</ul>
<div class="cp">📊 <strong>圖表呈現的重要性：</strong>圖表具有「畫龍點睛」的效果，讓讀者直接從圖表一目了然看出研究結果。但圖表不能作為文字解說的替代品——研究結果的論述應以<span class="hl-gold">文字說明為主，圖表為輔</span>。</div>

<div class="sh2">⑩ 討論（Discussion）</div>
<div class="cp">「討論」是研究者闡明研究結果意義，說出自己的想法——自身對資料的解讀，是研究報告中較為主觀的部分，較難批判。</div>
<ul class="b-list">
  <li>文中是否出現<span class="hl-coral">尚未被承認的敘述</span>，或資料數據不能充分支持的結論？</li>
  <li>是否將每一項研究結果與<span class="hl-gold">最原始的研究問題或假設</span>加以討論？</li>
  <li>是否考慮所有可能性或<strong>替代性的解釋</strong>？</li>
  <li>是否將本研究和<span class="hl-teal">前人研究結果或文獻</span>作一比較？</li>
  <li>是否對預期之外的發現進行討論？</li>
</ul>

<div class="sh2">⑪ 結論與建議（Conclusions & Recommendations）</div>
<div class="g2">
  <div class="def-box" style="margin:0"><span class="def-term">結論（Conclusion）</span><span class="def-en">研究者針對研究發現的事實所作之<span class="hl-gold">個人判斷</span>，需有明白證據才能成立。必須根據原本的研究假設或目的加以陳述，呼應前言中的研究動機及預期成果；精簡、濃縮最重要的結果，無須過於冗長。</span></div>
  <div class="def-box" style="margin:0"><span class="def-term">建議（Recommendation）</span><span class="def-en">研究過程中發現的副產品；對超出原先假設或具重要意義的事實提出個人見解；說明研究設計或執行上的瑕疵，以及<span class="hl-teal">日後可以改善的方法</span>；對護理實務、行政、教育或研究上的具體建議。</span></div>
</div>

<div class="sh2">⑫ 研究限制（Research Limitation）</div>
<div class="cp">任何一篇研究不可避免地都有其<span class="hl-coral">特定範圍或限制</span>——指具有限制性的條件或缺點，也就是研究者現有能力做不到、無法完成，但可使研究更完善的部分。</div>
<ul class="b-list">
  <li>研究者是否<span class="hl-coral">忠實、坦白</span>地承認自己在研究上的限制？</li>
  <li>是否說明這些限制對研究的影響？</li>
  <li>是否提出日後可以改善的方法或進一步探究的內容？</li>
</ul>

<div class="sh2">⑬ 參考文獻（References）</div>
<ul class="b-list">
  <li>書寫格式是否<span class="hl-gold">正確且一致</span>？（包含文中引用格式和文後陳列方式）</li>
  <li>書寫是否完整，有無疏漏？</li>
  <li>引用資料年代是否過於久遠？（以<span class="hl-teal">近五年</span>的文獻資料為佳）</li>
</ul>

<div class="sh">量性 vs 質性研究報告判讀的主要差異</div>
<table class="cmp-table">
<tr><th>面向</th><th>量性研究報告判讀</th><th>質性研究報告判讀</th></tr>
<tr><td>研究描述</td><td>客觀、統計數據清楚</td><td>生動、讓讀者有身歷其境感</td></tr>
<tr><td>信效度評估</td><td>量化的信效度係數</td><td>確實性、推廣性、信賴性、確認性</td></tr>
<tr><td>結果呈現</td><td>統計圖表為輔，文字說明為主</td><td>描述生動鮮活，附上原始引語</td></tr>
<tr><td>批判難度</td><td>有明確準則可循</td><td>較難直接批判，需追隨研究者思維邏輯</td></tr>
</table>

{q:"「方向假設（Directional Hypothesis）」相較於「零假設（Null Hypothesis）」的優點是？",opts:["方向假設比較容易通過假設檢定","方向假設容許更具說服力的推論，也更具統計上的意義","兩者完全相同，只是名稱不同","零假設更適合用於探索性研究"],ans:1,exp:"方向假設明確指出預測關係的方向（正相關或負相關），如「教育程度和高血壓認知呈正相關」，比零假設（只說有相關性但不說方向）更具說服力，也更有統計上的意義。"},

{num:16,title:"實證健康照護：概念與臨床實務應用",en:"Evidenced-based Health Care: Concepts & Clinical Practice",
content:`
<div class="sh">實證醫學的發展脈絡</div>
<div class="def-box"><span class="def-term">實證醫學（Evidence-based Medicine, EBM）</span><span class="def-en">首次由學者 <span class="hl-gold">Archie Cochrane</span> 提出：所有醫療行為都應有嚴謹的研究、實證及有效依據，才能將醫療資源作最佳利用。<br>1992年，加拿大 McMaster University 的 <span class="hl-teal">Gordon Guyatt</span> 正式提出EBM名詞：「<strong>有目的、正確地運用現有最好的科學依據來指導病人的治療</strong>」。亦稱<span class="kp">證據醫學</span>或<span class="kp">循證醫學</span>。</span></div>

<div class="sh">EBHC 的廣泛定義（四大要素）</div>
<div class="g2">
  <div class="c-card accent-gold"><div class="c-head">📄 最佳研究證據</div>經嚴謹設計、系統性文獻回顧的<span class="hl-gold">科學依據</span>；包含RCT、系統性回顧等高等級研究。</div>
  <div class="c-card accent-teal"><div class="c-head">👨‍⚕️ 臨床專家經驗</div>臨床工作者多年累積的<span class="hl-teal">實務經驗與判斷力</span>，彌補研究結果在個案應用上的不足。</div>
  <div class="c-card accent-coral"><div class="c-head">🧑 病人價值觀</div>尊重<span class="hl-coral">病人個人及家庭的價值觀與期待</span>做出決策，以達到以病人為中心的照護。</div>
  <div class="c-card accent-green"><div class="c-head">🏥 環境資源</div>考量<span class="hl-green">醫療機構的資源、政策、環境因素</span>，確保照護措施的可行性與成本效益。</div>
</div>
<div class="imp-box">三者統稱 <span class="hl-gold">EBHC（Evidenced-based Health Care）</span>：<span class="kp">EBM（實證醫學）</span> + <span class="kp-t">EBN（實證護理）</span> + <span class="kp-g">EBP（實證實務）</span>。概念：將搜尋所得資料經<span class="hl-teal">有系統地實證評析</span>，應用於解決臨床問題。</div>

<div class="sh">考科藍合作組織（Cochrane Collaboration）</div>
<table class="cmp-table">
<tr><th>年份</th><th>重要事件</th></tr>
<tr><td><span class="hl-gold">1979年</span></td><td>Cochrane 提出醫療決定需有足夠證據支持，醫學界應週期性整合研究文獻</td></tr>
<tr><td><span class="hl-teal">1992年</span></td><td>英國NHS在牛津大學成立研究中心，提供相關、最新、嚴謹且正確的系統性文獻回顧</td></tr>
<tr><td><span class="hl-coral">1993年</span></td><td>在<strong>Iain Chalmers</strong>教授努力下，英國Cochrane Center正式成立；隨時對臨床試驗進行系統性文獻回顧，避免研究議題重複</td></tr>
</table>
<div class="cp">根據統計，PubMed在2021年已達<span class="hl-gold">33,136,289篇</span>資料，醫護研究資料快速增加，實證健康照護已成為21世紀重要的照護模式。</div>

<div class="sh">21世紀五大核心能力（IOM, 2003）</div>
<ul class="num-list">
  <li><strong class="hl-gold">以病人為中心的醫療照護</strong></li>
  <li><strong class="hl-teal">跨領域的醫療團隊工作</strong></li>
  <li><strong class="hl-coral">執行實證健康照護（EBHC）</strong></li>
  <li><strong class="hl-green">醫療品質促進</strong></li>
  <li><strong class="hl-purple">資訊技術運用</strong></li>
</ul>

<div class="sh">執行 EBHC 的 5A 步驟</div>
<div class="flow">
  <div class="flow-step"><div class="fs-num">A1</div><div class="fs-txt">Ask 提問</div>形成可回答的臨床問題</div>
  <div class="flow-step"><div class="fs-num">A2</div><div class="fs-txt">Acquire 取得</div>找出最佳文獻證據</div>
  <div class="flow-step"><div class="fs-num">A3</div><div class="fs-txt">Appraise 評析</div>評析文獻可信度</div>
  <div class="flow-step"><div class="fs-num">A4</div><div class="fs-txt">Apply 應用</div>應用最佳證據於臨床</div>
  <div class="flow-step"><div class="fs-num">A5</div><div class="fs-txt">Audit 稽核</div>評值照護成效，持續改善</div>
</div>

<div class="sh">Step 1 — Ask：PICO 架構</div>
<div class="def-box"><span class="def-term">PICO 架構（Straus et al., 2018）</span><span class="def-en">將臨床遭遇的情境，整理形成一個<span class="hl-gold">可以回答的臨床問題</span>，作為文獻搜尋的依據。</span></div>
<div class="g2">
  <div class="c-card accent-gold"><div class="c-head">P — 病人／問題／族群<br><small>Patient / Problem / Population</small></div>清楚描述病人、問題或族群。可依6W原則（Who對象、When時間、Where地點、What發生什麼事、How如何發生、Why為何）簡化成可回答問題。</div>
  <div class="c-card accent-teal"><div class="c-head">I — 介入<br><small>Interventions</small></div>清楚描述主要的<span class="hl-teal">介入措施</span>或指標，如：臨床治療方式、危險因子暴露、診斷性檢查、預後因子。</div>
  <div class="c-card accent-coral"><div class="c-head">C — 比較<br><small>Comparisons</small></div>清楚描述<span class="hl-coral">比較措施</span>或指標，比較各種可能介入因素的特質及差異（常為常規護理或無介入）。</div>
  <div class="c-card accent-green"><div class="c-head">O — 結果<br><small>Outcomes</small></div>清楚描述<span class="hl-green">期望達到的結果</span>，考量病人生理、心理、家庭、社會與經濟的重要問題。</div>
</div>

<div class="ex-box"><div class="ex-tag">PICO 範例 16-1</div>
<strong>臨床問題：</strong>安胎孕婦接受音樂治療是否會降低焦慮程度？<br><br>
▸ <span class="hl-gold">P（病人）：</span>安胎的孕婦<br>
▸ <span class="hl-teal">I（介入措施）：</span>音樂治療<br>
▸ <span class="hl-coral">C（比較措施）：</span>未執行音樂治療（常規護理）<br>
▸ <span class="hl-green">O（結果）：</span>降低焦慮程度</div>

<div class="ex-box"><div class="ex-tag">PICO 範例 16-2</div>
<strong>臨床問題：</strong>哮吼病童有無使用氧氣帳，對改善喘鳴症狀及減少住院天數是否有差異？<br><br>
▸ <span class="hl-gold">P：</span>哮吼病童 ／ <span class="hl-teal">I：</span>有使用氧氣帳 ／ <span class="hl-coral">C：</span>無使用氧氣帳 ／ <span class="hl-green">O：</span>改善喘鳴症狀及減少住院天數</div>

<div class="sh">Step 2 — Acquire：文獻搜尋策略</div>
<div class="sh2">搜尋資料庫的種類</div>
<div class="g2">
  <div class="c-card accent-gold"><div class="c-head">✅ 優先搜尋：實證資料庫</div>
    <ul class="b-list">
      <li><span class="kp">Cochrane Library</span>：系統性文獻回顧</li>
      <li><span class="kp">UpToDate</span>：臨床決策支援系統</li>
      <li><span class="kp">BMJ Clinical Evidence</span></li>
    </ul>
    <em>不需太多搜尋技巧，快速支援臨床決策</em>
  </div>
  <div class="c-card accent-teal"><div class="c-head">次之搜尋：一般醫學資料庫</div>
    <ul class="b-list">
      <li><span class="kp-t">PubMed / MEDLINE</span></li>
      <li><span class="kp-t">CINAHL</span>（護理與醫療照護）</li>
      <li><span class="kp-t">EMBASE</span></li>
      <li><span class="kp-t">華藝線上圖書館</span>（中文資料庫）</li>
    </ul>
    <em>收錄原始文獻，量多但需較多搜尋技巧</em>
  </div>

<div class="sh">Step 3 — Appraise：文獻評析的兩大方向</div>
<div class="g2">
  <div class="c-card accent-teal"><div class="c-head">真實性（Validity）評析</div>研究結果是否<span class="hl-teal">真實可信</span>？<br>
    <ul class="b-list" style="margin-top:6px">

  </div>
  <div class="c-card accent-gold"><div class="c-head">重要性（Importance）評析</div>研究結果的<span class="hl-gold">臨床意義</span>是否足夠？<br>

</div>

let DECKS=[],currentUnit=0,currentSlide=0;
function escapeHTML(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function cleanText(s){return String(s||'').replace(/\s+/g,' ').replace(/⭐ 重點提示/g,'重點提示').trim();}
function normalizeContentHTML(html){const div=document.createElement('div');div.innerHTML=html||'';div.querySelectorAll('script,style,button,input').forEach(x=>x.remove());return div.innerHTML;}
function unitToDeck(unit,idx){const temp=document.createElement('div');temp.innerHTML=unit.content||'';const slides=[];slides.push({kind:'cover',title:unit.title||`Unit ${idx+1}`,sub:unit.en||'',label:`Unit ${unit.num||idx+1}`});const headings=[...temp.querySelectorAll('.sh,.sh2')].map(x=>cleanText(x.textContent)).filter(Boolean).slice(0,6);if(headings.length)slides.push({kind:'bullets',title:'本章學習路徑',label:'Overview',bullets:headings});const children=[...temp.children];let i=0;while(i<children.length){const el=children[i];if(el.classList.contains('def-box')){const defs=[];while(i<children.length&&children[i].classList.contains('def-box')&&defs.length<3){defs.push(children[i].outerHTML);i++;}slides.push({kind:'htmlBlocks',title:'重要名詞與定義',label:'Definition',htmls:defs});continue;}if(el.classList.contains('sh')||el.classList.contains('sh2')){const title=cleanText(el.textContent);const group=[];i++;while(i<children.length&&!(children[i].classList.contains('sh')||children[i].classList.contains('sh2'))&&group.length<4){group.push(children[i]);i++;}slides.push(...convertSection(title,group));continue;}if(el.classList.contains('imp-box'))slides.push({kind:'html',title:'重點提示',label:'Key Point',html:el.outerHTML});else if(el.classList.contains('ex-box'))slides.push({kind:'html',title:'臨床／研究範例',label:'Example',html:el.outerHTML});i++;}if(unit.quiz&&Array.isArray(unit.quiz)){unit.quiz.slice(0,5).forEach((q,qi)=>slides.push({kind:'quiz',title:`即時檢核 ${qi+1}`,label:'Quiz',q:q.q||q.question||'',opts:q.opts||q.options||[],ans:q.answer||q.ans||'',exp:q.exp||q.explain||q.explanation||''}));}slides.push({kind:'end',title:'本章總結與教室提問',label:'Summary',unit});return {id:'u'+idx,title:`Unit ${unit.num||idx+1}｜${unit.title}`,unit,slides};}
function convertSection(title,nodes){const slides=[];const meaningful=nodes.filter(n=>cleanText(n.textContent).length>0);if(!meaningful.length)return slides;const table=meaningful.find(n=>n.tagName==='TABLE'||n.querySelector('table'));if(table){slides.push({kind:'table',title,label:'Table',html:table.outerHTML});return slides;}const flow=meaningful.find(n=>n.classList&&n.classList.contains('flow'));if(flow){slides.push({kind:'flow',title,label:'Process',html:flow.outerHTML});return slides;}const cardNodes=meaningful.filter(n=>n.className&&/c-card|g2|g3/.test(n.className));if(cardNodes.length){slides.push({kind:'sectionHTML',title,label:'Concept Blocks',html:meaningful.map(n=>n.outerHTML).join('')});return slides;}const list=meaningful.find(n=>['UL','OL'].includes(n.tagName)||n.querySelector('ul,ol'));if(list){const items=[...list.querySelectorAll('li')].map(li=>li.innerHTML).filter(Boolean);for(let k=0;k<items.length;k+=5)slides.push({kind:'bulletsHTML',title:k?title+'（續）':title,label:'Key Points',items:items.slice(k,k+5)});return slides;}const html=meaningful.map(n=>n.outerHTML).join('');if(cleanText(html).length)slides.push({kind:'sectionHTML',title,label:'Content',html});return slides;}
function init(){DECKS=EMBEDDED_UNITS.map((u,idx)=>unitToDeck(u,idx));unitSelect.innerHTML=DECKS.map((d,i)=>`<option value="${i}">${d.title}</option>`).join('');loadUnit(0);}function loadUnit(i){currentUnit=Number(i);currentSlide=0;renderSlides();renderSlideList();showSlide(0);}function renderSlideList(){const deck=DECKS[currentUnit];sideTitle.innerHTML=`<b>${deck.title}</b><br>共 ${deck.slides.length} 張投影片（離線嵌入內容）`;slideList.innerHTML=deck.slides.map((s,i)=>`<div class="thumb ${i===currentSlide?'on':''}" onclick="showSlide(${i})"><b>${String(i+1).padStart(2,'0')}｜${escapeHTML(s.title)}</b><span>${escapeHTML(s.label||'Slide')}</span></div>`).join('');}
function slideHTML(s,i,total,deck){const foot=footer(i,total),label=escapeHTML(s.label||deck.title);if(s.kind==='cover')return `<section class="slide"><div class="kicker">${label}</div><h1>${escapeHTML(s.title)}</h1><p>${escapeHTML(s.sub)}</p><div class="grid3"><div class="block teal"><b>離線版</b><br>可直接雙擊開啟，不需 localhost。</div><div class="block"><b>教室使用</b><br>全螢幕、逐頁講解、搭配簡報筆。</div><div class="block green"><b>互動</b><br>每段後可搭配口頭提問或小組討論。</div></div>${foot}</section>`;if(s.kind==='bullets')return `<section class="slide"><div class="kicker">${label}</div><h2>${escapeHTML(s.title)}</h2><ul>${s.bullets.map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ul>${foot}</section>`;if(s.kind==='bulletsHTML')return `<section class="slide"><div class="kicker">${label}</div><h2>${escapeHTML(s.title)}</h2><ul>${s.items.map(x=>`<li>${x}</li>`).join('')}</ul>${foot}</section>`;if(s.kind==='htmlBlocks')return `<section class="slide"><div class="kicker">${label}</div><h2>${escapeHTML(s.title)}</h2>${s.htmls.map(h=>normalizeContentHTML(h)).join('')}${foot}</section>`;if(s.kind==='table')return `<section class="slide"><div class="kicker">${label}</div><h2>${escapeHTML(s.title)}</h2><div class="table-wrap">${normalizeContentHTML(s.html)}</div>${foot}</section>`;if(s.kind==='flow')return `<section class="slide"><div class="kicker">${label}</div><h2>${escapeHTML(s.title)}</h2>${normalizeContentHTML(s.html)}${foot}</section>`;if(s.kind==='quiz'){const opts=(s.opts||[]).map((o,idx)=>`<div class="opt">${String.fromCharCode(65+idx)}. ${escapeHTML(o)}</div>`).join('');return `<section class="slide"><div class="kicker">${label}</div><h2>${escapeHTML(s.title)}</h2><div class="quizbox"><div class="q">💬 ${escapeHTML(s.q)}</div><div class="opts">${opts}</div><div class="ans">答案：${escapeHTML(s.ans)} ${s.exp?'｜'+escapeHTML(s.exp):''}</div></div>${foot}</section>`;}if(s.kind==='end')return `<section class="slide"><div class="kicker">${label}</div><h2>${escapeHTML(s.title)}</h2><div class="grid2"><div class="block teal"><b>學生口頭回答</b><br>本章最重要的三個概念是什麼？</div><div class="block pink"><b>臨床連結</b><br>這些概念如何幫助判讀護理研究文章？</div></div><div class="question">請用一句話總結：${escapeHTML(s.unit.title)} 對護理專業的價值。</div>${foot}</section>`;return `<section class="slide"><div class="kicker">${label}</div><h2>${escapeHTML(s.title)}</h2>${normalizeContentHTML(s.html)}${foot}</section>`;}
function footer(i,total){return `<div class="footer"><span>研究與實證護理概論｜教室展示版</span><span>${i+1} / ${total}</span></div><div class="progressBar"><div class="progressFill" style="width:${((i+1)/total*100).toFixed(1)}%"></div></div>`;}function renderSlides(){const deck=DECKS[currentUnit];slides.innerHTML=deck.slides.map((s,i)=>slideHTML(s,i,deck.slides.length,deck)).join('');}function showSlide(i){const deck=DECKS[currentUnit];currentSlide=Math.max(0,Math.min(i,deck.slides.length-1));document.querySelectorAll('.slide').forEach((el,idx)=>el.classList.toggle('on',idx===currentSlide));renderSlideList();}function nextSlide(){const deck=DECKS[currentUnit];if(currentSlide<deck.slides.length-1)showSlide(currentSlide+1);else if(currentUnit<DECKS.length-1){unitSelect.value=currentUnit+1;loadUnit(currentUnit+1);}}function prevSlide(){if(currentSlide>0)showSlide(currentSlide-1);else if(currentUnit>0){unitSelect.value=currentUnit-1;loadUnit(currentUnit-1);showSlide(DECKS[currentUnit].slides.length-1);}}function toggleSidebar(){document.body.classList.toggle('sidebar-hidden')}async function toggleFullscreen(){if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();}function toggleLaser(){document.body.classList.toggle('laser-on')}document.addEventListener('mousemove',e=>{laser.style.left=e.clientX+'px';laser.style.top=e.clientY+'px';});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ')nextSlide();if(e.key==='ArrowLeft'||e.key==='PageUp')prevSlide();if(e.key.toLowerCase()==='f')toggleFullscreen();if(e.key.toLowerCase()==='l')toggleLaser();if(e.key.toLowerCase()==='m')toggleSidebar();});
/* === v7 toolbar auto-hide behavior === */
let toolbarTimer = null;
function revealToolbarBriefly(){
  document.body.classList.add("show-toolbar");
  clearTimeout(toolbarTimer);
  toolbarTimer = setTimeout(()=>document.body.classList.remove("show-toolbar"), 1700);
}
document.addEventListener("mousemove", e=>{
  if(e.clientY < 72) revealToolbarBriefly();
});
document.addEventListener("keydown", e=>{
  if(e.key.toLowerCase()==="t") revealToolbarBriefly();
});
setTimeout(()=>document.body.classList.remove("show-toolbar"), 1200);

init();
</script></body></html>
