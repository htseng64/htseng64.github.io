<script>
const EMBEDDED_UNITS = [
{num:1,title:"護理研究概論",en:"Introduction to Nursing Research",
content:`
<div class="def-box"><span class="def-term">科學 Science</span><span class="def-en">以觀察、實驗與歸納為方法，藉有系統的探究自然現象以確定真理；或將已知事實做有次序與規則性排列，以助人類對自然現象之了解。</span></div>
<div class="def-box"><span class="def-term">研究 Research</span><span class="def-en">藉由深入的探索，以<span class="hl-gold">實證資料</span>呈現事實；科學收集之事實旨在<span class="hl-teal">考驗或發展理論</span>。科學需以研究為基礎，可分為自然科學與社會科學兩類。</span></div>
<div class="def-box"><span class="def-term">護理研究 Nursing Research</span><span class="def-en">以社會科學或生物科學為主體之探索過程，目標在<span class="hl-gold">追求實證基礎</span>，以提升對<span class="hl-teal">病人、家屬、健康照護者及整個健康照護系統</span>之照護品質。</span></div>

<div class="sh">Best（1981）研究的12項特性</div>
<ul class="num-list">
  <li>發現變異項間之<strong class="hl-gold">因果關係或相關性</strong>來呈現現況與解決問題</li>
  <li>藉觀察與分析特定個體或情境，<strong>推論目標母群體</strong>之特徵</li>
  <li>以<strong>可觀察的經驗或實際證據</strong>為基礎，建立理論架構與更新知識</li>
  <li>需使用<strong class="hl-teal">量化的測量工具</strong>，以便精準觀察與描述</li>
  <li>應收集<strong>第一手、原創性或直接獲取</strong>的新資料</li>
  <li>審慎設計的程序，以<strong>嚴謹的分析</strong>為特徵</li>
  <li>力求<strong class="hl-gold">客觀與合理</strong>，消弭個人偏見與情緒反應</li>
  <li>需運用<strong>專門知識與技術</strong></li>
  <li>目標在拓展<strong class="hl-teal">未知領域及追求知識創新</strong></li>
  <li>需有<strong>耐心</strong>，切忌急躁半途而廢</li>
  <li>嚴謹審視資料來源，指出<strong>研究限制與倫理考量</strong>，詳附參考資料</li>
  <li>發表研究成果時應有<strong class="hl-gold">勇氣，秉持真理</strong></li>
</ul>

<div class="sh">護理研究的重要性（5大面向）</div>
<div class="g2">
  <div class="c-card accent-gold"><div class="c-head"><span class="ico">📚</span>建立獨特知識領域</div>藉多方面研究數據與實證資料，了解與掌控外在環境變遷，建立優質護理服務品質與精確護理標準。</div>
  <div class="c-card accent-teal"><div class="c-head"><span class="ico">🔧</span>解決臨床問題</div>針對<span class="hl-coral">醫療疏失、跌倒率增高、針扎事件、拔管率、病人滿意度、護理師離職率</span>等問題收集分析資料，提供解決途徑。</div>
  <div class="c-card accent-coral"><div class="c-head"><span class="ico">📋</span>制定政策依據</div>高齡社會賦能訓練成效、失能老人需求、安寧療護比例、器官捐贈意願等——需以研究數據為依歸。</div>
  <div class="c-card accent-green"><div class="c-head"><span class="ico">🎓</span>修正教學內容</div>比較 <span class="kp">PBL問題導向教學</span>、<span class="kp">OSCE客觀結構式臨床技能測驗</span>等新教學法之成效，更新教材。</div>
  <div class="c-card accent-purple"><div class="c-head"><span class="ico">🌏</span>連結全球護理專業</div>臺灣本土性研究（中醫護理、芳香療法、音樂療法）在國際學術會議發表，提升護理學術地位。</div>
</div>

<div class="sh">護理研究的分類</div>
<table class="cmp-table">
<tr><th>類型</th><th>定義</th><th>常用方法</th></tr>
<tr><td><span class="hl-gold">描述性研究</span></td><td>不操縱變項，系統性收集資料描述現況</td><td>田野研究法、調查研究法、相關性研究法、發展性研究法</td></tr>
<tr><td><span class="hl-teal">探索性研究</span></td><td>探索現實情境中現象的相關性與影響因子</td><td>訪談、參與性觀察、文獻分析</td></tr>
<tr><td><span class="hl-coral">因果性研究</span></td><td>操作與控制研究情境，探討自變項與依變項間關係</td><td>實驗性研究設計</td></tr>
</table>

<div class="sh">護理研究步驟（9步驟）</div>
<div class="flow">
  <div class="flow-step"><div class="fs-num">1</div><div class="fs-txt">確立研究主題</div>目的、可行性評估</div>
  <div class="flow-step"><div class="fs-num">2</div><div class="fs-txt">文獻查證</div>廣泛收集資料</div>
  <div class="flow-step"><div class="fs-num">3</div><div class="fs-txt">確立研究方法</div>名詞界定、取樣、IRB</div>
  <div class="flow-step"><div class="fs-num">4</div><div class="fs-txt">提出計畫申請</div>經費與行政支持</div>
  <div class="flow-step"><div class="fs-num">5</div><div class="fs-txt">前驅研究</div>Pilot Research</div>
  <div class="flow-step"><div class="fs-num">6</div><div class="fs-txt">資料收集</div>確保一致性</div>
  <div class="flow-step"><div class="fs-num">7</div><div class="fs-txt">統計分析</div>編碼、輸入、統計</div>
  <div class="flow-step"><div class="fs-num">8</div><div class="fs-txt">撰寫報告</div>背景至建議</div>
  <div class="flow-step"><div class="fs-num">9</div><div class="fs-txt">發表成果</div>期刊、學術會議</div>
</div>

<div class="sh">護理研究的倫理原則</div>
<div class="g2">
  <div class="c-card-t"><div class="c-head">🛡️ IRB審查</div><span class="kp-t">人體試驗委員會</span>（Institutional Review Board）：凡涉及以人類為個案的研究，均須通過IRB審查。每個IRB須有<strong>5位以上</strong>不同背景學術成員。</div>
  <div class="c-card-t"><div class="c-head">⚖️ 三大倫理原則</div>
    <ul class="b-list">
      <li><span class="hl-gold">利益原則</span>：維護受試者最大福祉，不得欺瞞或強迫</li>
      <li><span class="hl-teal">自主原則</span>：尊重受試者自我選擇與退出研究之權利</li>
      <li><span class="hl-coral">公平原則</span>：對所有參與對象給予公平對待</li>
    </ul>
  </div>
</div>
<div class="sh">研究樣本的四大基本權利</div>
<ul class="b-list">
  <li><strong class="hl-gold">避免傷害之權利</strong>：保護受試者免於生理、情緒、經濟及社會關係受損</li>
  <li><strong class="hl-teal">充分認知之權利</strong>：研究前有權要求充分說明目的、步驟、可能問題</li>
  <li><strong class="hl-coral">自決之權利</strong>：決定是否參與或退出，退出後基本就醫權益不受影響</li>
  <li><strong class="hl-green">隱私、匿名與保密之權利</strong>：個人資料不得被濫用，錄音錄影需事先同意</li>
</ul>

<div class="imp-box">學術研究倫理基本原則：理性（rationality）、客觀（objectivity）、一致（integrity）、誠實（honesty）、負責（responsibility）、合作（collegiality）、公平（fairness）、開放（openness）。違反者可能面臨書面告誡、停權1-10年乃至終身停權等處分。</div>

<div class="sh">臺灣護理研究發展三個階段</div>
<table class="cmp-table">
<tr><th>階段</th><th>時期</th><th>重要事件</th></tr>
<tr><td><span class="hl-coral">發展前期（研究沙漠期）</span></td><td>1960年之前</td><td>學徒式教育為主，1954-1956年護理學系相繼成立，研究發表極為有限</td></tr>
<tr><td><span class="hl-gold">發展期</span></td><td>1960～1981年</td><td>1967年《護理雜誌》設立護理研究專欄，1974年生物統計學列入必修</td></tr>
<tr><td><span class="hl-green">茁壯期</span></td><td>1982年至今</td><td>1979-1984年護研所碩士班成立，1997年臺大護理博士班，各類研究雜誌陸續出刊</td></tr>
</table>
`,
quiz:[
{q:"護理研究的目標，下列何者最正確？",opts:["增加護理師薪資","追求實證基礎以提升整體健康照護系統之照護品質","建立護理行政管理效率","減少醫院醫療糾紛"],ans:1,exp:"護理研究是以社會科學或生物科學為主體之探索過程，目標在追求實證基礎，以提升對病人、家屬、健康照護者及整個健康照護系統之照護品質。"},
{q:"依 Best（1981）的說明，下列哪一項「不屬於」研究的特性？",opts:["研究需力求客觀與合理","研究結論應消弭個人偏見","研究可依研究者主觀偏好選擇收集資料","研究需運用專門知識與技術"],ans:2,exp:"研究程序需力求客觀、合理，應消弭個人偏見；依研究者主觀偏好選擇方式違背研究客觀原則。"},
{q:"護理研究的倫理三大原則中，「自主原則」的核心意義是？",opts:["維護受試者最大福祉，不得欺瞞","尊重受試者的自我選擇與隨時退出研究之權利","對所有參與對象給予公平對待","研究者應有勇氣公開發表研究成果"],ans:1,exp:"自主原則指護理師於執行研究時應尊重與維護受試者的自主、自我選擇、提出詢問或隨時退出研究之權利。"},
{q:"臺灣護理研究發展的「研究沙漠期」是指哪個時期？",opts:["1982年至今","1960～1981年","1960年之前","2000年之後"],ans:2,exp:"1960年之前屬發展前期，以學徒式教育為主，護理研究發表者極為有限，故稱研究沙漠期。"},
{q:"研究樣本的「避免傷害之權利」涵蓋哪些層面？",opts:["只涉及生理傷害","只涉及心理傷害","涵蓋生理、情緒、經濟與社會關係等層面的損傷","只涉及隱私權的保護"],ans:2,exp:"根據美國衛生與人力服務部的定義，傷害危險包括樣本暴露於日常生活之外，對其身體、情緒、經濟與社會關係均可能產生之損傷。"}
]},

{num:2,title:"研擬研究主題、目的、問題及假設的設立",en:"Formulating Research Topic, Purpose, Question and Hypothesis",
content:`
<div class="sh">研究問題的四種來源類型</div>
<div class="def-box"><span class="def-term">研究問題的定義</span><span class="def-en">①尚未找到方法解決，有待研究者去發掘的現象 ②已獲相關訊息，需要尋找解決方法 ③已知現象，若經修正是否會有不一樣的結果 ④完全無知的現象，有待發掘探索</span></div>

<div class="sh">獲得研究問題的六大管道</div>
<div class="g2">
  <div class="c-card accent-gold"><div class="c-head"><span class="ico">💼</span>① 自身或他人的臨床經驗</div>在執行業務時發現問題。可自問：<em>在臨床上遇到最困擾的事是什麼？如何解決？做了改善後結果是否不同？</em>
  <div class="ex-box" style="margin-top:8px"><div class="ex-tag">臨床思考範例</div>術前病人常感焦慮 → 為什麼緊張？緊張什麼？如何降低焦慮？ → <span class="kp">術前衛教</span>研究問題</div></div>
  <div class="c-card accent-teal"><div class="c-head"><span class="ico">📖</span>② 文獻查證</div>大量閱讀期刊文章，了解研究設計與不足之處。<span class="kp-t">文獻查證</span>（literature review）是研究非常重要的步驟，占比非常多，研究者切莫輕忽。</div>
  <div class="c-card accent-coral"><div class="c-head"><span class="ico">🔄</span>③ 研究的複製</div>假設某研究在不同地方結果可能不同；因<span class="hl-gold">文化差異</span>或<span class="hl-teal">時代變遷</span>而有必要再重新探究；研究者必須有足夠論述以證明複製的必要。</div>
  <div class="c-card accent-green"><div class="c-head"><span class="ico">📰</span>④ 時事</div>研究目的就是解決現實問題。例如：<span class="kp-g">COVID-19疫情</span>下的議題、<span class="kp-g">AR/VR於護理教育</span>的運用。研究者須隨時注意專業發展趨勢。</div>
  <div class="c-card accent-purple"><div class="c-head"><span class="ico">👨‍🏫</span>⑤ 指導老師的研究主題</div>在指導教授大架構下，學生協助子研究；護理整合型研究已逐漸增加趨勢。</div>
  <div class="c-card accent-gold"><div class="c-head"><span class="ico">🏛️</span>⑥ 特定機構研究方向</div>衛生福利部委外科技研究計畫、國民健康署政策性研究、國科會性別研究、台灣護理學會等。</div>
</div>

<div class="sh">研究目的（Research Purpose）的書寫要素</div>
<div class="imp-box">研究目的以<span class="hl-gold">肯定句形式</span>呈現，以2～4行精簡表達，必須包含：<span class="hl-teal">研究對象</span> + <span class="hl-gold">研究變項</span> + <span class="hl-coral">動詞（探究/了解/比較/檢驗）</span>。</div>

<div class="sh">研究問題的三種類型</div>
<table class="cmp-table">
<tr><th>類型</th><th>特徵</th><th>範例</th></tr>
<tr><td><span class="hl-gold">描述性研究問題</span></td><td>一個變項，描述現象</td><td>慢性思覺失調症患者主觀幸福感為何？</td></tr>
<tr><td><span class="hl-teal">相關性研究問題</span></td><td>兩個變項，探討關係</td><td>社會支持與患者主觀幸福感的相關性為何？</td></tr>
<tr><td><span class="hl-coral">實驗性研究問題</span></td><td>自變項+依變項，測試介入效果</td><td>改良式藥物衛教計畫能否改善精神病病人的服藥遵從性？</td></tr>
</table>

<div class="sh">研究假設（Hypothesis）</div>
<div class="g2">
  <div class="def-box" style="margin:0"><span class="def-term">研究假設</span><span class="def-en">研究者在進行研究前，依據研究問題的理解，以過去相關的<span class="hl-gold">理論與研究</span>為基礎，提出<span class="hl-teal">暫時性答案</span>。研究問題是<strong>問號</strong>，研究假設是<strong>句號</strong>呈現。</span></div>
  <div class="def-box" style="margin:0"><span class="def-term">統計假設</span><span class="def-en"><span class="kp">虛無假設 H₀</span>：假設變項間無差別、無影響或無差異。<span class="kp-r">對立假設 H₁</span>：正好相反。所有研究都希望能<span class="hl-gold">推翻虛無假設</span>而接受對立假設，書寫時只需寫出對立假設。</span></div>
</div>

<div class="sh">研究假設的四大特性</div>
<ul class="b-list">
  <li><strong class="hl-gold">以具體文字說明</strong>研究期待的結果</li>
  <li>對研究問題有<strong class="hl-teal">特定的預測</strong></li>
  <li>可以有<strong>方向性</strong>（較高/較低）或<strong>無方向性</strong>（有差異）</li>
  <li>必須建立在<strong class="hl-coral">好的研究問題</strong>上，且有理論或文獻依據</li>
</ul>
<div class="ex-box"><div class="ex-tag">範例比較</div>
<strong>有方向性假設：</strong>接受支持性成長團體的思覺失調症病人，其自我烙印<span class="hl-green">較低</span>。<br>
<strong>無方向性假設：</strong>有無接受支持性成長團體的思覺失調症病人，其自我烙印<span class="hl-teal">有差異</span>。</div>
`,
quiz:[
{q:"下列哪種情況「不屬於」研究問題的來源？",opts:["臨床工作中發現護理問題","閱讀文獻發現研究缺口","個人主觀認為某事重要但無任何實證根據","複製其他文化背景的研究"],ans:2,exp:"研究問題應來自臨床經驗、文獻查證、研究複製及時事；單純個人主觀認為重要而無任何依據，不符合研究問題的條件。"},
{q:"「研究的複製」最主要的目的是什麼？",opts:["節省研究者的時間與成本","在不同條件下驗證是否能得到新的有意義的答案","確認所有研究結果都相同","替代文獻查證的步驟"],ans:1,exp:"研究複製假設某研究的結果在不同地方可能不同，研究者可從新的研究中得到新的且有意義的答案；需有足夠論述以證明複製的必要性。"},
{q:"「虛無假設（H₀）」的正確意涵是？",opts:["研究者期望的結果","假設變項間無差別、無影響或無差異","研究者必須接受的假設","只適用於質性研究的統計方法"],ans:1,exp:"虛無假設假設變項間都無差別、無影響或無差異，對立假設正好相反。所有研究都希望推翻虛無假設而接受對立假設。"},
{q:"研究目的的書寫必須包含哪些要素？",opts:["只需包含研究對象","研究對象、研究變項、動詞（探究/了解/比較）","研究者姓名、研究日期、研究地點","統計方法、樣本數、研究期限"],ans:1,exp:"研究目的以肯定句形式呈現，必須包含：研究對象、研究變項，以及動詞（要去探究、了解或是檢驗）。"},
{q:"下列哪一個研究問題屬於「相關性研究問題」？",opts:["慢性思覺失調症患者主觀幸福感為何？","社會支持與患者主觀幸福感的相關性為何？","改良式衛教是否能改善術前焦慮？","探討護理師的職場壓力現況"],ans:1,exp:"相關性研究問題包含兩個變項，目的在探討變項間的關係；「社會支持」與「主觀幸福感」是兩個明確變項的相關性探討。"}
]},

{num:3,title:"文獻查證",en:"The Literature Review",
content:`
<div class="def-box"><span class="def-term">文獻查證（Literature Review）</span><span class="def-en">運用<span class="hl-gold">系統性、明確方法</span>找出所欲探討主題之相關研究文章，整合文獻資料並提出結論，找出<span class="hl-teal">未來研究領域</span>和發展<span class="hl-coral">臨床實務指引</span>的過程。亦稱文獻探討、文獻搜索、文獻評析。</span></div>

<div class="sh">文獻查證的七大功能</div>
<div class="g2">
  <div class="c-card accent-gold"><div class="c-head">① 發現與確立研究題目</div>可從文獻中發現研究問題，將泛泛主題（<em>高危險妊娠孕婦</em>）具體化為可行題目（<em>強迫臥床安胎孕婦照護需求</em>）。</div>
  <div class="c-card accent-teal"><div class="c-head">② 了解研究現況（拼圖概念）</div>他人研究如同已完成的部分拼圖，文獻查證讓研究者找出可<span class="hl-teal">接續完成</span>的片段。</div>
  <div class="c-card accent-coral"><div class="c-head">③ 熟悉相關理論與知識</div>相關理論知識查證有助於擬定<span class="hl-coral">資料收集工具</span>、設計研究情境，提升資料分析的周延性與信效度。</div>
  <div class="c-card accent-green"><div class="c-head">④ 名詞確立與假設形成</div>決定相關概念與<span class="hl-green">名詞界定</span>，獲悉先前研究問題，進而決定研究假設。假設需有文獻基礎。</div>
  <div class="c-card accent-purple"><div class="c-head">⑤ 發展概念架構</div>多方查證後可截長補短整合理論模式，形成所需概念架構；文獻查證左右了研究架構的形成。</div>
  <div class="c-card accent-gold"><div class="c-head">⑥ 獲得研究設計線索</div>哪些變項需控制？樣本數是否足夠？現行研究工具是否可用？相關研究的限制與建議是重要參考。</div>
</div>
<div class="c-card accent-teal" style="margin-top:8px"><div class="c-head">⑦ 提供與研究結果相較之資料</div>研究結果需與整個知識體系連結；查證哪個知識體系有相關理論？有無相關研究發現可供分析比較？</div>

<div class="sh">重要護理期刊資源</div>
<table class="cmp-table">
<tr><th>類型</th><th>期刊名稱</th></tr>
<tr><td><span class="hl-gold">臺灣本土</span></td><td>《護理雜誌》、《長庚護理》、The Journal of Nursing Research</td></tr>
<tr><td><span class="hl-teal">西文綜合</span></td><td>Nursing Research、Research in Nursing & Health、Journal of Advanced Nursing、Advanced Nursing Science</td></tr>
<tr><td><span class="hl-coral">神經科學護理</span></td><td>Journal of Neuroscience Nursing、International Journal of Neurological Nursing</td></tr>
<tr><td><span class="hl-green">婦產科/癌症護理</span></td><td>The American Journal of Maternal Child Nursing、Cancer Nursing</td></tr>
</table>

<div class="sh">資料庫檢索策略</div>
<div class="g2">
  <div class="c-card-g"><div class="c-head">縮小主題範圍（Limit Set）</div>在語言、年代、文章類型作選擇，例如：限定<span class="hl-green">英文全文，2017年後</span>。</div>
  <div class="c-card-t"><div class="c-head">邏輯運算元</div>
    <ul class="b-list">
      <li><span class="kp-g">AND</span>：關鍵詞交集（更精確）</li>
      <li><span class="kp-t">OR</span>：關鍵詞聯集（更廣泛）</li>
      <li><span class="kp-r">NOT</span>：排除特定主題</li>
    </ul>
  </div>
</div>

<div class="sh">文獻閱讀四步驟</div>
<div class="flow">
  <div class="flow-step"><div class="fs-num">1</div><div class="fs-txt">瀏覽</div>閱讀題目與摘要，初步分類</div>
  <div class="flow-step"><div class="fs-num">2</div><div class="fs-txt">精讀</div>逐字逐句理解，畫線關鍵內容</div>
  <div class="flow-step"><div class="fs-num">3</div><div class="fs-txt">分析</div>分類概念、理論、研究方法</div>
  <div class="flow-step"><div class="fs-num">4</div><div class="fs-txt">整合</div>建立新架構，重新組織知識</div>
</div>

<div class="sh">第一手資料 vs 第二手資料</div>
<table class="cmp-table">
<tr><th>資料類型</th><th>定義</th><th>適用性</th></tr>
<tr><td><span class="hl-gold">第一手資料（Primary Source）</span></td><td>研究者本身所寫的研究報告，多出現於研究性期刊</td><td class="good">優先採用，提供詳細客觀內容</td></tr>
<tr><td><span class="hl-teal">第二手資料（Secondary Source）</span></td><td>非原始研究者所寫，或引述他人研究的回顧性文獻</td><td class="bad">可提供參考資料目錄，但不可代替第一手資料</td></tr>
</table>
`,
quiz:[
{q:"文獻查證的「拼圖概念」最正確的意涵是？",opts:["文獻查證需將所有文章一一拼湊排列","他人研究已對現象有一定程度了解，研究者需找出可接續完成的片段","文獻越多拼圖越完整就越好","文獻查證需要團隊合作完成"],ans:1,exp:"他人的研究如同已拼好部分的拼圖，文獻查證讓研究者了解目前已完成的部分，並找出可接續探索的方向。"},
{q:"文獻查證的邏輯運算元「AND」的功能是？",opts:["擴大搜尋範圍，增加文獻篇數","縮小範圍，找出同時包含兩個關鍵詞的文獻","排除特定主題的文獻","合併多個資料庫"],ans:1,exp:"AND用於關鍵詞交集，結果文獻需同時包含所有關鍵詞，可縮小搜尋範圍，找到更精確的文獻。"},
{q:"下列何者為「第一手資料（Primary Source）」？",opts:["回顧性文獻報告","引述他人研究結果的文章","研究者本身所寫的原始研究報告","教科書中對研究主題的介紹"],ans:2,exp:"第一手資料是研究者本身所寫的研究報告，多出現在以研究性文章為主的期刊中，引用文獻時以採用第一手資料為佳。"},
{q:"研究者對「高危險妊娠孕婦」有興趣，但此主題尚不夠具體，藉由文獻查證後具體化為「強迫臥床安胎孕婦照護需求之探討」，此說明了文獻查證的哪項功能？",opts:["了解研究現況（拼圖概念）","發現與確立研究題目","獲得研究設計的線索","提供與研究結果相較之資料"],ans:1,exp:"文獻查證能將泛泛的研究主題（高危險妊娠孕婦）具體化為更精確可行的研究題目（強迫臥床安胎孕婦照護需求），是文獻查證「發現與確立研究題目」的功能。"},
{q:"文獻閱讀的正確步驟順序為何？",opts:["精讀→瀏覽→分析→整合","瀏覽→精讀→分析→整合","分析→瀏覽→精讀→整合","整合→分析→精讀→瀏覽"],ans:1,exp:"文獻資料的閱讀與分析步驟為：瀏覽文獻（先看題目與摘要）→精讀文獻（逐字閱讀）→分析文獻（按面向分類）→整合文獻（建立新架構）。"}
]},

{num:4,title:"名詞界定與研究架構之形成",en:"Define Research Variables and Formulating Research Framework",
content:`
<div class="sh">名詞界定的意義</div>
<div class="def-box"><span class="def-term">名詞界定</span><span class="def-en">對研究主題中的「<span class="hl-gold">概念（concept）</span>」加以說明的過程。概念分為<span class="hl-teal">具體概念</span>（蘋果、椅子、手指——可見、可測量）與<span class="hl-coral">抽象概念</span>（疼痛、壓力、焦慮、健康、滿意度——需界定才能測量）兩類。</span></div>

<div class="sh">兩種定義的比較</div>
<table class="cmp-table">
<tr><th>定義類型</th><th>英文</th><th>定義</th><th>功能</th></tr>
<tr><td><span class="hl-gold">概念性定義</span></td><td>Conceptual Definition</td><td>運用理論中的抽象概念，對研究欲探討的變項加以解釋；需引述<strong>理論或學者</strong>的定義，並寫出文獻出處</td><td>提供具理論意義的概念說明</td></tr>
<tr><td><span class="hl-teal">操作性定義</span></td><td>Operational Definition</td><td>將概念性定義具體化描述，使概念<strong>符合研究情境</strong>且可供測量</td><td>將概念轉為可供測量的「<span class="kp-t">變項</span>」</td></tr>
</table>

<div class="imp-box">研究者於進行名詞界定時，最好<span class="hl-gold">同時呈現概念性定義與操作性定義</span>，前者說明理論基礎，後者說明如何在研究中測量，兩者共同確保研究具體可行。</div>

<div class="sh">名詞界定範例</div>
<div class="ex-box"><div class="ex-tag">範例一：心跳速率</div>
<strong>研究主題：</strong>安撫性奶嘴對加護病房保溫箱中早產兒餵食前後心跳速率及動脈血氧飽和度成效性探討<br><br>
<span class="hl-gold">概念性定義：</span>每分鐘<span class="kp">心室收縮次數</span>（Astrand & Rodahl, 1970）<br>
<span class="hl-teal">操作性定義：</span>以<span class="kp-t">心電圖</span>測量早產兒每分鐘心跳次數</div>

<div class="ex-box"><div class="ex-tag">範例二：創傷</div>
<strong>研究主題：</strong>美國非裔女性的社會創傷與力量對其產下低體重兒之體重預測研究<br><br>
<span class="hl-gold">概念性定義：</span>創傷是個人因經歷涉及自我或他人的實際或潛在威脅，而造成參與者身心受創（Dailey, 2009）<br>
<span class="hl-teal">操作性定義：</span>以「<span class="kp-t">創傷史問卷（THQ）</span>」評估工具所評得的創傷程度，<strong>分數越高表示遭受創傷程度越高</strong></div>

<div class="sh">操作性定義的書寫要點</div>
<ul class="b-list">
  <li>應<strong class="hl-gold">具體化</strong>，避免抽象或籠統的描述</li>
  <li>必須考量<strong class="hl-teal">研究情境</strong>（如收案場所特性）</li>
  <li><strong class="hl-coral">不佳範例：</strong>焦慮定義為「個人遭遇壓力時產生的害怕擔心的情緒反應」→ 難以量化</li>
  <li><strong class="hl-green">良好範例：</strong>「以 Taylor 顯著焦慮量表測量所得分數，20-39分輕度，40-59分中度，60分以上重度」</li>
</ul>

<div class="sh">研究架構（Research Framework）</div>
<div class="g2">
  <div class="def-box" style="margin:0"><span class="def-term">研究架構的意義</span><span class="def-en">研究者如何看待一個問題或現象的觀點；協助研究者清楚呈現<span class="hl-gold">研究變項間的關係</span>，並將研究結果與護理知識相連結。不一定是圖，也可以是文字敘述。</span></div>
  <div class="def-box" style="margin:0"><span class="def-term">研究架構的四大功能</span><span class="def-en">① 統整文獻知識 ② 呈現概念及概念間關係 ③ 呈現研究設計方法 ④ 作為研究結果統整、分析與解釋的依據</span></div>
</div>

<div class="sh">研究架構擬定四步驟</div>
<div class="flow">
  <div class="flow-step"><div class="fs-num">1</div><div class="fs-txt">陳述研究問題</div>明確列出相關概念</div>
  <div class="flow-step"><div class="fs-num">2</div><div class="fs-txt">概念選擇與界定</div>給予操作性定義</div>
  <div class="flow-step"><div class="fs-num">3</div><div class="fs-txt">連結概念關係</div>確認影響方向</div>
  <div class="flow-step"><div class="fs-num">4</div><div class="fs-txt">繪製架構圖</div>框框+箭頭呈現</div>
</div>
<div class="imp-box">研究架構圖中，<span class="hl-gold">「框框」</span>代表概念，<span class="hl-teal">「線條/箭頭」</span>代表概念間的關係，箭頭方向標明影響方向。通常<span class="hl-coral">因果發生序列由左向右</span>呈現。</div>
`,
quiz:[
{q:"「以 Taylor 顯著焦慮量表測量所得分數作為焦慮程度指標」屬於哪種定義？",opts:["概念性定義","操作性定義","統計性定義","功能性定義"],ans:1,exp:"操作性定義是將概念性定義具體化描述，使概念符合研究情境且可供測量；量表名稱及評分方式即是焦慮的操作性定義。"},
{q:"研究架構的功能「不包括」下列哪一項？",opts:["統整文獻知識","呈現研究概念間的關係","直接決定研究結果是否顯著","作為研究結果統整分析與解釋的依據"],ans:2,exp:"研究架構的四大功能為：統整文獻知識、呈現概念及概念間關係、呈現研究設計方法、作為研究結果統整分析依據；直接決定研究結果顯著與否不是架構的功能。"},
{q:"研究架構中「箭頭」的功能是？",opts:["代表概念本身","標明概念間的影響方向與關係","代表研究的統計方法","表示文獻引用的出處"],ans:1,exp:"研究架構圖以「框框」置入概念，以「線條或箭頭」表示概念間的關係，箭頭的指向標明影響方向，說明研究假設與研究欲測試的問題。"},
{q:"操作性定義的最重要特性是？",opts:["引述理論或學者對概念的解釋","具體化，使概念符合研究情境且可供測量","需與概念性定義完全相同","提供概念的哲學背景說明"],ans:1,exp:"操作性定義是將概念性定義進一步具體化，使概念符合研究情境且可供測量，是將抽象概念轉為可測量變項的關鍵步驟。"},
{q:"下列哪個概念屬於「抽象概念」，需進行名詞界定後才能研究測量？",opts:["蘋果","椅子","焦慮","手指"],ans:2,exp:"焦慮、壓力、滿意度等都是抽象概念，需進行名詞界定（概念性定義+操作性定義）後才能在研究中測量；蘋果、椅子、手指是具體可見可測量的概念。"}
]},

{num:5,title:"研究取樣之考量與方法",en:"The Methods and Considerations of Sampling",
content:`
<div class="sh">取樣的核心概念</div>
<div class="g2">
  <div class="def-box" style="margin:0"><span class="def-term">母群體（Population）</span><span class="def-en">研究調查所有對象的集合體，也就是所有符合指定標準的個案（包括人、動物、文件、事件、行為等）集合體。</span></div>
  <div class="def-box" style="margin:0"><span class="def-term">樣本（Sample）</span><span class="def-en">從可及母群體中抽出代表母群體的部分單元；<span class="hl-gold">樣本越能真確代表母群體特徵，即越「好」的樣本</span>。</span></div>
  <div class="def-box" style="margin:0"><span class="def-term">目標母群體（Target Population）</span><span class="def-en">研究者想研究和推論的所有對象（如：全台乳房切除術後的婦女）。</span></div>
  <div class="def-box" style="margin:0"><span class="def-term">可及母群體（Accessible Population）</span><span class="def-en">研究者可實際接近的子集合（如：某醫學中心的乳房切除術後婦女）；是目標母群體的一部分。</span></div>
</div>
<div class="def-box"><span class="def-term">取樣架構（Sampling Frame）</span><span class="def-en">整體取樣單位的詳細名單，可供取樣之用。以「學校班級」為取樣單位，則「全校所有班級名冊」即為取樣架構。</span></div>
<div class="def-box"><span class="def-term">取樣誤差（Sampling Error）</span><span class="def-en">樣本偏離母群體的差異。<span class="hl-gold">取樣誤差越大，樣本代表性越差；樣本數越大，越能降低隨機誤差</span>。</span></div>

<div class="sh">機率性取樣 vs 非機率性取樣</div>
<table class="cmp-table">
<tr><th>取樣方式</th><th>特徵</th><th>代表性</th><th>適用情境</th></tr>
<tr><td><span class="hl-gold">機率性取樣</span></td><td>每個單元都有被抽取的機率，以「隨機」為基礎</td><td class="good">較高</td><td>需要大型具代表性樣本的調查</td></tr>
<tr><td><span class="hl-teal">非機率性取樣</span></td><td>以非隨機方式選擇，無法說明每個抽樣單元的抽取機率</td><td class="bad">較低</td><td>實際可行、時間金錢有限時</td></tr>
</table>

<div class="sh">機率性取樣四種方法</div>
<div class="g2">
  <div class="c-card accent-gold"><div class="c-head">① 簡單隨機取樣</div>完全依機率抽取；先將母群體各單元編號，再隨機選出所需樣本數（抽籤、亂數表、電腦）。<br><span class="hl-coral">缺點：</span>耗時費力，母群體太大時不適用。</div>
  <div class="c-card accent-teal"><div class="c-head">② 分層隨機取樣</div>依研究特性（性別、教育程度）將母群體分層，再從各層進行隨機取樣。分為<span class="kp-t">比例取樣</span>與<span class="kp-t">非比例取樣</span>。適合確保特定分層的代表性。</div>
  <div class="c-card accent-coral"><div class="c-head">③ 叢聚取樣（集群取樣）</div>多步驟取樣，先抽叢聚（縣市→鄉鎮→村里），再從叢聚中抽樣。<span class="hl-green">優點：</span>省時省費，母群體名冊不易取得時適用。<span class="hl-coral">缺點：</span>取樣誤差較高。</div>
  <div class="c-card accent-green"><div class="c-head">④ 系統隨機取樣（等距取樣）</div>先隨機選第一個樣本，之後依<span class="hl-gold">固定間隔距離</span>抽取（母群體數÷樣本數＝間隔數）。注意間隔數不可與變異週期相同，否則產生嚴重偏差。</div>
</div>

<div class="sh">非機率性取樣四種方法</div>
<div class="g2">
  <div class="c-card-r"><div class="c-head">① 方便取樣（便利取樣）</div>就近依賴身邊現有的人為研究對象。<span class="hl-coral">樣本代表性最弱</span>，但最簡易、常用。研究結果無法推論至整個母群體。</div>
  <div class="c-card-t"><div class="c-head">② 滾雪球取樣</div>樣本由小而大，透過關係或人際網路引薦；適用於<span class="hl-teal">樣本特殊、不易取得</span>時（藥物成癮者、罕見疾病、非法移民）。常用於質性研究田野調查。</div>
  <div class="c-card"><div class="c-head">③ 配額取樣</div>先了解母群體的分層情形，決定各層比例，再以方便取樣方式選取樣本。與<span class="hl-gold">分層隨機取樣</span>雷同，但後者是隨機取樣，配額取樣是方便取樣（非隨機）。</div>
  <div class="c-card-g"><div class="c-head">④ 立意取樣（判斷式取樣）</div>依研究者對母群體的了解、研究目的決定取樣方式；較主觀，通常用於<span class="hl-green">樣本數小或無法隨機取樣</span>時，如問卷前測。</div>
</div>

<div class="sh">樣本數的考量因素</div>
<ul class="b-list">
  <li>一般每項研究至少要有 <span class="kp">30個樣本</span>以上才具代表性</li>
  <li>研究的每個條件或特性（如性別）至少需要 <span class="kp">10個以上</span>的樣本</li>
  <li>變項數目增加時，樣本數也需隨之增加（10個變項 → 100個以上樣本）</li>
  <li><span class="hl-gold">樣本數大不一定具有代表性</span>，<strong>代表性遠比樣本數目重要</strong></li>
  <li>取樣誤差通常以<strong>正負百分點</strong>表示，信心水準多採 <span class="kp-t">95%</span> 以上</li>
</ul>
`,
quiz:[
{q:"「可及母群體（Accessible Population）」與「目標母群體（Target Population）」的關係為何？",opts:["兩者完全相同","可及母群體是目標母群體的子集合","目標母群體是可及母群體的子集合","兩者完全不相關"],ans:1,exp:"可及母群體是目標母群體中的一部分，是研究者可以取得的研究對象之集合體；目標母群體範圍較廣，可及母群體是研究者實際能接觸的部分。"},
{q:"「系統隨機取樣（等距取樣）」需特別注意什麼？",opts:["樣本數不能超過100","間隔數不可與母群體的變異週期相同，否則產生嚴重偏差","只能用於質性研究","不需要建立取樣架構"],ans:1,exp:"系統隨機取樣最重要的關鍵是間隔數不可與母群體的變異情形（週期）一致，若兩者相同則研究會產生嚴重錯誤或偏差而失去價值。"},
{q:"「滾雪球取樣（Snowball Sampling）」最適合用於哪種情況？",opts:["母群體同質性高的大規模調查","樣本相當特殊、不易取得，如藥物成癮者或非法移民","需要具代表性樣本的全國性調查","有完整取樣架構的系統性研究"],ans:1,exp:"滾雪球取樣通常用於樣本相當特殊、不易取得時，或在很難找到母群體成員時，如藥物成癮者、性工作者、罕見疾病病人等。"},
{q:"「分層比例取樣」與「分層非比例取樣」的最主要差異是？",opts:["前者使用隨機取樣，後者不使用","前者依母群體各層的比例取樣，後者不依比例取樣","前者適用於質性研究，後者適用於量性研究","兩者完全相同，只是名稱不同"],ans:1,exp:"分層比例取樣依母群體各層的比例進行取樣；分層非比例取樣不依比例，通常用於某層樣本數太少時，增加少數群體的抽樣比例。"},
{q:"下列哪項陳述關於「樣本數」是正確的？",opts:["樣本數越大，代表性一定越高","樣本數大小是最重要的考量，遠比代表性重要","代表性遠比樣本數目重要，且每項研究至少需30個樣本","只要使用隨機取樣，樣本數多少無關緊要"],ans:2,exp:"樣本數大並不一定具有代表性，研究樣本之代表性遠比樣本數目重要。一般每項研究至少要有30個樣本以上才具代表性。"}
]},

{num:6,title:"研究設計",en:"Research Design",
content:`
<div class="sh">研究設計的六大基本成分</div>
<div class="g2">
  <div class="c-card accent-gold"><div class="c-head">① 研究對象（Research Object）</div>需考量研究對象、年齡、性別、職業別等<span class="hl-gold">人口學變項</span>，以及疾病診斷、症狀徵象、患病年限、併發症等<span class="hl-teal">疾病特徵</span>。</div>
  <div class="c-card accent-teal"><div class="c-head">② 研究的現象或變項</div>研究設計之<span class="hl-teal">重心</span>；可針對單一變項或多重變項；護理研究多為多重變項設計（因人類的複雜性）。</div>
  <div class="c-card accent-coral"><div class="c-head">③ 資料收集方法</div>常用：<span class="kp-r">問卷調查法</span>、<span class="kp-r">訪談</span>、<span class="kp-r">觀察法</span>、<span class="kp-r">儀器測量法</span>、線上表單。需描述收集者背景、資料收集期間、方式及頻率。</div>
  <div class="c-card accent-green"><div class="c-head">④ 研究場所與情境</div><span class="hl-gold">實驗室內（人工化情境）</span> vs <span class="hl-teal">非實驗室內（自然情境）</span>；護理研究多選擇自然情境，因研究對象為人類。</div>
  <div class="c-card accent-purple"><div class="c-head">⑤ 取樣方法</div>考量研究目的、取得難易度、時間人力財力限制；護理研究多採<span class="hl-purple">非隨機取樣</span>。</div>
  <div class="c-card accent-gold"><div class="c-head">⑥ 研究者的角色職責</div>四種角色：<span class="kp">局外者</span>、<span class="kp">觀察者的參與</span>、<span class="kp">參與觀察者</span>、<span class="kp">完全參與者</span>。需清楚描述自己在研究歷程的定位。</div>
</div>

<div class="sh">研究設計的考量因素</div>
<ul class="b-list">
  <li><strong class="hl-gold">研究現象與目的的本質</strong>：決定研究設計的基本方向</li>
  <li><strong class="hl-teal">研究者的認知程度</strong>：初次研究者宜選擇熟悉的情境與對象</li>
  <li><strong class="hl-coral">倫理或人權因素</strong>：涉及人的研究計畫需先送IRB申請計畫審查</li>
  <li><strong class="hl-green">研究經費與時間預算</strong>：某些儀器設備或長時間研究需申請補助</li>
  <li><strong class="hl-purple">知識發展趨勢</strong>：進行資料庫搜尋，避免主題重複</li>
  <li><strong>實際研究情境的限制</strong>：前驅研究（Pilot Research）評估並修正設計</li>
</ul>

<div class="sh">研究設計的分類</div>
<div class="sh2">一、依研究目的或結果</div>
<table class="cmp-table">
<tr><th>類型</th><th>定義</th><th>次分類</th></tr>
<tr><td><span class="hl-gold">描述性研究設計</span></td><td>呈現資料收集結果、變項間相關性或比較</td><td>調查性、相關性、發展性</td></tr>
<tr><td><span class="hl-teal">探索性研究設計</span></td><td>對不熟悉的現象一窺究竟；質性研究是典型代表</td><td>訪談、參與性觀察、個案報告</td></tr>
<tr><td><span class="hl-coral">因果性研究設計</span></td><td>驗證研究假設中變項間的因果關係</td><td>實驗性研究設計為主要代表</td></tr>
</table>
<div class="sh2">二、依研究場所與情境</div>
<div class="g2">
  <div class="c-card-g"><div class="c-head">🔬 實驗室研究</div>研究者可有效掌握和控制場所。<span class="hl-teal">優點：</span>較能推論因果關係。<span class="hl-coral">缺點：</span>難以推論到自然情境。</div>
  <div class="c-card-t"><div class="c-head">🏥 非實驗室研究</div>選擇自然情境收集研究對象的自然行為；護理研究中臨床情境均屬此類。<span class="hl-teal">優點：</span>具有較高的<span class="kp-t">外在效度</span>。</div>
</div>
`,
quiz:[
{q:"護理研究最常見的資料收集方法中，下列何者「不屬於」？",opts:["問卷調查法","訪談","動物實驗","儀器測量法"],ans:2,exp:"護理研究最常使用的資料收集方法包括問卷調查法、訪談、觀察法、儀器測量法及線上表單；動物實驗不屬其常用方式。"},
{q:"護理研究大多選擇「非實驗室內（自然情境）」的主要原因是？",opts:["因為自然情境費用較低","護理研究對象是人類，探究人類在自然情境中的現象","因為自然情境的研究結果更精準","因為實驗室設備取得不易"],ans:1,exp:"護理研究的對象是人類，探究的是人類在自然情境中的現象，所以多數護理研究選擇在非實驗室內進行，且具有較高的外在效度。"},
{q:"若研究設計中有「研究助理」協助收集資料，應如何處理？",opts:["不需特別說明，助理只是輔助","應描述其專業背景、與研究的相關性及接受研究訓練的過程，以維持資料收集一致性","只需在謝辭中提及","由助理自行決定收集方式"],ans:1,exp:"若有其他資料收集者參與，應描述其專業背景、與研究的相關性及接受研究訓練過程，清楚呈現資料收集過程的一致性，以維持較理想的內在效度。"},
{q:"「探索性研究設計」最典型的代表是？",opts:["隨機對照試驗（RCT）","質性研究","問卷調查研究","整合分析（Meta-analysis）"],ans:1,exp:"探索性研究設計當研究者對研究現象不熟悉時使用，以訪談、參與性觀察等方法進行；質性研究是典型的探索性研究設計。"},
{q:"「前驅研究（Pilot Research）」在研究設計中的功能是？",opts:["正式收集所有研究資料","評估研究的可行性，預測困難並在正式研究前修正設計","決定最終的研究題目","替代正式研究的進行"],ans:1,exp:"前驅研究在正式資料收集前先進行，藉此了解有何尚未周延之處，若可及時修正，有助於避免在正式研究中造成難以彌補的缺憾。"}
]},

{num:7,title:"非實驗性研究設計",en:"Non-experimental Research Design",
content:`
<div class="def-box"><span class="def-term">非實驗性研究設計</span><span class="def-en">針對變項、群體或情境，進行<span class="hl-gold">描述、區別或檢查變項關係</span>的研究；處於<span class="hl-teal">自然分配</span>下，未涉及隨機分配、控制組或操縱變項，主要以<span class="hl-coral">觀察</span>為主。最常見的是描述性或相關性研究設計。</span></div>

<div class="sh">選用非實驗性研究的五大理由</div>
<ul class="num-list">
  <li><strong class="hl-gold">與人相關的特質</strong>：考量人的特質不能採用實驗方式，無法控制或無法隨機分配</li>
  <li><strong class="hl-teal">倫理考量</strong>：某些情況在倫理上不允許進行介入</li>
  <li><strong class="hl-coral">執行真實實驗有實務困難</strong>：無法控制所有干擾因素</li>
  <li><strong class="hl-green">描述真實的研究</strong>：記錄現象的真實狀態</li>
  <li><strong class="hl-purple">為執行實驗研究作準備</strong>：先了解現況，作為日後因果性研究的先驅</li>
</ul>

<div class="sh">第一大類：描述性研究設計（Descriptive Research Design）</div>
<div class="cp">使用在<strong>發展理論、確認目前實務遭遇的問題</strong>、形成假設或臨床決策等；一般不包括變項操縱。此類研究可獲取現象的事實，有助研擬策略解決問題，是因果性研究的前身。</div>

<div class="sh2">① 典型描述性研究設計（Typical Descriptive）</div>
<div class="cp">檢測<span class="hl-gold">單一樣本的某些特性</span>，探討一個或多個變項，直接進行各變項意義的解釋。</div>
<div class="ex-box"><div class="ex-tag">範例 7-1</div>
<strong>研究題目：</strong>失智症病人停止駕駛與其心理健康初探（劉淑慧等，2021）<br>
<strong>研究方法：</strong>問卷調查78位失智症病人的駕駛行為與心理健康<br>
<strong>研究結果：</strong>41％的失智症病人仍會騎車或開車；不再駕駛的主要原因為：年齡較大、無配偶、無社交活動、日常生活功能較差<br>
<strong>研究說明：</strong>此研究針對「停止駕駛」與「心理健康」兩變項分別進行解釋，<span class="hl-teal">屬典型描述性研究</span>，未操縱任何變項。</div>

<div class="sh2">② 比較描述性研究設計（Comparative Descriptive）</div>
<div class="cp">不涉及變項操作，研究者針對<span class="hl-gold">不同研究對象</span>進行資料變項的比較，或同一對象在<span class="hl-teal">不同時間點</span>的變化比較。</div>
<div class="ex-box"><div class="ex-tag">範例 7-3</div>
<strong>研究題目：</strong>成人加護病房病患家屬壓力感受與護理人員知覺之比較（林雅華等，2011）<br>
<strong>兩組比較：</strong>① 病患家屬的自覺壓力感受 vs ② 護理人員知覺病患家屬的壓力感受<br>
<strong>結果：</strong>兩者間無顯著相關<br>
<strong>說明：</strong>以「病患家屬」及「護理人員」兩群體進行同一壓力變項的比較，<span class="hl-teal">屬比較描述性研究設計</span>。</div>

<div class="sh">第二大類：相關性研究設計（Correlational Research Design）</div>
<div class="cp">研究者為了解哪些因素與事件或情況有關，探討<span class="hl-gold">研究變項間之相關</span>。採用此設計前需有基本文獻支持，並提出變項間關係的研究假設。<span class="hl-coral">無法總結因果關係</span>，因未對自變項進行控制。</div>

<div class="g3">
  <div class="c-card accent-gold"><div class="c-head">描述相關性研究</div>探討某情況下變項間<span class="hl-gold">存在的關係</span>；可確認短時間內變項間的交互關係，結果可發展未來研究假設。</div>
  <div class="c-card accent-teal"><div class="c-head">預測相關性研究</div>由已知變項<span class="hl-teal">預測依變項</span>的結果；如：由護理師的工作壓力預測其職業倦怠程度。</div>
  <div class="c-card accent-coral"><div class="c-head">模式測試相關性研究</div>測試理論模型中各變項間<span class="hl-coral">整體關係</span>是否成立；通常採用路徑分析或結構方程模式。</div>
</div>
<div class="ex-box"><div class="ex-tag">範例 7-13</div>
<strong>研究題目：</strong>加護病房護理人員生命態度與死亡因應自我效能之相關性探討（連如玉等，2020）<br>
<strong>研究對象：</strong>北部某醫學中心216位護理人員<br>
<strong>研究結果：</strong>生命態度量表中的「理想、生命自主、愛與關懷」與「死亡因應自我效能」達顯著正相關<br>
<strong>說明：</strong>探討兩個主要變項（生命態度、死亡因應自我效能）之間的關係，<span class="hl-teal">屬描述相關性研究設計</span>。</div>

<div class="sh">第三大類：時間層面研究設計（Time Dimensional）</div>

<div class="sh2">① 縱貫面研究設計（Longitudinal Research Design）</div>
<div class="cp">針對一群人進行<span class="hl-gold">長期追蹤</span>，掌握研究主題的變化，獲得較完整的資料。</div>
<div class="cp"><span class="hl-coral">缺點：</span>個案流失率較高；需重複測量，必須謹慎計畫。</div>

<div class="sh2">② 病例對照研究設計（Case-Control Research Design）</div>
<div class="cp">針對目前存在的現象連結到<span class="hl-coral">過去</span>所發生的現象——由「果」探討「因」的<span class="hl-gold">回溯性研究設計</span>。比較「有病（病例組）」和「無病（對照組）」兩群人的病史，分析危險因子。計算<span class="kp">勝算比（Odds Ratio）</span>估計危險因子的相關危險程度。</div>
<div class="imp-box">💡 <strong>比喻：</strong>你已經知道結果（肺癌），往回追問原因（曾經抽菸嗎？）——這就是病例對照研究的邏輯。與前瞻性研究相反，前瞻性是「先看原因，等結果」。對罕見疾病或需要數年才有結果的研究，病例對照研究更可行。</div>
<div class="ex-box"><div class="ex-tag">範例 7-7</div>
<strong>研究題目：</strong>放置水袋與壓瘡前期症狀關係之病例對照研究（戴瑞芬等，2009）<br>
<strong>病例組：</strong>出現壓瘡前期症狀（皮膚發紅）的個案<br>
<strong>對照組：</strong>無壓瘡前期症狀的個案<br>
<strong>回溯變項：</strong>是否曾放置水袋（過去的曝露因子）<br>
<strong>結果：</strong>無論是否在受壓部位放置水袋，都不會減輕壓瘡前期症狀</div>
<div class="ex-box"><div class="ex-tag">範例 7-8</div>
<strong>研究題目：</strong>牙周炎與COVID-19併發症的關係（Marouf et al., 2021）<br>
<strong>病例組：</strong>COVID-19有重大併發症（死亡/入住ICU/需呼吸器）<br>
<strong>對照組：</strong>COVID-19出院且無重大併發症<br>
<strong>結果：</strong>牙周炎與COVID-19重大併發症顯著相關，包括顯著增加死亡、入住ICU的風險</div>

<div class="sh2">③ 趨勢研究設計（Trend Research Design）</div>
<div class="cp">從<span class="hl-gold">同一母群體</span>中，於每一段時間選取樣本，收集相同變項資料，分析其<span class="hl-teal">變動方向</span>，由研究結果的趨勢預測未來趨勢。需特別重視取樣方法的代表性。</div>
<div class="ex-box"><div class="ex-tag">範例 7-9</div>
<strong>研究題目：</strong>臺灣地區民眾白內障門急診就診率之趨勢研究（陳思潔等，2022）<br>
<strong>方法：</strong>採用1998～2018年全民健保醫療統計資料分析（次級資料分析）<br>
<strong>結果：</strong>臺灣民眾的白內障門急診標準化就診率呈現<span class="hl-coral">上升趨勢</span></div>

<div class="sh2">④ 橫斷面研究設計（Cross-Sectional Research Design）</div>
<div class="cp">在<span class="hl-gold">某一特定時間</span>內收集一組或多組樣本的資料；可廣泛探討與比較，但<span class="hl-coral">僅能判斷兩者間的相關性，無法判斷因果方向</span>（何者為因、何者為果）。</div>
<div class="ex-box"><div class="ex-tag">範例 7-12</div>
<strong>研究題目：</strong>臨床護理人員受到職場暴力的危險因素和心理健康（Pai & Lee, 2011）<br>
<strong>方法：</strong>521位護理人員完成問卷，同一時間點調查<br>
<strong>結果：</strong>102位曾遭受肢體暴力（19.6%），268位曾遭受語言暴力（51.4%）<br>
<strong>說明：</strong>針對一個群組（護理人員）在特定時間點的職場暴力經歷，<span class="hl-teal">屬橫斷面研究設計</span>。</div>

<div class="sh">非傳統研究設計（用於實證實務 EBP）</div>
<div class="g2">
  <div class="c-card accent-teal"><div class="c-head">📊 次級資料分析（Secondary Data Analysis）</div>使用<span class="hl-teal">現成資料庫</span>（如健保資料庫、病歷資料）進行資料分析並提出發現；不需要新的資料收集。<br><strong>例：</strong>利用健保資料庫分析台灣20年燒燙傷就診趨勢。</div>
  <div class="c-card accent-gold"><div class="c-head">🔍 整合分析（Meta-analysis）</div>針對重要主題執行<span class="hl-gold">系統性文獻回顧</span>，有系統地評析與篩選高證據等級文獻，最後整合分析全部資料結果，是實證實務（EBP）中最高等級的研究設計之一。</div>
</div>

<div class="sh">全面比較表</div>
<table class="cmp-table">
<tr><th>設計類型</th><th>時間特性</th><th>因果推論</th><th>主要用途</th></tr>
<tr><td><span class="hl-gold">典型描述性</span></td><td>單一時間點</td><td class="bad">❌</td><td>描述現況，探索單一或多個變項的特性</td></tr>
<tr><td><span class="hl-teal">比較描述性</span></td><td>單一或多個</td><td class="bad">❌</td><td>比較不同群體或不同時間點的差異</td></tr>
<tr><td><span class="hl-coral">相關性</span></td><td>多半為單一</td><td class="bad">❌</td><td>探討變項間關係的方向、程度與強度</td></tr>
<tr><td><span class="hl-teal">縱貫面（前瞻性）</span></td><td>多個時間點追蹤</td><td>較弱</td><td>追蹤長期變化，比較有無危險因子的差異</td></tr>
<tr><td><span class="hl-coral">病例對照（回溯性）</span></td><td>由現在→追溯過去</td><td>較弱</td><td>探討罕見疾病的危險因子；由果追因</td></tr>
<tr><td><span class="hl-gold">趨勢研究</span></td><td>多個時間點</td><td class="bad">❌</td><td>分析趨勢，預測未來</td></tr>
<tr><td><span class="hl-green">橫斷面</span></td><td>單一時間點</td><td class="bad">❌</td><td>描述現況及變項間的相關性</td></tr>
</table>

quiz:[
{q:"「病例對照研究（Case-control Study）」探討因果關係的方向是？",opts:["由因探果（先看原因，再看結果）","由果探因（由現在的結果，追溯過去的原因）","同時測量原因和結果，無方向性","不探討因果關係，只描述現況"],ans:1,exp:"病例對照研究針對目前存在的現象（果/依變項），探討是否與過去發生的因素（因/自變項）有相關，方向是由「果」追問「因」，屬回溯性研究設計。"},
{q:"橫斷面研究設計最大的限制是？",opts:["無法進行統計分析","只能在同一時間點收集資料，無法判斷因果方向","樣本數必須非常大","只適用於護理教育研究"],ans:1,exp:"橫斷面研究設計雖然可以同時收集因與果的兩種資料，但僅能判斷兩者間的相關性為何，無法判斷何者為因、何者為果。"},
{q:"研究者想了解1998-2018年台灣民眾白內障就診率的變化，最適合採用哪種研究設計？",opts:["典型描述性研究設計","比較描述性研究設計","趨勢研究設計","病例對照研究設計"],ans:2,exp:"趨勢研究設計從同一母群體在不同時間點收集相同變項資料，分析其變動方向，由結果趨勢預測未來；追蹤多年就診率變化正是趨勢研究的典型應用。"},
{q:"「比較描述性研究設計」與「典型描述性研究設計」的最主要差異是？",opts:["前者有操縱變項","前者針對不同群體或不同時間點進行比較，後者只探討單一樣本的特性","前者是量性研究，後者是質性研究","兩者完全相同，只是名稱不同"],ans:1,exp:"比較描述性研究設計針對不同研究對象進行資料比較（如病患家屬 vs 護理人員的壓力感受），而典型描述性研究設計則只針對單一樣本的某些特性進行描述與解釋。"},

]},

{num:8,title:"實驗性研究設計",en:"Experimental Research Design",
content:`
<div class="def-box"><span class="def-term">實驗性研究設計</span><span class="def-en">提供<span class="hl-gold">處置、改變、治療、措施或介入</span>，目的在驗證<span class="hl-teal">自變項（IV）與依變項（DV）之間的因果關係</span>；研究結果可預測或解釋現象，或推翻、創新理論。研究者對研究現象通常是較為積極主動的觀察者。</span></div>

<div class="sh">真實驗性研究設計的三大要素</div>
<div class="g3">
  <div class="c-card accent-gold"><div class="c-head">🎲 隨機化（Randomization）</div>樣本被<span class="hl-gold">隨機分配</span>到不同的組別（實驗組、對照組），使兩組屬性盡量相同，達到<strong>同質性</strong>，避免因研究對象特質差異影響推論。隨機化是控制干擾變項的最佳方法。</div>
  <div class="c-card accent-teal"><div class="c-head">🔧 操控（Manipulation）</div>自變項由<span class="hl-teal">研究者主動操控</span>，如提供特定的護理介入措施、教育方案、藥物等。操控的自變項應盡量具體明確，讓實驗組及對照組所接受的處置明顯不同。</div>
  <div class="c-card accent-coral"><div class="c-head">🛡️ 控制（Control）</div>研究情境需受到某些程度的<span class="hl-coral">控制</span>，最少需有一個對照組作為比較基準；盡量使干擾變項保持不變，確認依變項改變來自自變項的操控。</div>
</div>
<div class="imp-box">真實驗性研究設計的三大要素：<span class="hl-gold">隨機化</span>、<span class="hl-teal">操控</span>、<span class="hl-coral">控制</span>——三者<strong>缺一不可</strong>。三要素缺一或缺二者，稱為「<span class="hl-coral">類實驗性研究設計（Quasi-experimental）</span>」，又稱準實驗性研究設計。</div>

<div class="sh">實驗性研究的四大變項</div>
<div class="g2">
  <div class="def-box" style="margin:0"><span class="def-term">自變項（Independent Variable, IV）</span><span class="def-en">研究過程中所提供的<span class="hl-gold">處置、改變、治療或措施</span>（研究者主動操控的變項）。<br>例如：術前衛教、穴位按摩介入、飲食衛教方案。</span></div>
  <div class="def-box" style="margin:0"><span class="def-term">依變項（Dependent Variable, DV）</span><span class="def-en">提供處置之後<span class="hl-teal">期望獲得改變的現象</span>（被測量的結果）。<br>例如：術前焦慮程度、睡眠品質、自我照顧效能。</span></div>
  <div class="def-box" style="margin:0"><span class="def-term">干擾變項（Extraneous Variable）</span><span class="def-en">具體顯著且<span class="hl-coral">可辨識</span>的外在因素，可能影響依變項的變化。需加以控制。<br>例如：受試者的年齡、慢性病史、用藥情況。</span></div>
  <div class="def-box" style="margin:0"><span class="def-term">中介變項（Intervening Variable）</span><span class="def-en">介於自變項與依變項之間，<span class="hl-purple">無法明顯辨識</span>的內在因素，僅能從外顯行為推測。<br>例如：受試者的動機、期望、信念等心理因素。</span></div>
</div>

<div class="sh">五種常見的實驗性研究設計類型</div>
<div class="imp-box">📝 <strong>設計圖符號說明：</strong><br>
R = 隨機分配（Random）　O1 = 前測　O2 = 後測　X = 實驗處置（自變項）　E = 實驗組　C = 對照/控制組</div>

<div class="sh2">① 單組後測設計（One-Group Post-test Only）</div>
<div class="cp">設計：<code style="background:var(--light);padding:2px 6px;border-radius:4px;">E: X → O2</code>（只有實驗組，無前測，只有後測）</div>
<div class="g2">
  <div class="c-card-g"><div class="c-head">✅ 優點</div>樣本數少；適用於個案數稀少的母群體（如骨髓移植者、愛滋病病人）；無前測效應干擾。</div>
  <div class="c-card-r"><div class="c-head">⚠️ 缺點</div>缺乏對照組；無法辨識結果是來自選擇效應或實驗處置介入；無法排除自然成熟的影響。</div>
</div>

<div class="sh2">② 單組前後測設計（One-Group Pre-test / Post-test）——前實驗設計</div>
<div class="cp">設計：<code style="background:var(--light);padding:2px 6px;border-radius:4px;">E: O1 → X → O2</code>（有前後測對比，但無對照組）</div>
<div class="g2">
  <div class="c-card-g"><div class="c-head">✅ 優點</div>提供前後測差異可印證研究對象接受實驗處置後之效果；樣本需求較少，增加可行性。</div>
  <div class="c-card-r"><div class="c-head">⚠️ 缺點</div>缺乏對照組；前測可能產生<span class="hl-coral">練習效應（testing effect）</span>；研究結果無法推論到未曾接受前測的樣本群。</div>
</div>
<div class="ex-box"><div class="ex-tag">範例 8-6</div>
<strong>研究題目：</strong>導入「3D列印恥骨上聯合膀胱造瘻模具」提升居家尿管留置異常評估與處置之成效（陳乃菁等，2020）<br>
<strong>設計：</strong>單組前後測類實驗設計，探討擬真情境教學在尿管錯置異常情境處置的知能、技能差異<br>
<strong>結果：</strong>此擬真情境教學可增加居家護理師對恥骨上尿管錯置異常事件評估的處置能力</div>

<div class="sh2">③ 不隨機分配之雙組前後測設計（Nonequivalent Control Group Design）</div>
<div class="cp">設計：<code style="background:var(--light);padding:2px 6px;border-radius:4px;">E: O1 → X → O2 / C: O1 → O2</code>（兩組皆有前後測，但非隨機分配）</div>
<div class="g2">
  <div class="c-card-g"><div class="c-head">✅ 優點</div>前後測差異可顯示實驗處置效果；前測可監測兩組依變項的同質性；前測效應同時影響兩組，可排除前測效應干擾。</div>
  <div class="c-card-r"><div class="c-head">⚠️ 缺點</div>未採隨機分配，無法完全控制干擾變項；研究結果難以推論到未接受前測的樣本群；所需樣本數較多。</div>
</div>
<div class="ex-box"><div class="ex-tag">範例 8-7</div>
<strong>研究題目：</strong>團體多媒體護理指導光碟對心導管檢查病人認知及焦慮成效（鍾凱吉等，2017）<br>
<strong>對照組：</strong>四份常規紙本護理指導單張 ／ <strong>實驗組：</strong>紙本＋多媒體心導管護理指導影片（團體衛教）<br>
<strong>結果：</strong>實驗組個案的認知成效更佳</div>

<div class="sh2">④ 隨機分配之雙組前後測設計（Randomized Pre-test / Post-test Control Group）</div>
<div class="cp">設計：<code style="background:var(--light);padding:2px 6px;border-radius:4px;">R: E: O1 → X → O2 / R: C: O1 → O2</code>（隨機分配＋前後測）——<span class="hl-gold">真實驗性研究設計</span></div>
<div class="ex-box"><div class="ex-tag">範例 8-10</div>
<strong>研究題目：</strong>探討團隊導向學習策略（TBL）於護理人員在職教育之學習成效（游錦淑等，2019）<br>
<strong>對照組：</strong>課室教學 ／ <strong>實驗組：</strong>採TBL策略（隨機分派）<br>
<strong>測量時間點：</strong>課前知識測驗 + 課後立即測驗 + 授課後1個月後測</div>

<div class="sh2">⑤ 多組後測設計（Multiple Group Post-test）</div>
<div class="ex-box"><div class="ex-tag">範例 8-8</div>
<strong>研究題目：</strong>腹部手術病人使用保暖設備改善術中低體溫（黃欣誼等，2018）<br>
<strong>對照組：</strong>未使用保暖設備 ／ <strong>實驗組一：</strong>強制空氣加溫毯 ／ <strong>實驗組二：</strong>熱風滲透手術袍（共三組）<br>
<strong>結果：</strong>兩種保暖設備均優於對照組；實驗組二在2.5小時後效果最佳</div>

<div class="sh">影響內在效度的六大干擾因素</div>
<div class="imp-box">💡 <strong>內在效度（Internal Validity）</strong>：研究結果是否真正反應實驗本身發生的事項（即依變項的改變，確實是自變項造成的）。內在無效度指研究結果受到非自變項的因素影響。</div>
<div class="g2">
  <div class="c-card accent-coral"><div class="c-head">① 時間演進的因素</div>
    <ul class="b-list">
      <li><span class="hl-coral">成熟化（Maturation）</span>：受試者隨時間自然成長或身心改變，影響研究結果</li>
      <li><span class="hl-gold">歷史事件（History）</span>：研究期間發生不可預期事件（如：地震、COVID-19疫情），影響受試者填答</li>
      <li><span class="hl-teal">變項對時間過度敏感</span>：如大面積燒傷病人在研究期間的自然康復或死亡</li>
    </ul>
  </div>
  <div class="c-card accent-gold"><div class="c-head">② 研究工具的信效度因素</div>測量儀器需定期保養校正；量表問卷需測試信效度；以確保測量結果的精確性。<br><em>例：陳虹如等研究每年維修校正生理監測儀器，並在收案前再次校正。</em></div>
  <div class="c-card accent-teal"><div class="c-head">③ 選擇樣本的因素</div><span class="hl-teal">選擇偏差（Selection Bias）</span>：未隨機分配導致實驗組與對照組不同質，在實驗處置介入前兩組已出現偏差。</div>
  <div class="c-card accent-purple"><div class="c-head">④ 測試的因素</div>
    <ul class="b-list">
      <li><span class="hl-purple">前測效應（Testing Effect）</span>：研究對象因前測的暗示或提醒，刻意注意研究相關內容</li>
      <li><span class="hl-coral">練習效應</span>：多次測試導致熟悉測試內容；測量間隔越短越明顯</li>
    </ul>
  </div>
  <div class="c-card accent-gold"><div class="c-head">⑤ 參與研究者之個人因素</div>
    <ul class="b-list">
      <li><span class="hl-gold">霍商效應（Hawthorne Effect）</span>：參與研究的人員因被觀察而刻意改變行為</li>
      <li><span class="hl-teal">新奇效應（Novelty Effect）</span>：初次參與或好奇而改變原本行為反應</li>
      <li><span class="hl-coral">寬慰效應（Placebo Effect）</span>：實驗組個案因信賴實驗處置，產生預期性效果</li>
    </ul>
  </div>
  <div class="c-card accent-coral"><div class="c-head">⑥ 其他影響因素</div>
    <ul class="b-list">
      <li><span class="hl-coral">統計迴歸（Regression to Mean）</span>：極佳者及極差者的得分，過一段時間後趨近於平均數</li>
      <li><span class="hl-gold">實驗處置的傳布</span>：實驗組樣本將處置內容告知對照組，導致「汙染」</li>
      <li><span class="hl-teal">補償（Compensation）</span>：研究者對控制組備感愧疚而給予額外補償</li>
    </ul>
  </div>
</div>

<div class="sh">影響外在效度的因素</div>
<div class="def-box"><span class="def-term">外在效度（External Validity）</span><span class="def-en">研究結果的<span class="hl-gold">普遍性及推論性</span>——研究結果能否推論到其他情境或樣本。外在無效度是指研究結果無法概化到真實世界。</span></div>
<ul class="b-list">
  <li>研究對象的<strong>個人基本屬性限制越多</strong>（年齡、性別、地區），研究結果越難普遍推論</li>
  <li>實驗室情境控制<strong>過於完善</strong>，結果無法推論到自然情境</li>
  <li>樣本來源<strong>過於特定</strong>（志願者、特定醫院），代表性不足</li>
  <li>設計前後測的研究，結果難以推論到<strong>未曾接受前測</strong>的真實情境</li>
</ul>
<div class="imp-box">避免內在效度威脅的重要策略：採用<span class="hl-gold">雙盲（Double Blind）設計</span>——不告知相關人員（含工作人員及受試者）被分到哪一組，由第三方保管相關資料，可避免因了解研究而引發行為改變效應。</div>
`,
quiz:[
{q:"真實驗性研究設計的三大要素是？",opts:["觀察、分析、推論","隨機化、操控、控制","描述、相關、因果","樣本、工具、統計"],ans:1,exp:"真實驗性研究設計的三大要素為：①樣本被「隨機」分配到不同的組別；②自變項由研究者「操控」；③研究情境需受到某些程度的「控制」，三者缺一不可。"},
{q:"「霍商效應（Hawthorne Effect）」是指？",opts:["研究對象因信賴實驗處置而產生預期效果","參與研究的人員因被觀察而刻意關注情境，改變自身行為","研究者因愧疚而給予控制組額外補償","研究對象的得分趨近於平均數的現象"],ans:1,exp:"霍商效應是指參與研究的人員，為了因應研究目的而刻意關注研究情境，並改變自身的行為或態度，影響研究結果的真實性。"},
{q:"「不隨機分配取樣之雙組前後測設計（Nonequivalent Control Group Design）」相較於單組前後測設計的優點是？",opts:["不需要隨機分配即可建立因果關係","前測可監測兩組的同質性，且前測效應同時影響兩組，可排除前測效應干擾","樣本數更少，更節省資源","完全不受選擇偏差影響"],ans:1,exp:"不隨機分配雙組前後測設計的優點：前測資料可監測兩組同質性；且前測效應同時影響兩組，可排除前測效應干擾；比單組設計多一個對照組的比較。"},
{q:"「統計迴歸現象（Regression to the Mean）」的意義是？",opts:["統計結果必須達顯著水準","縱使沒有實驗處置，極佳者及極差者的得分也會逐漸趨向平均數","研究對象的資料必須進行迴歸分析","統計誤差越來越小的過程"],ans:1,exp:"統計迴歸現象（Regression to the Mean）：樣本之得分概況可能在過了一段時間後趨近於「團體平均數」，縱使沒有實驗處置，極佳者及極差者也會逐漸地趨向平均數。"},
{q:"「雙盲（Double Blind）設計」的目的是？",opts:["讓所有參與者都了解研究目的","不告知相關人員被分到哪一組，避免因了解研究而引發行為改變效應","讓兩組都接受相同的介入措施","確保樣本數足夠代表母群體"],ans:1,exp:"雙盲設計不告知參與研究的相關人員（含工作人員及受試者）被分到哪一組，由第三方保管相關資料，可避免因對研究的了解而引發興趣或好奇心，導致行為改變而影響研究結果的內在效度。"}
]},

{num:9,title:"質性研究",en:"Qualitative Research",
content:`
<div class="sh">為什麼需要質性研究？</div>
<div class="cp">護理是一門有關<strong>人類經驗、健康和疾病</strong>的專業，而人的經驗受到歷史、重要他人、社會結構、性別或文化等因素影響，產生非常多元的面貌。許多護理知識（倫理性、個別性、美學性知識）比較抽象，<span class="hl-gold">量性研究的問卷或數字無法完全捕捉</span>這些豐富的人類經驗，因此需要質性研究。</div>
<div class="imp-box">💡 <strong>簡單比喻：</strong>量性研究像拍一張病人疼痛程度的「數字快照」（VAS 7分）；質性研究像是坐下來聽病人<span class="hl-teal">說出疼痛如何改變他的生活、他的恐懼、他的家庭關係</span>——兩者缺一不可。</div>

<div class="sh">兩大研究典範的比較</div>
<table class="cmp-table">
<tr><th>面向</th><th>實證主義（量性研究）</th><th>自然主義（質性研究）</th></tr>
<tr><td>對真理的看法</td><td>世上原就有<span class="hl-gold">客觀真理</span>，可被測量驗證</td><td>真理透過<span class="hl-teal">感官知覺與主觀經驗</span>才存在</td></tr>
<tr><td>思考模式</td><td>假設事實存在→設計方法測量→推論</td><td>深入情境→收集經驗→歸納意義</td></tr>
<tr><td>研究目的</td><td>測量、驗證、<span class="hl-coral">推論通則</span></td><td>理解、詮釋、<span class="hl-teal">描述現象意義</span></td></tr>
<tr><td>樣本數</td><td>較多（統計代表性）</td><td>較少（<span class="hl-gold">資料飽和</span>為停止依據）</td></tr>
<tr><td>資料性質</td><td>數字、統計</td><td>文字、語言、觀察記錄</td></tr>
<tr><td>研究者角色</td><td>客觀局外者</td><td><span class="hl-teal">研究工具本身</span>，主動參與</td></tr>
<tr><td>資料分析時機</td><td>資料收集完整後統一分析</td><td><span class="hl-gold">資料收集同時進行分析</span>，直到飽和</td></tr>
</table>

<div class="sh">質性研究的哲學根源</div>
<div class="g2">
  <div class="c-card accent-gold"><div class="c-head">🏛️ 胡塞爾的「超驗現象學」</div>
    核心主張：<span class="hl-gold">「回到事物本身」</span><br>
    意思：把所有先入為主的成見「括弧起來」（存而不論），讓事物的真實樣貌自然呈現。<br><br>
    <strong>護理舉例：</strong>研究「臨終病人的靈性需求」時，不預設「靈性就是宗教信仰」，而是完全開放地聆聽病人描述什麼對他有意義。
  </div>
  <div class="c-card accent-teal"><div class="c-head">🌀 海德格的「基礎存在學」</div>
    核心主張：<span class="hl-teal">「存有」（Being）</span>，人的存在是時間性的<br>
    意思：事物的意義不是獨立存在的，而是存在於「人與世界的關係」之中。對死亡的恐懼、對家人的愛——這些才是真實。<br><br>
    <strong>護理舉例：</strong>探討「中風病人的適應經驗」，重視病人在「發病前的我→發病→現在的我」這個時間脈絡中的意義轉變。
  </div>
</div>

<div class="sh">資料飽和（Data Saturation）——質性研究停止收案的依據</div>
<div class="def-box"><span class="def-term">資料飽和</span><span class="def-en">指資料以歸納的方式進行分析，已達穩定而<span class="hl-gold">不會歸納出新的類別</span>時，表示資料量已足夠。質性研究的個案數目不是判斷樣本數是否足夠的標準，<span class="hl-teal">資料多寡才是決定的關鍵</span>。<br><br><strong>比喻：</strong>就像倒不同顏色的彩色筆：前幾支會出現新顏色，但當你繼續倒，發現都是重複的顏色了，那就是「飽和」了。</span></div>

<div class="sh">質性研究資料分析的步驟</div>
<div class="flow">
  <div class="flow-step"><div class="fs-num">1</div><div class="fs-txt">逐字聽寫</div>訪談錄音→文字稿</div>
  <div class="flow-step"><div class="fs-num">2</div><div class="fs-txt">重要陳述</div>找出有意義的片段</div>
  <div class="flow-step"><div class="fs-num">3</div><div class="fs-txt">開放譯碼</div>確認訊息單元並編碼</div>
  <div class="flow-step"><div class="fs-num">4</div><div class="fs-txt">類別形成</div>依特質歸納不同類別</div>
  <div class="flow-step"><div class="fs-num">5</div><div class="fs-txt">主題形成</div>類別→主題</div>
  <div class="flow-step"><div class="fs-num">6</div><div class="fs-txt">成員確認</div>交回受訪者確認是否符合其經驗</div>
</div>

<div class="sh" style="margin-top:24px">🔬 六大質性研究類型詳解</div>
<div class="imp-box">以下六種類型各有不同的哲學背景、研究目的與分析方法，選擇時需依<span class="hl-gold">研究目的</span>來決定——不是隨意選擇！</div>

<div class="sh2" style="margin-top:16px">① 現象學研究（Phenomenological Research）</div>
<div class="c-card accent-gold" style="margin-bottom:14px">
  <div class="c-head">🎯 核心目的</div>
  <div class="cp">了解<span class="hl-gold">人類生活經驗的主觀意義與本質</span>——「這個現象對當事人來說，到底是什麼感受？」不切割地描述整個經驗的完整結構。</div>
  <div class="c-head" style="margin-top:10px">🔍 適合問題類型</div>
  <div class="cp">「<em>接受化療的乳癌病人，其疾病適應的經驗是什麼？</em>」「<em>初為人母的護理師，其工作與家庭平衡的主觀感受？</em>」</div>
  <div class="c-head" style="margin-top:10px">📋 資料收集</div>
  <div class="cp">深度訪談為主，請受訪者<strong>述說生活經驗</strong>；研究者以直觀方式閱讀資料，尋找隱藏在敘述中的意義（連結「背景脈絡」與「可被看到的對象」）。</div>
  <div class="c-head" style="margin-top:10px">🧪 分析方法</div>
  <div class="cp"><span class="kp">沉浸／結晶分析型</span>：研究者不斷深入閱讀原始資料，將體會「結晶化」成研究結論。</div>
</div>
<div class="ex-box"><div class="ex-tag">📌 臨床研究範例——現象學</div>
<strong>研究題目：</strong>工作與生命意義的實踐：急重症護理師的疫起挑戰（李美秀、許欽津，2022）<br>
<strong>研究對象：</strong>15位急重症護理師進行深度訪談<br>
<strong>研究發現：</strong><br>
▸ <span class="hl-gold">工作意義</span>：讓生活安定、因使命固守崗位、看見自己的價值<br>
▸ <span class="hl-teal">生命意義</span>：照顧家人、生死無常、行善、把握當下<br>
<strong>研究結論：</strong>急重症護理師能以正面態度面對疫情挑戰，體現自我的生命意義。</div>

<div class="sh2" style="margin-top:20px">② 詮釋學研究（Hermeneutics Research）</div>
<div class="c-card accent-teal" style="margin-bottom:14px">
  <div class="c-head">🎯 核心目的</div>
  <div class="cp">透過「<span class="hl-teal">自我述說</span>」探究人的屬己歷程——受訪者回顧過去生活經驗脈絡中的印象，形成自然的故事（通常是回憶重整）。</div>
  <div class="c-head" style="margin-top:10px">🔑 兩項重要原則</div>
  <div class="g2" style="margin:6px 0">
    <div class="c-card-t"><div class="c-head">前了解（Pre-understanding）</div>研究者在進入研究前，已有某些先存的理解與假設；這些前了解既可能幫助理解，也可能形成偏見，需要持續反思。</div>
    <div class="c-card-t"><div class="c-head">詮釋循環（Hermeneutic Circle）</div>理解是一個循環過程：從整體→部分→整體，不斷來回。就像理解一本書需要先讀一章，再回頭看全書意義，再深入章節……</div>
  </div>
  <div class="c-head" style="margin-top:10px">📋 資料收集</div>
  <div class="cp">受訪者向研究者進行「自我述說」；以<span class="kp-t">主題分析</span>為主要分析方式。</div>
</div>
<div class="ex-box"><div class="ex-tag">📌 臨床研究範例——詮釋學</div>
<strong>研究題目：</strong>The essence of spirituality of terminally ill patients（Chao et al., 2002）<br>
<strong>研究方法：</strong>詮釋學方法探討末期病人的靈性本質<br>
<strong>研究發現（四大類別模型、10個主題）：</strong><br>
▸ <span class="hl-gold">與自己共融</span>：自我認同、完整的自我、內在平安<br>
▸ <span class="hl-teal">與他人共融</span>：愛（與他人的關懷關係）、和解（寬恕與被寬恕）<br>
▸ <span class="hl-coral">與大自然共融</span>：從大自然而來的靈感、創造力<br>
▸ <span class="hl-green">與至高者共融</span>：信仰、希望、感恩</div>

<div class="sh2" style="margin-top:20px">③ 紮根理論研究（Grounded Theory Research）</div>
<div class="c-card accent-coral" style="margin-bottom:14px">
  <div class="c-head">🎯 核心目的</div>
  <div class="cp">利用<span class="hl-coral">歸納方式</span>，由所收集的資料中<span class="hl-gold">孕育出理論</span>（而非驗證既有理論）；修改理論模式或建立新的理論模式。強調社會學，注重人們對社會生活所賦予的意義。</div>
  <div class="c-head" style="margin-top:10px">💡 「紮根」的意思</div>
  <div class="cp">理論是從資料中「長出來的」，就像植物從土地中生長——必須<span class="hl-teal">紮根於真實資料</span>，而不是先有理論再找資料驗證。</div>
  <div class="c-head" style="margin-top:10px">📋 資料收集與分析</div>
  <div class="cp">深度訪談 + 觀察 + 參與性觀察；將個案資料進行<strong>沉澱→觀察→歸納→比較→概念化→具體化</strong>，最終形成理論。在國內護理研究中相當多。</div>
  <div class="c-head" style="margin-top:10px">特色取樣方式</div>
  <div class="cp"><span class="kp-r">理論性取樣（Theoretical Sampling）</span>：隨著分析進行，選擇能補充或驗證正在發展理論的新個案。</div>
</div>
<div class="ex-box"><div class="ex-tag">📌 臨床研究範例——紮根理論</div>
<strong>研究題目：</strong>探討首次腦中風病患初期之調適過程（蔡惠如等，2016）<br>
<strong>取樣：</strong>12位初次腦中風病患（先立意取樣，後採理論性取樣）<br>
<strong>研究發現（2個範疇、6個次範疇）：</strong><br>
▸ <span class="hl-coral">中風的衝擊</span>：①失去身體自主權 ②喪失自我價值 ③難以承受，產生社交隔離<br>
▸ <span class="hl-green">中風後的因應</span>：④積極復健，重獲自主權 ⑤家人支持，努力不成為負擔 ⑥由苦難中昇華，轉趨正向<br>
<strong>核心範疇：</strong>「面對中風，懷抱希望，人生就此改變」</div>

<div class="sh2" style="margin-top:20px">④ 民族誌研究（Ethnographic Research）</div>
<div class="c-card accent-green" style="margin-bottom:14px">
  <div class="c-head">🎯 核心目的</div>
  <div class="cp">了解<span class="hl-green">不同人群的文化</span>，在個案熟悉的環境下，進行系統化觀察與研究——「這群人共享的文化意義是什麼？」</div>
  <div class="c-head" style="margin-top:10px">💡 「民族誌」的意思</div>
  <div class="cp">原本用於研究原住民部落文化，現擴展至任何「文化群體」。例如：加護病房的護理文化、癌症病房的病童世界、糖尿病患者的飲食文化。研究者需要長時間<span class="hl-teal">進入其中</span>，真正了解這個群體「從裡面看出去」是什麼樣子。</div>
  <div class="c-head" style="margin-top:10px">📋 資料收集</div>
  <div class="cp"><span class="kp-g">田野研究（Field Research）</span>為主：訪談、文獻收集、<span class="hl-teal">參與性觀察</span>。結果可以文化報告或個案報告方式呈現。</div>
</div>
<div class="ex-box"><div class="ex-tag">📌 臨床研究範例——民族誌</div>
<strong>研究題目：</strong>生活世界的失序：臺灣糖尿病婦女疾病經驗之探討（許敏桃等，2015）<br>
<strong>方法：</strong>民族誌、深度訪談 + 田野觀察，18位糖尿病婦女（病史至少1年），詮釋循環分析<br>
<strong>研究主軸：</strong>「生活世界失序」四個主題：<br>
▸ <span class="hl-coral">身體失序</span>：仰賴醫療者（他人）來理解自己身體<br>
▸ <span class="hl-gold">生活失序</span>：從控制食物到反過來被食物控制<br>
▸ <span class="hl-teal">家庭失序</span>：生病的人就是無能的人<br>
▸ <span class="hl-purple">自我失序</span>：必須為家人（他人）控制身體<br>
<strong>建議：</strong>應將性別文化角色納入糖尿病自我管理的動力，並納入家庭整體照護角度。</div>

<div class="sh2" style="margin-top:20px">⑤ 歷史性研究（Historical Research）</div>
<div class="c-card accent-purple" style="margin-bottom:14px">
  <div class="c-head">🎯 核心目的</div>
  <div class="cp">對<span class="hl-purple">過去事件進行有系統的資料收集和評估</span>，藉以發現事件發生的因果關係、發展規律並加以解釋，以作為<span class="hl-gold">了解現在及預測未來</span>的基礎。</div>
  <div class="c-head" style="margin-top:10px">💡 「歷史研究」不只是查資料！</div>
  <div class="cp">需要對過去的護理發展、政策演變、特定事件進行<strong>批判性分析</strong>，找出其中的規律與意義。</div>
  <div class="g2" style="margin-top:8px">
    <div class="c-card-g"><div class="c-head">✅ 優點</div>資料現成，不需求取研究對象合作；可了解長期歷史發展脈絡。</div>
    <div class="c-card-r"><div class="c-head">⚠️ 缺點</div>若資料來源為多年前，將無法追查記錄的正確性；可能存在史料偏頗。</div>
  </div>
  <div class="c-head" style="margin-top:10px">📋 資料收集</div>
  <div class="cp">訪談曾經歷該歷史事件而目前仍存活的人（<span class="kp-g">口述歷史</span>），或直接收集文獻、照片、相關檔案資料加以分析判讀。</div>
</div>
<div class="ex-box"><div class="ex-tag">📌 臨床研究範例——歷史性研究</div>
<strong>研究題目：</strong>An oral historical study of the development of the discipline of military nursing in Taiwan from 1948 to 1970（Mu & Lin, 2007）<br>
<strong>方法：</strong>與趙鳳宜女士進行四次深度訪談（口述歷史），並納入文獻、照片、相關檔案資料查考<br>
<strong>研究發現（四項主題）：</strong>個人經驗及成長、護理奠基期、護理專業的發展及傳統、發展與趨勢<br>
<strong>貢獻：</strong>不僅記錄了軍護的專業發展，更展現其價值意義。</div>

<div class="sh2" style="margin-top:20px">⑥ 批判理論研究（Critical Theory Research）</div>
<div class="c-card" style="border-top:3px solid #7b5ccc;margin-bottom:14px">
  <div class="c-head" style="color:#c4b0f5">🎯 核心目的</div>
  <div class="cp">透過<span class="hl-purple">批判及解放性知識的反思</span>，讓人類從錯誤意識中解放——保護人類免於被錯誤意識矇蔽對真理的認識。應用於健康研究，可使個人<span class="hl-gold">培力與覺醒</span>，弱勢者重獲控制權。</div>
  <div class="c-head" style="margin-top:10px;color:#c4b0f5">💡 「批判」的意思</div>
  <div class="cp">不是單純的「批評」，而是<strong>反思社會結構、權力關係、意識形態</strong>如何影響人們的健康與生活。例如：貧窮為什麼導致健康不平等？醫療體制如何壓制病人的自主性？</div>
  <div class="c-head" style="margin-top:10px;color:#c4b0f5">🔁 行動研究歷程（衍生方法）</div>
  <div class="flow" style="margin-top:6px">
    <div class="flow-step"><div class="fs-num">1</div><div class="fs-txt">找出起始點</div>發現不平等</div>
    <div class="flow-step"><div class="fs-num">2</div><div class="fs-txt">情境釐清</div>分析問題結構</div>
    <div class="flow-step"><div class="fs-num">3</div><div class="fs-txt">行動策略</div>制定改變方案</div>
    <div class="flow-step"><div class="fs-num">4</div><div class="fs-txt">轉入實踐</div>執行並反思</div>
  </div>
  <div class="cp" style="margin-top:8px">研究者需從經驗中學習，不斷擬定新策略，直到發展適當策略而達到預定結果。哲學家：<span class="hl-purple">哈伯瑪斯（Habermas）</span>。</div>
</div>
<div class="ex-box"><div class="ex-tag">📌 臨床研究範例——批判理論</div>
<strong>研究題目：</strong>哈伯瑪斯的批判理論對高齡教育教師專業之啟示（徐敏容，2016）<br>
<strong>核心主張：</strong>樂齡教育應與傳統以知識傳遞為主的教育不同，需重視師生互動與學生主體性<br>
<strong>三項啟示：</strong><br>
▸ <span class="hl-teal">師生關係</span>：加強師生互動，建立良好關係並營造合宜學習氛圍<br>
▸ <span class="hl-gold">教學內容</span>：以學生為主體，融合多元性教學方式並適時調整<br>
▸ <span class="hl-coral">教師素養</span>：持續學習（示範者）並進行反思實踐</div>

<div class="sh">六大類型一覽比較</div>
<table class="cmp-table">
<tr><th>類型</th><th>哲學背景</th><th>研究目的</th><th>分析方式</th><th>適合問題</th></tr>
<tr><td><span class="hl-gold">現象學</span></td><td>胡塞爾、海德格的現象學</td><td>了解生活經驗的主觀意義與本質</td><td>沉浸/結晶分析、主題分析</td><td>「某經驗對當事人是什麼感受？」</td></tr>
<tr><td><span class="hl-teal">詮釋學</span></td><td>海德格、高達美的詮釋學</td><td>透過自我述說探究屬己歷程</td><td>主題分析、詮釋循環</td><td>「某生命歷程的個人意義？」</td></tr>
<tr><td><span class="hl-coral">紮根理論</span></td><td>符號互動論、社會學</td><td>由資料歸納建構理論</td><td>比較分析、編輯分析型</td><td>「某現象如何發展？能建立什麼理論？」</td></tr>
<tr><td><span class="hl-green">民族誌</span></td><td>社會科學、人種學</td><td>了解特定文化群體的共享意義</td><td>田野研究、詮釋循環</td><td>「這個群體的文化是什麼？」</td></tr>
<tr><td><span class="hl-purple">歷史性</span></td><td>社會科學、歷史學</td><td>了解過去事件以預測未來</td><td>歷史文獻分析、口述歷史</td><td>「歷史如何發展？有何規律？」</td></tr>
<tr><td><span style="color:#c4b0f5;font-weight:700">批判理論</span></td><td>哈伯瑪斯、批判學派</td><td>解放不必要的宰制，促進培力</td><td>反思、行動研究螺旋</td><td>「誰被壓迫？如何改變不平等？」</td></tr>
</table>

<div class="sh">質性研究的資料收集方法</div>
<div class="g2">
  <div class="c-card accent-gold"><div class="c-head">深度訪談（In-depth Interview）</div>
    <ul class="b-list">
      <li><span class="hl-gold">半結構式訪談</span>：先設計訪談指引作為引導，但依受訪者回應彈性調整。<em>例：「此次住院的感受及經歷為何？」</em></li>
      <li><span class="hl-teal">非結構式訪談</span>：只有方向，無固定問題。<em>例：「請您談談您對希望的想法。」</em></li>
      <li><span class="hl-coral">圖畫投射法</span>：對兒童使用圖表作為投射工具，如請氣喘兒童描述打針的感受。</li>
    </ul>
  </div>
  <div class="c-card accent-teal"><div class="c-head">田野研究（Field Research）</div>在自然環境中，對某現象的本質加以探索。研究者可扮演四種角色：<span class="kp-t">完全參與</span>、<span class="kp-t">觀察的參與</span>、<span class="kp-t">參與的觀察</span>、<span class="kp-t">完全觀察</span>。</div>
  <div class="c-card accent-coral"><div class="c-head">焦點團體訪談（Focus Group Interview）</div>針對某議題，對「特定團體」進行「焦點訪談」，允許團體成員彼此交談討論，研究者引導訪談並從中收集資料。</div>
  <div class="c-card accent-green"><div class="c-head">三角交叉法（Triangulation）</div>在同一研究中，合併<span class="hl-green">兩種或兩種以上</span>的理論、資料來源、研究法或研究對象，以確保研究結果的正確性；可增加質性研究的可信度。</div>
</div>

<div class="sh">質性研究的可信度（Trustworthiness）</div>
<table class="cmp-table">
<tr><th>量性研究</th><th>對應</th><th>質性研究</th><th>達成方式</th></tr>
<tr><td>內在效度</td><td>→</td><td><span class="hl-gold">確實性（Credibility）真實性</span></td><td>成員確認、長期觀察、三角交叉法</td></tr>
<tr><td>外在效度</td><td>→</td><td><span class="hl-teal">推廣性（Transferability）運用性</span></td><td>豐富、詳細的描述</td></tr>
<tr><td>信度</td><td>→</td><td><span class="hl-coral">信賴性（Dependability）一致性</span></td><td>詳細記錄研究過程、同儕檢視</td></tr>
<tr><td>客觀性</td><td>→</td><td><span class="hl-green">確認性（Confirmability）中立性</span></td><td>研究者反思、存而不論（Bracketing）</td></tr>
</table>
`,
quiz:[
{q:"質性研究「資料飽和（Data Saturation）」的意義是？",opts:["收集到30人樣本","資料分析達統計顯著水準（p<0.05）","資料以歸納方式分析已達穩定，不會歸納出新的類別","研究者主觀認為已收集足夠資料"],ans:2,exp:"資料飽和指資料以歸納的方式進行分析達穩定而不會歸納出新的類別，表示資料量已足夠；個案數目不是判斷樣本數是否足夠的標準，資料多寡才是決定的關鍵。"},
{q:"「紮根理論研究（Grounded Theory Research）」的核心特色是？",opts:["驗證既有理論是否成立","由所收集的資料中歸納孕育出新理論","描述人類生活經驗的主觀意義與本質","了解特定文化群體的共享文化意義"],ans:1,exp:"紮根理論的核心是利用歸納方式，將所收集的資料發展為理論的研究過程——理論是從資料中「長出來的」，而不是先有理論再找資料驗證。"},
{q:"護理師想研究「糖尿病婦女在台灣文化中的疾病經驗與生活型態」，最適合採用哪種質性研究類型？",opts:["現象學研究","紮根理論研究","民族誌研究","歷史性研究"],ans:2,exp:"民族誌研究的目的是了解不同人群的文化，研究者在個案熟悉的環境下進行系統化觀察，了解人們共享的文化意義；研究糖尿病婦女在台灣文化脈絡中的疾病經驗，正是民族誌的核心目的。"},
{q:"下列哪種質性研究類型最適合探討「1950-1970年台灣護理專業的發展脈絡與演變」？",opts:["現象學研究","批判理論研究","紮根理論研究","歷史性研究"],ans:3,exp:"歷史性研究對過去事件進行有系統的資料收集和評估，藉以發現事件發生的因果關係與發展規律，以作為了解現在及預測未來的基礎；探討護理專業歷史發展正是歷史性研究的典型應用。"},
{q:"質性研究可信度中，對應量性研究「外在效度」的指標是？",opts:["確實性（Credibility）——真實性","推廣性（Transferability）——運用性","信賴性（Dependability）——一致性","確認性（Confirmability）——中立性"],ans:1,exp:"推廣性（Transferability）對應量性研究的外在效度，指研究結果是否可適用於其他情境；達成方式是提供豐富、詳細的描述，讓讀者判斷是否可遷移至其他情境。"}
]},

{num:10,title:"個案報告與個案研究",en:"Case Report and Case Study",
content:`
<div class="sh">定義與區別</div>
<div class="g2">
<div class="def-box" style="margin:0"><span class="def-term">個案報告（Case Report）</span><span class="def-en">將對個案有效的<span class="hl-gold">護理處置過程</span>與分析個案問題的護理過程呈現；記錄各護理人員以個案為中心之整體護理，建立護理經驗資料，豐富教學題材，促進護理專業化。<br><br><strong>重點：</strong>以護理過程（評估→診斷→計畫→執行→評值）為框架，呈現一位個案的完整照護故事。</span></div>
<div class="def-box" style="margin:0"><span class="def-term">個案研究（Case Study）</span><span class="def-en">通過一種或多種方法，進行人、事件、決策及機構或其他系統的<span class="hl-teal">整體探討過程</span>；是有意義的小規模研究，目的在深入描述經驗，也是一種研究策略。<br><br><strong>重點：</strong>以研究形式深入探討特殊問題，允許研究者從研討過程及結果中學習對特殊問題的了解。</span></div>
</div>

<div class="sh">個案報告的四大目的（含臨床範例）</div>
<div class="c-card accent-gold" style="margin-bottom:10px">
  <div class="c-head">① 增進護理新知</div>
  <div class="cp">記錄有效的護理處置，分享臨床創新智慧。</div>
  <div class="ex-box" style="margin:6px 0 0"><div class="ex-tag">範例：脊髓腫瘤居家護理（陳淑玲等，2015）</div>
  62歲婦人，脊髓腫瘤壓迫導致下肢麻痺，尾骨三級壓力性損傷<strong>長達一年未癒</strong>。<br>
  <span class="hl-teal">創新做法：</span>居家護理師以智慧型手機上傳傷口照片至資訊雲端，讓家屬及醫師共同討論，便於協調就診與跨專業醫療團隊介入。<br>
  <span class="hl-green">結果：</span>傷口在一個月內癒合。</div>
</div>
<div class="c-card accent-teal" style="margin-bottom:10px">
  <div class="c-head">② 提供大型研究計畫參考（前驅研究）</div>
  <div class="cp">個案報告常是<span class="kp-t">前驅研究（Pilot Research）</span>，所獲知識提供後續大型研究之參考。</div>
  <div class="ex-box" style="margin:6px 0 0"><div class="ex-tag">範例：失智失能居家護理（蕭瑋鈴等，2020）</div>
  84歲輕度失智失能個案，資料收集：居家訪視、電話訪談、觀察。<br>
  護理問題與介入：<br>
  ▸ <span class="hl-coral">潛在危險性跌倒</span> → 影片指導簡易健康操<br>
  ▸ <span class="hl-gold">自我照顧能力缺失</span> → 中醫穴位圖卡、鼓勵參與沐浴如廁<br>
  ▸ <span class="hl-teal">吞嚥障礙</span> → 衛教正確食物攝取、進食技巧、健口操<br>
  目標：增進生活品質，延緩病程，作為照護類似個案參考。</div>
</div>
<div class="c-card accent-coral" style="margin-bottom:10px">
  <div class="c-head">③ 驗證發展中的護理概念或理論架構</div>
  <div class="cp">提供較單純卻更容易實際驗證的空間。</div>
  <div class="ex-box" style="margin:6px 0 0"><div class="ex-tag">範例：乳癌復發照護（陳思穎、潘雪幸，2021）</div>
  44歲乳癌復發多處轉移合併肋膜積液個案。以「<span class="hl-gold">Swanson關懷理論</span>」進行整體性評估：<br>
  ▸ 無效性呼吸型態 → 協助胸腔放液，指導端坐呼吸、噘嘴式呼吸<br>
  ▸ 疼痛 → 定時探視觀察，依醫囑給予止痛藥，鼓勵分散注意力<br>
  ▸ 哀傷 → 會診心理師、安寧共照師協助</div>
</div>
<div class="c-card accent-green" style="margin-bottom:10px">
  <div class="c-head">④ 分享特殊護理經驗</div>
  <div class="cp">珍貴之處在於資料的<span class="hl-green">真實性</span>，藉由個案呈現使特殊護理經驗得以分享及傳承。</div>
  <div class="ex-box" style="margin:6px 0 0"><div class="ex-tag">範例：急診特殊個案（洪佩君、盧美言，2020）</div>
  一位因性行為導致黃體囊腫破裂的急診個案。除以護理計畫改善體液容積缺失、急性疼痛，並運用多媒體護理指導提供「性知識」資訊，設計「性隱私調查表」增進資料收集完整性。<br>
  分享此例可提升急診護理人員對特殊個案的敏感度，注意維護病人隱私。</div>
</div>

<div class="sh">個案研究的三種類型</div>
<table class="cmp-table">
<tr><th>類型</th><th>定義</th><th>臨床範例</th></tr>
<tr><td><span class="hl-gold">本質性個案研究</span><br><small>Intrinsic</small></td><td>研究者對個案所呈現的某一問題特別關注，針對某個臨床個案深入探討</td><td>一位乳房重建個案的手術全期護理；確立身體心像紊亂、焦慮、潛在危險性感染等問題並介入</td></tr>
<tr><td><span class="hl-teal">工具性個案研究</span><br><small>Instrumental</small></td><td>利用個案研究修正相關理論或建立合宜護理措施</td><td>思覺失調症合併酒癮個案，運用「Watson關懷理論」設計個別化照護，改善憂鬱、建立自我價值感</td></tr>
<tr><td><span class="hl-coral">多元個案研究</span><br><small>Multiple/Collective</small></td><td>由工具性延伸到一個以上的個案；了解某現象時單一個案無法回答問題</td><td>護理人員照護COVID-19病患的2例心靈記事；描述負壓隔離病房個案的心理支持需求</td></tr>
</table>

<div class="sh">個案報告的撰寫結構</div>
<div class="flow">
  <div class="flow-step"><div class="fs-num">1</div><div class="fs-txt">前言</div>選案動機、重要性說明</div>
  <div class="flow-step"><div class="fs-num">2</div><div class="fs-txt">文獻查證</div>理論架構與相關文獻</div>
  <div class="flow-step"><div class="fs-num">3</div><div class="fs-txt">護理評估</div>生理心理社會靈性</div>
  <div class="flow-step"><div class="fs-num">4</div><div class="fs-txt">問題確立</div>護理診斷、優先順序</div>
  <div class="flow-step"><div class="fs-num">5</div><div class="fs-txt">護理措施</div>目標訂立、具體執行</div>
  <div class="flow-step"><div class="fs-num">6</div><div class="fs-txt">目標評值</div>達成情形、修正護理措施</div>
  <div class="flow-step"><div class="fs-num">7</div><div class="fs-txt">討論與結論</div>文獻比較、心得建議</div>
</div>

<div class="sh">護理評估的四大面向</div>
<div class="g2">
  <div class="c-card accent-gold"><div class="c-head">生理健康</div>一般外表、營養、排泄、運動、衛生習慣、特殊藥物或菸酒、睡眠休息、性生活、就醫情況、過敏、免疫、生長發育、家族病史</div>
  <div class="c-card accent-teal"><div class="c-head">心理健康</div>適應方式、互動型態、認知型態、自我概念、情緒型態、家庭適應型態</div>
  <div class="c-card accent-coral"><div class="c-head">社會健康</div>文化型態、重要人物、娛樂型態、環境</div>
  <div class="c-card accent-green"><div class="c-head">靈性健康</div>宗教信仰及參與、價值觀</div>
</div>
<div class="imp-box">常使用<span class="hl-gold">戈登（Gordon）11項功能性健康型態</span>作為系統性評估工具；亦可引用護理理論（如歐倫護理理論、華森關懷理論）作為評估架構。資料來源包括：個案、家屬、病歷、檢查報告及其他醫療成員。</div>

<div class="sh">撰寫個案報告常見的錯誤</div>
<table class="cmp-table">
<tr><th>問題項目</th><th>常見錯誤</th><th>改善建議</th></tr>
<tr><td><span class="hl-coral">題目</span></td><td>未能代表全文，缺乏關鍵詞</td><td>題目應有中心思想，清楚表達文章重點</td></tr>
<tr><td><span class="hl-gold">文獻查證</span></td><td>深廣度不足，與主題相關性不夠</td><td>應包含與個案問題、護理措施有相關性的近期中英文文獻</td></tr>
<tr><td><span class="hl-teal">護理評估</span></td><td>缺乏整體性、系統評估，廣度深度不足</td><td>引用適當評估架構或理論，確保評估的全面性</td></tr>
<tr><td><span class="hl-green">護理措施</span></td><td>缺乏具體性與個別性，缺乏文獻支持</td><td>目標訂立必須以個案為中心，措施需有文獻支持，且護理人員可獨立執行</td></tr>
<tr><td><span class="hl-purple">討論與結論</span></td><td>未能將全文扼要總結，未提限制或困難</td><td>應比較文獻與個案異同，提出護理限制，並有具體可行的建議</td></tr>
</table>

{q:"「本質性個案研究（Intrinsic Case Study）」的主要特色是？",opts:["研究者利用個案研究修正相關理論","研究者對個案所呈現的某一問題特別關注，針對某臨床個案深入探討","研究多個不同的個案以了解某現象","研究者預先設定要驗證的理論"],ans:1,exp:"本質性個案研究是指研究者對個案所呈現的某一問題特別關注，並非為了印證既存理論而進行，而是針對某個臨床個案本身深入探討。"},
{q:"個案報告的護理評估涵蓋哪四大面向？",opts:["生理、心理、社會、靈性","診斷、計畫、執行、評值","問題確立、目標訂立、措施執行、結果評值","文獻查證、研究設計、資料收集、統計分析"],ans:0,exp:"個案報告的護理評估應涵蓋生理健康、心理健康、社會健康、靈性健康四大面向，可使用戈登11項功能性健康型態作為系統性評估工具。"},
