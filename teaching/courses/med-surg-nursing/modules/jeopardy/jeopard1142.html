<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>內外護理 Jeopardy — 弘光科技大學護理系</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Noto+Serif+TC:wght@400;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080c1a;
  --bg2:#0d1526;
  --bg3:#111d35;
  --text:#e2e8f0;
  --dim:#8892a8;
  --gold:#f5c842;
  --gold2:#ffe07a;
  --border:rgba(255,255,255,0.08);
  --shadow:0 8px 32px rgba(0,0,0,0.6);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

/* ── BACKGROUND ── */
body::before{content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse at 15% 0%,rgba(245,200,66,.06) 0%,transparent 50%),
             radial-gradient(ellipse at 85% 100%,rgba(0,180,216,.06) 0%,transparent 50%);
  pointer-events:none;z-index:0;}

/* ── HEADER ── */
.header{position:relative;z-index:10;background:rgba(8,12,26,.95);
  border-bottom:2px solid var(--gold);padding:20px 32px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.header-title{display:flex;align-items:center;gap:14px;}
.header-icon{font-size:36px;filter:drop-shadow(0 0 12px rgba(245,200,66,.6));}
.header-text h1{font-family:'Noto Serif TC',serif;font-size:22px;color:var(--gold);font-weight:700;line-height:1.2;}
.header-text p{font-size:12px;color:var(--dim);letter-spacing:.06em;}
.score-panel{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.team-score{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);
  border-radius:10px;padding:8px 14px;cursor:pointer;transition:all .2s;
  text-align:center;min-width:80px;}
.team-score:hover{background:rgba(255,255,255,.1);}
.team-score .ts-name{font-size:10px;color:var(--dim);margin-bottom:3px;font-weight:600;letter-spacing:.08em;}
.team-score .ts-pts{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;color:var(--gold);}
.score-btn{background:rgba(245,200,66,.12);border:1px solid rgba(245,200,66,.3);
  border-radius:8px;padding:8px 16px;color:var(--gold);font-size:12px;cursor:pointer;
  font-family:'Noto Sans TC',sans-serif;font-weight:600;transition:all .2s;}
.score-btn:hover{background:rgba(245,200,66,.22);}

/* ── UNIT TABS ── */
.unit-tabs{position:relative;z-index:5;
  display:flex;gap:6px;padding:16px 20px;overflow-x:auto;
  background:rgba(0,0,0,.3);border-bottom:1px solid var(--border);
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent;}
.unit-tabs::-webkit-scrollbar{height:3px;}
.unit-tabs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px;}
.unit-tab{
  flex-shrink:0;padding:8px 16px;border-radius:8px;border:1px solid var(--border);
  background:rgba(255,255,255,.04);color:var(--dim);cursor:pointer;
  font-size:12px;font-weight:600;transition:all .22s;white-space:nowrap;
  font-family:'Noto Sans TC',sans-serif;}
.unit-tab:hover{background:rgba(255,255,255,.08);color:var(--text);}
.unit-tab.active{color:#fff;font-weight:700;}

/* ── UNIT BOARD ── */
.unit-board{display:none;position:relative;z-index:1;padding:24px 20px 40px;}
.unit-board.active{display:block;}
.unit-header{text-align:center;margin-bottom:24px;}
.unit-header .uh-num{
  display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11px;
  font-weight:700;letter-spacing:.2em;padding:4px 14px;border-radius:100px;
  margin-bottom:10px;border:1px solid;}
.unit-header .uh-title{
  font-family:'Noto Serif TC',serif;font-size:28px;font-weight:700;color:#fff;
  margin-bottom:4px;}
.unit-header .uh-en{font-size:13px;color:var(--dim);letter-spacing:.05em;}

/* ── BOARD GRID ── */
.board{
  display:grid;grid-template-columns:repeat(6,1fr);
  gap:6px;max-width:1200px;margin:0 auto;}

.cat-header{
  border-radius:10px;padding:14px 8px;text-align:center;
  font-size:12px;font-weight:700;letter-spacing:.05em;line-height:1.4;
  min-height:64px;display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,.15);cursor:default;
  text-shadow:0 1px 4px rgba(0,0,0,.5);}

.tile{
  border-radius:10px;text-align:center;
  font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;
  padding:20px 8px;cursor:pointer;transition:all .22s;
  border:1px solid rgba(255,255,255,.1);min-height:80px;
  display:flex;align-items:center;justify-content:center;
  color:var(--gold);text-shadow:0 0 12px rgba(245,200,66,.5);
  position:relative;overflow:hidden;}
.tile::before{content:'';position:absolute;inset:0;opacity:0;background:rgba(255,255,255,.08);transition:opacity .2s;}
.tile:hover::before{opacity:1;}
.tile:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.5);}
.tile.used{opacity:.25;cursor:default;pointer-events:none;}
.tile.used::after{content:'✓';position:absolute;font-size:24px;color:rgba(255,255,255,.3);}

/* ── MODAL ── */
.modal-overlay{
  display:none;position:fixed;inset:0;z-index:100;
  background:rgba(0,0,0,.85);backdrop-filter:blur(6px);
  align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.modal{
  background:var(--bg2);border-radius:20px;max-width:720px;width:100%;
  border:1px solid rgba(255,255,255,.12);box-shadow:0 24px 80px rgba(0,0,0,.8);
  overflow:hidden;animation:modalIn .28s cubic-bezier(.4,0,.2,1);}
@keyframes modalIn{from{opacity:0;transform:scale(.92) translateY(20px);}to{opacity:1;transform:scale(1) translateY(0);}}
.modal-top{padding:20px 28px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.modal-meta{display:flex;align-items:center;gap:10px;}
.modal-cat{font-size:11px;font-weight:700;letter-spacing:.12em;padding:3px 12px;border-radius:100px;border:1px solid;}
.modal-pts{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;color:var(--gold);}
.modal-close{font-size:22px;cursor:pointer;color:var(--dim);transition:color .2s;padding:4px;background:none;border:none;}
.modal-close:hover{color:#fff;}
.modal-body{padding:32px 28px;}
.modal-label{font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--dim);margin-bottom:12px;}
.modal-clue{
  font-family:'Noto Serif TC',serif;font-size:20px;font-weight:700;color:#fff;
  line-height:1.65;margin-bottom:24px;}
.modal-answer-box{
  background:rgba(245,200,66,.07);border:1px solid rgba(245,200,66,.2);
  border-radius:12px;padding:20px 24px;display:none;}
.modal-answer-box.revealed{display:block;animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.modal-answer-label{font-size:10px;font-weight:700;letter-spacing:.15em;color:var(--gold);margin-bottom:8px;}
.modal-answer{font-size:17px;font-weight:600;color:var(--gold2);line-height:1.6;}
.modal-footer{padding:16px 28px 24px;display:flex;gap:10px;flex-wrap:wrap;}
.btn-reveal{
  background:linear-gradient(135deg,#f5c842,#e6a800);color:#000;
  border:none;border-radius:10px;padding:12px 28px;font-size:14px;font-weight:700;
  cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all .2s;}
.btn-reveal:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(245,200,66,.4);}
.btn-award{
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  color:var(--text);border-radius:10px;padding:12px 18px;font-size:13px;font-weight:600;
  cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all .2s;}
.btn-award:hover{background:rgba(255,255,255,.12);}
.btn-award.correct{border-color:rgba(45,212,191,.5);color:#2dd4bf;}
.btn-award.wrong{border-color:rgba(249,115,22,.5);color:#f97316;}

/* ── SCORE MODAL ── */
.score-modal{
  background:var(--bg2);border-radius:20px;max-width:480px;width:100%;
  border:1px solid rgba(255,255,255,.12);box-shadow:0 24px 80px rgba(0,0,0,.8);
  overflow:hidden;animation:modalIn .28s ease;}
.score-modal h2{font-family:'Noto Serif TC',serif;padding:24px 28px 0;font-size:22px;color:var(--gold);}
.score-modal-body{padding:20px 28px 28px;}
.score-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.score-row label{font-size:13px;font-weight:600;color:var(--dim);width:60px;flex-shrink:0;}
.score-row input{
  flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  border-radius:8px;padding:10px 14px;color:#fff;font-size:14px;
  font-family:'Noto Sans TC',sans-serif;}
.score-row input:focus{outline:none;border-color:rgba(245,200,66,.4);}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:28px;right:28px;z-index:200;
  background:var(--bg3);border:1px solid rgba(255,255,255,.12);
  border-radius:12px;padding:14px 22px;font-size:14px;font-weight:600;
  box-shadow:0 8px 32px rgba(0,0,0,.6);transform:translateY(80px);opacity:0;
  transition:all .3s;pointer-events:none;}
.toast.show{transform:translateY(0);opacity:1;}

/* ── FOOTER ── */
.footer{position:relative;z-index:1;text-align:center;
  padding:24px;border-top:1px solid var(--border);
  color:var(--dim);font-size:12px;line-height:1.8;}

@media(max-width:768px){
  .board{grid-template-columns:repeat(3,1fr);}
  .modal-clue{font-size:17px;}
  .tile{font-size:17px;min-height:60px;padding:14px 4px;}
  .header{padding:14px 16px;}
  .header-text h1{font-size:17px;}
  .unit-header .uh-title{font-size:21px;}
}
@media(max-width:480px){
  .board{grid-template-columns:repeat(3,1fr);gap:4px;}
  .cat-header{font-size:10px;padding:10px 4px;min-height:52px;}
  .tile{font-size:14px;min-height:52px;}
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-title">
    <div class="header-icon">🏆</div>
    <div class="header-text">
      <h1>內外護理學綜論 · Jeopardy!</h1>
      <p>弘光科技大學護理系 · 114學年第2學期 · 8單元共240題</p>
    </div>
  </div>
  <div class="score-panel" id="scorePanel">
    <!-- dynamically generated -->
    <button class="score-btn" onclick="openScoreConfig()">⚙ 設定隊伍</button>
    <button class="score-btn" onclick="resetScores()">↺ 重置分數</button>
  </div>
</div>

<!-- UNIT TABS -->
<div class="unit-tabs" id="unitTabs"></div>

<!-- UNIT BOARDS (generated by JS) -->
<div id="boards"></div>

<!-- QUESTION MODAL -->
<div class="modal-overlay" id="qModal">
  <div class="modal">
    <div class="modal-top">
      <div class="modal-meta">
        <span class="modal-cat" id="mCat">類別</span>
        <span class="modal-pts" id="mPts">100</span>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-label">▶ 題目線索</div>
      <div class="modal-clue" id="mClue"></div>
      <div class="modal-answer-box" id="mAnswerBox">
        <div class="modal-answer-label">✦ 正確答案</div>
        <div class="modal-answer" id="mAnswer"></div>
      </div>
    </div>
    <div class="modal-footer" id="mFooter"></div>
  </div>
</div>

<!-- SCORE CONFIG MODAL -->
<div class="modal-overlay" id="scoreModal">
  <div class="score-modal">
    <h2>⚙ 設定隊伍名稱</h2>
    <div class="score-modal-body">
      <div id="teamInputs"></div>
      <button class="btn-reveal" onclick="saveTeams()" style="margin-top:8px;">儲存設定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- FOOTER -->
<footer class="footer">
  內外護理學綜論 Jeopardy 互動教學遊戲 · 弘光科技大學 護理系 · 僅供學術教育用途
</footer>

      {pts:500,clue:"照顧自殺嘗試後存活者（Attempt survivors）的四項護理重點",ans:"非評判態度、評估動機與當下風險、轉介心理健康服務、家庭支持介入"},
    ]},
    { name:"危機介入", color:"#be185d", qs:[
      {pts:100,clue:"Roberts七階段危機介入模型的第一個步驟",ans:"危機評估（Assessment），包括安全評估"},
      {pts:200,clue:"危機（Crisis）的定義中，最核心的缺失",ans:"個人的因應（Coping）能力不足以應對當前挑戰"},
      {pts:300,clue:"心理急救（PFA）的三個基本行動（縮寫3L）",ans:"看（Look/觀察需求）、聆聽（Listen/陪伴傾聽）、連結（Link/連結資源）"},
      {pts:400,clue:"創傷後壓力症候群（PTSD）的四大核心症狀群",ans:"再體驗（Intrusion）、逃避（Avoidance）、認知情緒負向改變、過度警覺（Hyperarousal）"},
      {pts:500,clue:"危機介入的「時間限制原則」及危機被視為機會的原因",ans:"短期4–6週；危機打破原有平衡，可促進個體學習新的因應策略及成長"},
    ]},
    { name:"評估工具", color:"#9d174d", qs:[
      {pts:100,clue:"PHQ-9憂鬱篩查量表總分≥10分代表的程度",ans:"中度憂鬱（Moderate depression）"},
      {pts:200,clue:"Hamilton焦慮量表（HAM-A）總分>17分的焦慮程度",ans:"中度焦慮"},
      {pts:300,clue:"動機式晤談（Motivational Interviewing）的OARS四項技術",ans:"O=開放式問題、A=肯定（Affirmation）、R=反映式傾聽、S=摘要"},
      {pts:400,clue:"改變階段模式（Transtheoretical Model）的五個階段",ans:"前思考→思考→準備→行動→維持（Precontemplation→Contemplation→Preparation→Action→Maintenance）"},
      {pts:500,clue:"「SAD PERSONS量表」用於評估何種風險及S代表的風險因子",ans:"自殺風險評估；S=性別（Sex；男性風險較高）"},
    ]},
    { name:"身體意象", color:"#831843", qs:[
      {pts:100,clue:"身體意象（Body image）的定義",ans:"個人對自己身體外觀的主觀感知、思想與情感評價"},
      {pts:200,clue:"術後（乳房切除/造口）病人最常見的四種身體意象困擾表現",ans:"迴避照鏡子、拒絕觸摸傷口、社交退縮、性關係障礙"},
      {pts:300,clue:"護理師協助身體意象改變病人的三項治療性溝通技巧",ans:"積極傾聽、開放式提問、正常化情緒反應（避免評判語言）"},
      {pts:400,clue:"厭食症（Anorexia nervosa）診斷標準中BMI的臨界值",ans:"BMI < 17.5 kg/m²（或預期體重的85%以下）"},
      {pts:500,clue:"「鏡像暴露療法（Mirror exposure therapy）」治療身體意象障礙的心理機制",ans:"反覆暴露於鏡中自我影像，逐漸降低對身體的負面感知，減少迴避行為"},
    ]},
  ]
},
];

// =============================================
// STATE
// =============================================
let teams = [
  {name:"第一組",score:0},{name:"第二組",score:0},
  {name:"第三組",score:0},{name:"第四組",score:0},
  {name:"第五組",score:0},{name:"第六組",score:0},
];
let activeUnit = 0;
let currentTile = null; // {unitIdx, catIdx, qIdx, pts}
let usedTiles = {}; // "unitIdx-catIdx-qIdx": true

function tileKey(u,c,q){return `${u}-${c}-${q}`;}

// =============================================
// RENDER SCORE PANEL
// =============================================
function renderScores(){
  const panel = document.getElementById('scorePanel');
  let html = teams.map((t,i)=>`
    <div class="team-score" onclick="adjustScore(${i})">
      <div class="ts-name">${t.name}</div>
      <div class="ts-pts">${t.score}</div>
    </div>`).join('');
  html += `<button class="score-btn" onclick="openScoreConfig()">⚙ 設定隊伍</button>`;
  html += `<button class="score-btn" onclick="resetScores()">↺ 重置</button>`;
  panel.innerHTML = html;
}

function adjustScore(idx){
  const delta = prompt(`${teams[idx].name} — 輸入加減分數（例如 +200 或 -100）:`, '+100');
  if(!delta) return;
  const n = parseInt(delta);
  if(isNaN(n)) return;
  teams[idx].score += n;
  renderScores();
  showToast(`${teams[idx].name} → ${teams[idx].score} 分`);
}

function resetScores(){
  if(!confirm('確定要重置所有分數嗎？')) return;
  teams.forEach(t=>t.score=0);
  renderScores();
  showToast('分數已重置');
}

function openScoreConfig(){
  const area = document.getElementById('teamInputs');
  area.innerHTML = teams.map((t,i)=>`
    <div class="score-row">
      <label>隊伍${i+1}</label>
      <input id="tname_${i}" value="${t.name}" placeholder="隊伍名稱">
    </div>`).join('');
  document.getElementById('scoreModal').classList.add('open');
}

function saveTeams(){
  teams.forEach((t,i)=>{
    const v = document.getElementById('tname_'+i).value.trim();
    if(v) t.name=v;
  });
  document.getElementById('scoreModal').classList.remove('open');
  renderScores();
  showToast('隊伍名稱已更新');
}

// =============================================
// RENDER UNIT TABS & BOARDS
// =============================================
function renderAll(){
  const tabsEl = document.getElementById('unitTabs');
  const boardsEl = document.getElementById('boards');
  tabsEl.innerHTML = '';
  boardsEl.innerHTML = '';

  UNITS.forEach((unit,ui)=>{
    // TAB
    const tab = document.createElement('button');
    tab.className = 'unit-tab' + (ui===activeUnit?' active':'');
    tab.style.borderColor = ui===activeUnit ? unit.color : 'rgba(255,255,255,.08)';
    tab.style.color = ui===activeUnit ? unit.color : '';
    tab.style.background = ui===activeUnit ? unit.bg : '';
    tab.textContent = `U0${unit.id} ${unit.title}`;
    tab.onclick = ()=>{ activeUnit=ui; renderAll(); };
    tabsEl.appendChild(tab);

    // BOARD
    const board = document.createElement('div');
    board.className = 'unit-board' + (ui===activeUnit?' active':'');
    board.innerHTML = `
      <div class="unit-header">
        <div class="uh-num" style="color:${unit.color};border-color:${unit.color};background:${unit.bg}">Unit 0${unit.id}</div>
        <div class="uh-title">${unit.title}</div>
        <div class="uh-en">${unit.en}</div>
      </div>
      <div class="board" id="board_${ui}"></div>`;
    boardsEl.appendChild(board);

    if(ui===activeUnit){
      const grid = board.querySelector('#board_'+ui);
      // Category headers
      unit.categories.forEach(cat=>{
        const hdr = document.createElement('div');
        hdr.className = 'cat-header';
        hdr.style.background = hexWithAlpha(cat.color, .18);
        hdr.style.borderColor = hexWithAlpha(cat.color, .35);
        hdr.style.color = cat.color;
        hdr.textContent = cat.name;
        grid.appendChild(hdr);
      });
      // Tiles (5 rows × 6 cats)
      for(let qi=0;qi<5;qi++){
        unit.categories.forEach((cat,ci)=>{
          const q = cat.qs[qi];
          const key = tileKey(ui,ci,qi);
          const tile = document.createElement('div');
          tile.className = 'tile' + (usedTiles[key]?' used':'');
          tile.style.background = hexWithAlpha(cat.color,.12);
          tile.style.borderColor = hexWithAlpha(cat.color,.2);
          tile.textContent = `$${q.pts}`;
          tile.dataset.unit = ui;
          tile.dataset.cat = ci;
          tile.dataset.q = qi;
          tile.onclick = ()=>openQuestion(ui,ci,qi);
          grid.appendChild(tile);
        });
      }
    }
  });
}

function hexWithAlpha(hex,a){
  // convert hex to rgba
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// =============================================
// OPEN QUESTION MODAL
// =============================================
function openQuestion(ui,ci,qi){
  const key = tileKey(ui,ci,qi);
  if(usedTiles[key]) return;
  const unit = UNITS[ui];
  const cat = unit.categories[ci];
  const q = cat.qs[qi];
  currentTile = {ui,ci,qi,pts:q.pts};

  document.getElementById('mCat').textContent = cat.name;
  document.getElementById('mCat').style.color = cat.color;
  document.getElementById('mCat').style.borderColor = cat.color;
  document.getElementById('mCat').style.background = hexWithAlpha(cat.color,.15);
  document.getElementById('mPts').textContent = `$${q.pts}`;
  document.getElementById('mClue').textContent = q.clue;
  document.getElementById('mAnswer').textContent = q.ans;
  document.getElementById('mAnswerBox').classList.remove('revealed');

  // Footer buttons
  const footer = document.getElementById('mFooter');
  footer.innerHTML = `<button class="btn-reveal" onclick="revealAnswer()">🔍 揭曉答案</button>`;
  teams.forEach((t,ti)=>{
    footer.innerHTML += `<button class="btn-award correct" onclick="awardTeam(${ti},${q.pts})">+${q.pts} ${t.name}</button>`;
  });
  footer.innerHTML += `<button class="btn-award wrong" onclick="closeModal()">✕ 關閉</button>`;

  document.getElementById('qModal').classList.add('open');
}

function revealAnswer(){
  document.getElementById('mAnswerBox').classList.add('revealed');
  document.querySelector('.btn-reveal').textContent = '✅ 已揭曉';
  document.querySelector('.btn-reveal').disabled = true;
  document.querySelector('.btn-reveal').style.opacity = '.6';
}

function awardTeam(ti, pts){
  teams[ti].score += pts;
  renderScores();
  showToast(`+${pts} 分 → ${teams[ti].name}（共 ${teams[ti].score} 分）`);
  if(currentTile){
    usedTiles[tileKey(currentTile.ui,currentTile.ci,currentTile.qi)] = true;
  }
  closeModal();
  renderAll();
}

function closeModal(){
  if(currentTile){
    usedTiles[tileKey(currentTile.ui,currentTile.ci,currentTile.qi)] = true;
  }
  document.getElementById('qModal').classList.remove('open');
  renderAll();
}

// =============================================
// TOAST
// =============================================
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'),2500);
}

// =============================================
// INIT
// =============================================
document.addEventListener('DOMContentLoaded',()=>{
  renderScores();
  renderAll();

  // Close score modal on overlay click
  document.getElementById('scoreModal').addEventListener('click',e=>{
    if(e.target===document.getElementById('scoreModal'))
      document.getElementById('scoreModal').classList.remove('open');
  });
  document.getElementById('qModal').addEventListener('click',e=>{
    if(e.target===document.getElementById('qModal')) closeModal();
  });

  // Keyboard ESC
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      document.getElementById('qModal').classList.remove('open');
      document.getElementById('scoreModal').classList.remove('open');
    }
  });
});
</script>
</body>
</html>
