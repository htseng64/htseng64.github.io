<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>學生加入課堂</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#070b18;--card:#10182b;--text:#e5e7eb;--dim:#94a3b8;--gold:#facc15;--teal:#2dd4bf;--pink:#f472b6;--border:rgba(255,255,255,.12)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,"Noto Sans TC",sans-serif;color:var(--text);background:radial-gradient(circle at 10% 10%,rgba(250,204,21,.10),transparent 35%),radial-gradient(circle at 90% 90%,rgba(45,212,191,.10),transparent 35%),var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:440px;background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.03));border:1px solid var(--border);border-radius:26px;padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.38);text-align:center}
h1{margin:0 0 10px;color:var(--gold);font-size:30px}.hint{color:var(--dim);font-size:14px;line-height:1.7;margin-bottom:22px}
input{width:100%;padding:15px;border-radius:14px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:#fff;font-size:17px;margin:8px 0;text-align:center}
button{width:100%;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--teal),#0891b2);color:#001;font-size:17px;font-weight:900;margin-top:12px;cursor:pointer}
.box{display:none;text-align:left;background:rgba(45,212,191,.08);border:1px solid rgba(45,212,191,.35);border-radius:14px;padding:14px;margin:12px 0;line-height:1.8}.box.on{display:block}.box b{color:var(--gold)}
.msg{margin-top:12px;color:var(--pink);font-size:14px;line-height:1.6}.ok{color:var(--teal)}
</style>
</head>
<body>
<div class="card">
  <h1>📱 加入課堂</h1>
  <div class="hint">請輸入老師公布的通關密語、學號與遊戲暱稱。</div>
  <input id="passcode" placeholder="通關密語">
  <input id="studentId" placeholder="學號">
  <button onclick="verifyStudent()">查詢學號</button>
  <div class="box" id="foundBox"></div>
  <input id="nickname" placeholder="遊戲暱稱（排行榜顯示）" style="display:none">
  <button id="joinBtn" onclick="joinClass()" style="display:none;background:linear-gradient(135deg,var(--gold),#d97706)">加入課堂</button>
  <div id="msg" class="msg"></div>
</div>
<script>
let sb=null, sessionId="", sessionData=null, foundStudent=null;
const params=new URLSearchParams(location.search);
const sbUrl=params.get("sb_url");
const sbKey=params.get("sb_key");
sessionId=params.get("session_id")||params.get("s")||"";
function msg(t, ok=false){const el=document.getElementById("msg");el.textContent=t;el.className=ok?"msg ok":"msg"}
async function init(){
  if(!sbUrl||!sbKey){msg("此學生入口缺少 Supabase 設定。請老師從 start.html 重新建立 QR。");return}
  if(!sessionId){msg("此連結缺少課堂代碼。請重新掃描老師的 QR Code。");return}
  sb=window.supabase.createClient(sbUrl,sbKey);
  const {data,error}=await sb.from("sessions").select("*").eq("id",sessionId).single();
  if(error||!data){msg("找不到課堂，請老師重新建立課堂。");return}
  sessionData=data;
}
init();
async function verifyStudent(){
  if(!sb||!sessionData){msg("系統尚未完成連線，請稍後再試。");return}
  const pass=document.getElementById("passcode").value.trim();
  const sid=document.getElementById("studentId").value.trim();
  if(!pass||!sid){msg("請輸入通關密語與學號");return}
  if(pass!==sessionData.passcode){msg("通關密語錯誤");return}
  const {data,error}=await sb.from("students").select("*").eq("student_id",sid).limit(1);
  if(error){msg("查詢學生名單失敗："+error.message);return}
  if(!data||!data.length){msg("查無此學號，請確認或請老師檢查名單。");return}
  foundStudent=data[0];
  document.getElementById("foundBox").innerHTML=`<b>找到學生資料</b><br>姓名：${foundStudent.name||""}<br>學號：${foundStudent.student_id||""}<br>組別：${foundStudent.team_name||""}`;
  document.getElementById("foundBox").classList.add("on");
  document.getElementById("nickname").style.display="";
  document.getElementById("joinBtn").style.display="";
  if(foundStudent.nickname){document.getElementById("nickname").value=foundStudent.nickname}
  msg("請輸入暱稱後加入課堂。", true);
}
async function joinClass(){
  if(!foundStudent){msg("請先查詢學號");return}
  const nick=document.getElementById("nickname").value.trim();
  if(!nick){msg("請輸入遊戲暱稱");return}
  const row={session_id:sessionId,student_id:foundStudent.student_id,name:foundStudent.name||"",nickname:nick,team_name:foundStudent.team_name||"",created_at:new Date().toISOString()};
  const {error}=await sb.from("participants").insert(row);
  if(error){msg("加入失敗："+error.message);return}
  localStorage.setItem("CURRENT_STUDENT",JSON.stringify(row));
  msg("✅ 加入成功！請回到老師畫面等待遊戲開始。", true);
}
</script>
</body>
</html>
