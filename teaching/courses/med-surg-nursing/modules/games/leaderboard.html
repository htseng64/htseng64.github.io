<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>排行榜</title>
  <style>
    body { font-family: Arial, "Noto Sans TC"; background:#0f172a; color:white; padding:30px; }
    .card { background:#1e293b; padding:20px; border-radius:16px; margin-bottom:20px; }
    table { width:100%; border-collapse:collapse; }
    th, td { border-bottom:1px solid #334155; padding:10px; text-align:left; }
  </style>
</head>
<body>

<h1>即時排行榜</h1>

<div class="card">
  <h2>小組成績</h2>
  <table id="teamTable"></table>
</div>

<div class="card">
  <h2>個人成績</h2>
  <table id="studentTable"></table>
</div>

<script src="shared/scoring.js"></script>
<script>
loadScores();

const teamScores = getTeamScores();
document.getElementById("teamTable").innerHTML =
  "<tr><th>組別</th><th>分數</th></tr>" +
  Object.entries(teamScores)
    .sort((a,b) => b[1] - a[1])
    .map(([team, score]) => `<tr><td>${team}</td><td>${score}</td></tr>`)
    .join("");

const individualScores = getIndividualScores();
document.getElementById("studentTable").innerHTML =
  "<tr><th>學號</th><th>姓名</th><th>組別</th><th>分數</th></tr>" +
  individualScores
    .sort((a,b) => b.score - a.score)
    .map(s => `<tr><td>${s.student_id}</td><td>s.nickname || s.name</td><td>${s.team_name}</td><td>${s.score}</td></tr>`)
    .join("");
</script>

</body>
</html>
