<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>課程 QR Code</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#070b18;--card:#10182b;--text:#e5e7eb;--dim:#94a3b8;
  --gold:#facc15;--teal:#2dd4bf;--border:rgba(255,255,255,.12)
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;font-family:Arial,"Noto Sans TC",sans-serif;color:var(--text);
  background:radial-gradient(circle at 10% 10%,rgba(250,204,21,.10),transparent 35%),
  radial-gradient(circle at 90% 90%,rgba(45,212,191,.10),transparent 35%),var(--bg)
}
.header{
  padding:22px 28px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;gap:14px;align-items:center;
  background:rgba(7,11,24,.94);position:sticky;top:0;z-index:10
}
h1{margin:0;color:var(--gold);font-size:30px}
.subtitle{color:var(--dim);line-height:1.7;margin:6px 0 0}
.main{max-width:1250px;margin:auto;padding:26px}
button{
  border:1px solid var(--border);background:rgba(255,255,255,.06);color:var(--text);
  padding:10px 13px;border-radius:10px;font-size:14px;cursor:pointer;font-weight:800
}
button:hover{background:rgba(255,255,255,.12)}
.primary{background:linear-gradient(135deg,var(--gold),#d97706);color:#111;border:0}
.card{
  background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.03));
  border:1px solid var(--border);border-radius:22px;padding:20px;margin-bottom:18px;
  box-shadow:0 20px 60px rgba(0,0,0,.35)
}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
@media(max-width:850px){.grid{grid-template-columns:1fr}.header{flex-direction:column;align-items:flex-start}}
label{display:block;color:var(--dim);font-size:12px;font-weight:800;margin:12px 0 6px}
input{
  width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);
  background:rgba(255,255,255,.06);color:#fff;font-size:14px
}
.qrwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:12px}
.qr{
  background:#fff;border-radius:14px;padding:12px;width:180px;min-height:180px;
  display:flex;align-items:center;justify-content:center;color:#111
}
.url{
  word-break:break-all;color:var(--dim);font-size:13px;line-height:1.6;
  background:rgba(255,255,255,.05);border:1px solid var(--border);
  padding:10px;border-radius:10px;margin-top:8px
}
.title{font-size:22px;font-weight:900;color:#fff;margin-bottom:4px}
.hint{font-size:14px;color:var(--dim);line-height:1.7}
.teacher-panel{display:none}
.teacher-panel.on{display:block}
.lockbox{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.lockbox input{max-width:240px}
.notice{
  background:rgba(45,212,191,.08);border:1px solid rgba(45,212,191,.25);
  color:#bffcf2;border-radius:14px;padding:12px;margin-top:12px;font-size:13px;line-height:1.7
}
.warning{
  background:rgba(250,204,21,.08);border:1px solid rgba(250,204,21,.25);
  color:#fde68a;border-radius:14px;padding:12px;margin-top:12px;font-size:13px;line-height:1.7
}
@media print{
  .edit,.header button{display:none}
  body{background:white;color:#111}
  .card{background:white;border:1px solid #ccc;box-shadow:none;break-inside:avoid}
  .title,h1{color:#111}.hint,.subtitle,.url{color:#333}
}
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>📱 課程 QR Code</h1>
    <div class="subtitle">請掃描對應 QR Code 進入課堂活動。</div>
  </div>
  <div>
    <button onclick="location.href='index.html'">← 返回入口</button>
    <button onclick="window.print()">列印 QR</button>
    <button onclick="toggleTeacherLogin()">老師設定</button>
  </div>
</div>

<div class="main">
  <section class="card edit" id="teacherLoginBox" style="display:none">
    <h2>老師設定</h2>
    <div class="hint">請輸入口令後再編輯連結。此口令只用於避免投影時誤觸，不是正式資安防護。</div>
    <div class="lockbox">
      <input id="teacherPass" type="password" placeholder="輸入老師口令">
      <button class="primary" onclick="unlockTeacher()">解鎖</button>
    </div>
    <div class="warning">
      請只貼「學生填答用 viewform 連結」。不要貼 Google Form 的 edit 連結，也不要貼回覆試算表連結。
    </div>
  </section>

  <section class="card edit teacher-panel" id="teacherPanel">
    <h2>連結設定</h2>
    <div class="grid">
      <div>
        <label>學生入口連結</label>
        <input id="studentUrl" placeholder="student-entry.html 或 GitHub Pages 連結">
      </div>
      <div>
        <label>課程評值 Google Form（viewform）</label>
        <input id="courseEvalUrl" placeholder="https://docs.google.com/forms/d/e/.../viewform">
      </div>
      <div>
        <label>小組互評 Google Form（viewform）</label>
        <input id="peerEvalUrl" placeholder="https://docs.google.com/forms/d/e/.../viewform">
      </div>
      <div>
        <label>成果報告 report.html</label>
        <input id="reportUrl" placeholder="report.html 或 GitHub Pages 連結">
      </div>
    </div>
    <p>
      <button class="primary" onclick="saveLinks()">💾 儲存並產生 QR Code</button>
      <button onclick="clearLinks()">清除本機設定</button>
      <button onclick="lockTeacher()">鎖定老師設定</button>
    </p>
    <div class="notice">
      這些連結只儲存在目前這台電腦的瀏覽器 localStorage，不會自動上傳到 GitHub。
    </div>
  </section>

  <section class="grid" id="cards"></section>
</div>

<script>
const TEACHER_PASSCODE = "1142"; // 可自行改成老師知道的口令

const items = [
  ["studentUrl","📱 學生入口","掃描後輸入通關密語、學號與暱稱"],
  ["courseEvalUrl","📊 課程評值（匿名）","期末課程評值與學習成果回饋"],
  ["peerEvalUrl","👥 小組互評","依名單選擇組員並完成互評"],
  ["reportUrl","📈 教學成果報告","成果展示與匯出"]
];

function absUrl(v){
  if(!v) return "";
  try { return new URL(v, location.href).href; } catch(e){ return v; }
}

function toggleTeacherLogin(){
  const box = document.getElementById("teacherLoginBox");
  box.style.display = box.style.display === "none" ? "block" : "none";
}

function unlockTeacher(){
  const pass = document.getElementById("teacherPass").value.trim();
  if(pass !== TEACHER_PASSCODE){
    alert("口令錯誤");
    return;
  }
  document.getElementById("teacherPanel").classList.add("on");
  document.getElementById("teacherLoginBox").style.display = "none";
}

function lockTeacher(){
  document.getElementById("teacherPanel").classList.remove("on");
  document.getElementById("teacherPass").value = "";
}

function loadLinks(){
  items.forEach(([id])=>{
    const el = document.getElementById(id);
    if(el) el.value = localStorage.getItem("LINK_" + id) || "";
  });
  renderCards();
}

function saveLinks(){
  items.forEach(([id])=>{
    const value = document.getElementById(id).value.trim();
    if(value.includes("/edit")){
      alert("請不要貼 /edit 編輯連結，請改貼 /viewform 學生填答連結。");
      return;
    }
    localStorage.setItem("LINK_" + id, value);
  });
  renderCards();
}

function clearLinks(){
  if(!confirm("確定要清除本機儲存的所有連結嗎？")) return;
  items.forEach(([id])=>localStorage.removeItem("LINK_" + id));
  loadLinks();
}

function renderCards(){
  const box = document.getElementById("cards");
  box.innerHTML = "";

  items.forEach(([id,title,hint])=>{
    const raw = localStorage.getItem("LINK_" + id) || "";
    const url = absUrl(raw);

    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <div class="title">${title}</div>
      <div class="hint">${hint}</div>
      <div class="qrwrap">
        <div class="qr" id="qr_${id}">${url ? "" : "尚未設定"}</div>
        <div style="flex:1">
          <button onclick="openLink('${id}')">開啟</button>
          <button onclick="copyLink('${id}')">複製</button>
          <div class="url">${url || "尚未設定"}</div>
        </div>
      </div>
    `;
    box.appendChild(div);

    if(url){
      new QRCode(document.getElementById("qr_" + id), {
        text:url,
        width:156,
        height:156
      });
    }
  });
}

function getUrl(id){
  return absUrl(localStorage.getItem("LINK_" + id) || "");
}

function openLink(id){
  const url = getUrl(id);
  if(url) window.open(url, "_blank");
  else alert("尚未設定連結");
}

function copyLink(id){
  const url = getUrl(id);
  if(!url){
    alert("尚未設定連結");
    return;
  }
  navigator.clipboard.writeText(url);
  alert("已複製連結");
}

loadLinks();
</script>
</body>
</html>
