<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>護理互動課堂 — 開課主控台</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* ── TOKENS ── */
:root{
  --bg:#060b18; --s1:#0c1528; --s2:#111d35;
  --tx:#e2e8f0; --dim:#8892a8; --br:rgba(255,255,255,.09);
  --gold:#f5c842; --teal:#2dd4bf; --pink:#f472b6; --red:#fb7185;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{min-height:100%;font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--tx);}
body{background-image:
  radial-gradient(ellipse at 10% 0%,rgba(245,200,66,.10) 0%,transparent 40%),
  radial-gradient(ellipse at 90% 100%,rgba(45,212,191,.09) 0%,transparent 40%);}

/* ── TOP BAR ── */
.topbar{
  display:flex;align-items:center;gap:12px;padding:12px 24px;
  background:rgba(6,11,24,.95);border-bottom:1px solid var(--br);
  position:sticky;top:0;z-index:100;}
.topbar-logo{font-family:'Noto Serif TC',serif;font-size:16px;font-weight:700;color:var(--gold);}
.topbar-logo span{opacity:.6;margin:0 8px;}
.topbar-logo em{font-style:normal;color:var(--tx);font-size:13px;}
.sp{flex:1;}
/* STATUS PILL */
.status-pill{
  display:flex;align-items:center;gap:7px;
  padding:6px 14px;border-radius:100px;font-size:11px;font-weight:700;
  border:1px solid;transition:.3s;}
.status-pill .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.status-pill.checking{border-color:rgba(245,200,66,.4);color:var(--gold);}
.status-pill.checking .dot{background:var(--gold);animation:blink 1s infinite;}
.status-pill.ok{border-color:rgba(45,212,191,.4);color:var(--teal);}
.status-pill.ok .dot{background:var(--teal);}
.status-pill.err{border-color:rgba(251,113,133,.4);color:var(--red);}
.status-pill.err .dot{background:var(--red);}
@keyframes blink{50%{opacity:.2;}}
.topbar-btn{
  padding:7px 14px;border-radius:9px;border:1px solid var(--br);
  background:rgba(255,255,255,.05);color:var(--dim);cursor:pointer;
  font-size:12px;font-weight:700;font-family:inherit;transition:.2s;}
.topbar-btn:hover{background:rgba(255,255,255,.1);color:var(--tx);}

/* ── LAYOUT ── */
.stage{
  display:grid;grid-template-columns:1fr 420px;gap:20px;
  max-width:1340px;margin:auto;padding:24px;}
@media(max-width:1000px){.stage{grid-template-columns:1fr;}}

/* ── CARDS ── */
.card{
  background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.025));
  border:1px solid var(--br);border-radius:24px;padding:26px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);}

/* ── HERO (left) ── */
.hero{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;min-height:620px;gap:16px;}
.hero-title{
  font-family:'Noto Serif TC',serif;font-size:clamp(32px,4vw,52px);
  font-weight:700;color:var(--gold);line-height:1.2;}
.hero-sub{font-size:16px;color:var(--dim);line-height:1.8;max-width:480px;}

/* QR BOX */
.qr-container{
  background:#fff;border-radius:22px;padding:18px;
  box-shadow:0 24px 70px rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;
  width:300px;height:300px;transition:.3s;}
.qr-container.large{width:380px;height:380px;}
.qr-placeholder{
  width:100%;height:100%;border-radius:12px;
  background:rgba(0,0,0,.06);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;color:#aaa;}
.qr-placeholder span{font-size:36px;}
.qr-placeholder p{font-size:13px;font-family:'Noto Sans TC',sans-serif;}
.qr-container canvas,.qr-container img{max-width:100%;max-height:100%;border-radius:8px;}

/* PASSWORD BADGE */
.pwd-badge{
  padding:12px 28px;border-radius:100px;
  border:1px solid rgba(245,200,66,.4);background:rgba(245,200,66,.1);
  font-size:26px;font-weight:900;color:var(--gold);
  font-family:'JetBrains Mono',monospace;letter-spacing:.06em;}

/* URL BOX */
.url-display{
  max-width:520px;font-family:'JetBrains Mono',monospace;
  font-size:11px;color:var(--dim);line-height:1.6;
  background:rgba(255,255,255,.04);border:1px solid var(--br);
  padding:10px 14px;border-radius:12px;word-break:break-all;text-align:left;}

/* ── SIDE PANEL ── */
.side{display:flex;flex-direction:column;gap:16px;}

/* KPI */
.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.kpi{
  background:rgba(255,255,255,.04);border:1px solid var(--br);
  border-radius:16px;padding:18px;text-align:center;}
.kpi-num{
  font-family:'JetBrains Mono',monospace;font-size:38px;
  font-weight:700;color:var(--teal);line-height:1;}
.kpi-label{font-size:11px;color:var(--dim);margin-top:6px;}

/* ACTION GRID */
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:4px;}
.act-btn{
  padding:11px 10px;border-radius:12px;border:1px solid var(--br);
  background:rgba(255,255,255,.05);color:var(--dim);
  cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;
  transition:.2s;text-align:center;}
.act-btn:hover{background:rgba(255,255,255,.1);color:var(--tx);}

/* JOINED LIST */
.joined-list{
  display:flex;flex-direction:column;gap:7px;
  max-height:240px;overflow-y:auto;}
.joined-item{
  display:flex;align-items:center;gap:9px;
  background:rgba(255,255,255,.04);border:1px solid var(--br);
  border-radius:11px;padding:10px 12px;animation:slideIn .25s ease;}
@keyframes slideIn{from{opacity:0;transform:translateX(8px);}to{opacity:1;transform:translateX(0);}}
.joined-item .jname{font-size:13px;font-weight:700;flex:1;}
.joined-item .jteam{font-size:10px;font-weight:700;}
.joined-item .jid{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);}
.odot{width:6px;height:6px;border-radius:50%;background:var(--teal);flex-shrink:0;animation:blink 2s infinite;}

/* TEACHER SETUP PANEL */
.setup-panel{
  background:rgba(255,255,255,.03);border:1px solid rgba(245,200,66,.2);
  border-radius:18px;padding:20px;}
.setup-panel h3{
  font-family:'Noto Serif TC',serif;font-size:15px;
  color:var(--gold);margin-bottom:16px;}
.field{margin-bottom:14px;}
.field label{
  display:block;font-size:10px;font-weight:700;
  letter-spacing:.15em;color:var(--dim);text-transform:uppercase;margin-bottom:6px;}
.field input{
  width:100%;padding:12px 14px;border-radius:11px;
  border:1px solid var(--br);background:rgba(255,255,255,.05);
  color:#fff;font-size:14px;font-family:inherit;outline:none;transition:.2s;}
.field input:focus{border-color:var(--gold);background:rgba(245,200,66,.06);}
.go-btn{
  display:block;width:100%;padding:14px;border-radius:13px;
  background:linear-gradient(135deg,#f5c842,#d97706);color:#000;
  border:none;font-size:15px;font-weight:900;cursor:pointer;
  font-family:inherit;transition:.2s;margin-top:4px;}
.go-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(245,200,66,.4);}
.go-btn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none;}

/* CONNECTION CHECK */
.conn-section{
  background:rgba(255,255,255,.03);border:1px solid var(--br);
  border-radius:16px;padding:16px;margin-top:14px;}
.conn-section h4{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;margin-bottom:10px;}
.check-row{
  display:flex;align-items:center;gap:9px;
  padding:7px 10px;border-radius:9px;
  background:rgba(255,255,255,.03);margin-bottom:5px;font-size:12px;}
.check-icon{font-size:14px;min-width:20px;}
.check-label{flex:1;color:var(--dim);}
.check-result{font-size:11px;font-family:'JetBrains Mono',monospace;}
.check-result.ok{color:var(--teal);}
.check-result.err{color:var(--red);}
.check-result.wait{color:var(--gold);}
.recheck-btn{
  width:100%;padding:9px;border-radius:10px;
  border:1px solid rgba(45,212,191,.3);background:rgba(45,212,191,.08);
  color:var(--teal);font-size:12px;font-weight:700;cursor:pointer;
  font-family:inherit;margin-top:8px;transition:.2s;}
.recheck-btn:hover{background:rgba(45,212,191,.16);}

/* TOAST */
.toast{
  position:fixed;bottom:20px;left:50%;
  transform:translateX(-50%) translateY(60px);
  background:#111d35;border:1px solid rgba(255,255,255,.12);
  border-radius:12px;padding:11px 18px;font-size:13px;font-weight:700;
  box-shadow:0 8px 26px rgba(0,0,0,.6);opacity:0;transition:.3s;
  pointer-events:none;white-space:nowrap;z-index:999;}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1;}
.toast.ok{border-color:rgba(45,212,191,.4);color:var(--teal);}
.toast.ng{border-color:rgba(251,113,133,.4);color:var(--red);}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px;}
@media(max-width:700px){
  .hero{min-height:auto;}
  .qr-container{width:240px;height:240px;}
  .kpi-row,.action-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<!-- ── TOP BAR ── -->
<div class="topbar">
  <div class="topbar-logo">
    🏥 護理互動課堂
    <span>|</span>
    <em id="topCourse">開課主控台</em>
  </div>
  <div class="sp"></div>
  <div class="status-pill checking" id="statusPill">
    <div class="dot"></div>
    <span id="statusText">連線檢查中…</span>
  </div>
  <button class="topbar-btn" onclick="toggleSetup()">⚙ 老師設定</button>
</div>

<!-- ── MAIN LAYOUT ── -->
<div class="stage">

  <!-- LEFT: QR HERO -->
  <section class="card hero">
    <div class="hero-title" id="heroTitle">護理互動課堂</div>
    <div class="hero-sub">請用手機掃描 QR Code 加入課堂<br>輸入通關密語 → 學號 → 暱稱</div>

    <div class="qr-container" id="qrBox">
      <div class="qr-placeholder">
        <span>📱</span>
        <p>請先在右側建立課堂</p>
      </div>
    </div>

    <div class="pwd-badge" id="pwdBadge" style="display:none"></div>
    <div class="url-display" id="urlDisplay">尚未建立課堂</div>
    <button onclick="copyLink()" style="padding:8px 20px;border-radius:9px;border:1px solid var(--br);background:rgba(255,255,255,.05);color:var(--dim);cursor:pointer;font-size:12px;font-weight:700;font-family:inherit">📋 複製學生連結</button>
  </section>

  <!-- RIGHT: SIDE PANEL -->
  <aside class="side">

    <!-- KPI + QUICK ACTIONS -->
    <div class="card">
      <h2 style="font-family:'Noto Serif TC',serif;font-size:16px;color:var(--gold);margin-bottom:14px">課堂狀態</h2>
      <div class="kpi-row">
        <div class="kpi"><div class="kpi-num" id="joinCount">0</div><div class="kpi-label">已加入學生</div></div>
        <div class="kpi"><div class="kpi-num" id="teamCount">0</div><div class="kpi-label">組別數</div></div>
      </div>
      <div class="action-grid" style="margin-top:14px">
        <button class="act-btn" onclick="location.href='nursing-games-pro.html'">🎮 開遊戲</button>
        <button class="act-btn" onclick="location.href='leaderboard.html'">🏆 排行榜</button>
        <button class="act-btn" onclick="openStudent()">📱 學生入口</button>
        <button class="act-btn" onclick="location.href='index.html'">🏠 回首頁</button>
      </div>
    </div>

    <!-- JOINED LIST -->
    <div class="card">
      <h2 style="font-family:'Noto Serif TC',serif;font-size:16px;color:var(--gold);margin-bottom:12px">
        已加入學生
        <span style="font-size:11px;font-weight:400;color:var(--dim);margin-left:8px">每8秒更新</span>
      </h2>
      <div class="joined-list" id="joinedList">
        <div style="color:var(--dim);font-size:12px;text-align:center;padding:16px">尚無學生加入</div>
      </div>
    </div>

    <!-- TEACHER SETUP (hidden by default) -->
    <div class="setup-panel" id="setupPanel" style="display:none">
      <h3>⚙ 老師設定</h3>
      <div class="field">
        <label>課堂名稱</label>
        <input id="sessionName" placeholder="例：1142 內外護理 第10週" maxlength="40">
      </div>
      <div class="field">
        <label>今日通關密語</label>
        <input id="passcode" placeholder="例：護理0430 或 1142" maxlength="20">
      </div>
      <button class="go-btn" id="goBtn" onclick="oneClickStart()">🚀 一鍵開課並產生 QR Code</button>

      <!-- CONNECTION CHECK -->
      <div class="conn-section">
        <h4>連線狀態</h4>
        <div class="check-row">
          <span class="check-icon">🔌</span>
          <span class="check-label">Supabase 連線</span>
          <span class="check-result wait" id="chk-conn">等待中</span>
        </div>
        <div class="check-row">
          <span class="check-icon">📋</span>
          <span class="check-label">sessions 資料表</span>
          <span class="check-result wait" id="chk-sessions">等待中</span>
        </div>
        <div class="check-row">
          <span class="check-icon">👥</span>
          <span class="check-label">participants 資料表</span>
          <span class="check-result wait" id="chk-parts">等待中</span>
        </div>
        <div class="check-row">
          <span class="check-icon">📚</span>
          <span class="check-label">roster 名單</span>
          <span class="check-result wait" id="chk-roster">等待中</span>
        </div>
        <button class="recheck-btn" onclick="runChecks()">🔄 重新檢查連線</button>
      </div>
    </div>

  </aside>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════
// ▼▼▼ 老師在這裡填入設定，存檔後上傳 GitHub ▼▼▼
// ═══════════════════════════════════════════════
const CONFIG = {
  supabase_url : '',   // 貼入：https://xxxx.supabase.co
  supabase_key : '',   // 貼入：eyJhbGci... (anon key)
  course_name  : '內外護理學綜論',   // 課程名稱（顯示在大標題）
  student_page : 'student-entry-v2.html', // 學生入場頁面檔名
};
// ▲▲▲ 只需改這裡 ▲▲▲
// ═══════════════════════════════════════════════

// ── STATE ──
let SB = null;
let currentSessionId = '';
let currentStudentURL = '';
let _pollInterval = null;

// ── STORAGE (fallback for non-hardcoded) ──
const LS = 'SRT_';
function lsGet(k,d=null){try{const v=localStorage.getItem(LS+k);return v?JSON.parse(v):d;}catch{return d;}}
function lsSet(k,v){try{localStorage.setItem(LS+k,JSON.stringify(v));}catch{}}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
function getSupabaseConfig(){
  // Priority 1: hardcoded in file
  if(CONFIG.supabase_url && CONFIG.supabase_key)
    return {url:CONFIG.supabase_url, key:CONFIG.supabase_key};
  // Priority 2: localStorage fallback
  const url = lsGet('sb_url','');
  const key = lsGet('sb_key','');
  return {url, key};
}

function initSupabase(){
  const {url, key} = getSupabaseConfig();
  if(!url || !key) return false;
  try{
    SB = window.supabase.createClient(url, key);
    return true;
  } catch(e){ console.error(e); return false; }
}

// ═══════════════════════════════════════════════
// CONNECTION CHECKS (runs on load)
// ═══════════════════════════════════════════════
function setCheck(id, status, msg){
  const el = document.getElementById(id);
  if(!el) return;
  el.className = 'check-result ' + status;
  el.textContent = msg;
}

async function runChecks(){
  const pill = document.getElementById('statusPill');
  const pillTxt = document.getElementById('statusText');
  pill.className = 'status-pill checking';
  pillTxt.textContent = '連線檢查中…';
  setCheck('chk-conn','wait','檢查中…');
  setCheck('chk-sessions','wait','等待中');
  setCheck('chk-parts','wait','等待中');
  setCheck('chk-roster','wait','等待中');

  // Init Supabase
  const ok = initSupabase();
  if(!ok){
    setCheck('chk-conn','err','未設定 URL / Key');
    setCheck('chk-sessions','err','需先設定');
    setCheck('chk-parts','err','需先設定');
    setCheck('chk-roster','err','需先設定');
    pill.className = 'status-pill err';
    pillTxt.textContent = '未設定 Supabase';
    showSetupHint();
    return;
  }
  setCheck('chk-conn','ok','✓ 已設定');

  // Check sessions table
  try{
    const {error:e1} = await SB.from('sessions').select('id').limit(1);
    if(e1) throw e1;
    setCheck('chk-sessions','ok','✓ 正常');
  } catch(e){
    setCheck('chk-sessions','err','✗ '+e.message);
  }

  // Check participants table
  try{
    const {error:e2} = await SB.from('participants').select('id').limit(1);
    if(e2) throw e2;
    setCheck('chk-parts','ok','✓ 正常');
  } catch(e){
    setCheck('chk-parts','err','✗ '+e.message);
  }

  // Check roster + count
  try{
    const {data:r, error:e3} = await SB.from('roster').select('id',{count:'exact',head:true});
    if(e3) throw e3;
    const {count} = await SB.from('roster').select('*',{count:'exact',head:true});
    setCheck('chk-roster', count>0 ? 'ok' : 'wait',
      count>0 ? `✓ ${count} 筆` : '⚠ 尚無名單');
  } catch(e){
    setCheck('chk-roster','err','✗ '+e.message);
  }

  // Overall status
  const results = ['chk-sessions','chk-parts'].map(id=>document.getElementById(id)?.className||'');
  const allOk = results.every(c=>c.includes('ok'));
  if(allOk){
    pill.className = 'status-pill ok';
    pillTxt.textContent = '連線正常';
  } else {
    pill.className = 'status-pill err';
    pillTxt.textContent = '部分連線失敗';
    showSetupHint();
  }
}

function showSetupHint(){
  // Auto-open setup panel if there's an issue
  document.getElementById('setupPanel').style.display = '';
}

// ═══════════════════════════════════════════════
// SESSION
// ═══════════════════════════════════════════════
function makeStudentURL(sessId){
  const {url, key} = getSupabaseConfig();
  const base = new URL(CONFIG.student_page, location.href).href;
  // Embed sb_url & sb_key in URL so student page works on any device
  return `${base}?session_id=${encodeURIComponent(sessId)}&sb_url=${encodeURIComponent(url)}&sb_key=${encodeURIComponent(key)}`;
}

async function oneClickStart(){
  if(!SB){ toast('請先確認 Supabase 連線正常','ng'); return; }
  const name = document.getElementById('sessionName').value.trim() || CONFIG.course_name;
  const pwd  = document.getElementById('passcode').value.trim();
  if(!pwd){ toast('請輸入通關密語','ng'); return; }

  const btn = document.getElementById('goBtn');
  btn.disabled = true; btn.textContent = '建立中…';

  const {data, error} = await SB.from('sessions')
    .insert({session_name: name, passcode: pwd, active: true})
    .select().single();

  btn.disabled = false; btn.textContent = '🚀 一鍵開課並產生 QR Code';

  if(error){ toast('建立失敗：'+error.message, 'ng'); return; }

  currentSessionId  = data.id;
  currentStudentURL = makeStudentURL(data.id);
  lsSet('session_id', currentSessionId);
  lsSet('student_url', currentStudentURL);

  // Update UI
  document.getElementById('heroTitle').textContent = name;
  document.getElementById('topCourse').textContent = name;
  showQR(currentStudentURL, pwd);
  startPolling();
  toast('✓ 課堂已建立！', 'ok');
}

function showQR(url, pwd){
  // QR
  const box = document.getElementById('qrBox');
  box.innerHTML = '';
  box.classList.add('large');
  new QRCode(box, {text:url, width:340, height:340,
    colorDark:'#060b18', colorLight:'#ffffff',
    correctLevel: QRCode.CorrectLevel.M});
  // Password badge
  const badge = document.getElementById('pwdBadge');
  badge.textContent = '通關密語：' + pwd;
  badge.style.display = '';
  // URL
  document.getElementById('urlDisplay').textContent = url;
}

// ═══════════════════════════════════════════════
// JOINED STUDENTS
// ═══════════════════════════════════════════════
async function loadJoined(){
  if(!SB || !currentSessionId) return;
  const {data, error} = await SB.from('participants')
    .select('id,nickname,student_id,team_name,verified')
    .eq('session_id', currentSessionId)
    .order('created_at', {ascending:false});
  if(error) return;
  renderJoined(data || []);
}

function renderJoined(rows){
  document.getElementById('joinCount').textContent = rows.length;
  const teams = new Set(rows.map(r=>r.team_name).filter(Boolean));
  document.getElementById('teamCount').textContent = teams.size;

  const el = document.getElementById('joinedList');
  if(!rows.length){
    el.innerHTML = '<div style="color:var(--dim);font-size:12px;text-align:center;padding:16px">尚無學生加入</div>';
    return;
  }
  const colors = ['#2dd4bf','#f5c842','#f472b6','#818cf8','#f97316','#10b981'];
  function gc(g){ let h=0; for(let c of(g||''))h=(h<<5)-h+c.charCodeAt(0); return colors[Math.abs(h)%colors.length]; }

  el.innerHTML = rows.map(r=>`
    <div class="joined-item">
      <div class="odot"></div>
      <div class="jname">${r.nickname||'—'} ${r.verified?'<span style="color:var(--teal);font-size:10px">✓</span>':''}</div>
      <div class="jteam" style="color:${gc(r.team_name)}">${r.team_name||'未分組'}</div>
      <div class="jid">${r.student_id||''}</div>
    </div>`).join('');
}

function startPolling(){
  clearInterval(_pollInterval);
  loadJoined();
  _pollInterval = setInterval(loadJoined, 8000);
  // Realtime
  try{
    SB.channel('joined_'+currentSessionId)
      .on('postgres_changes',{event:'*',schema:'public',table:'participants'},()=>loadJoined())
      .subscribe();
  } catch(e){}
}

// ═══════════════════════════════════════════════
// UI HELPERS
// ═══════════════════════════════════════════════
function toggleSetup(){
  const p = document.getElementById('setupPanel');
  p.style.display = p.style.display==='none'?'':'none';
}

function copyLink(){
  if(!currentStudentURL){ toast('尚未建立課堂','ng'); return; }
  if(navigator.clipboard) navigator.clipboard.writeText(currentStudentURL).then(()=>toast('✓ 連結已複製','ok'));
  else{ const t=document.createElement('textarea');t.value=currentStudentURL;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('✓ 已複製','ok'); }
}

function openStudent(){
  if(currentStudentURL) window.open(currentStudentURL,'_blank');
  else location.href = CONFIG.student_page;
}

let _tt;
function toast(msg, type=''){
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'toast'+(type?' '+type:'');
  el.classList.add('on'); clearTimeout(_tt);
  _tt = setTimeout(()=>el.classList.remove('on'), 2600);
}

// ═══════════════════════════════════════════════
// RESTORE LAST SESSION
// ═══════════════════════════════════════════════
function restoreLastSession(){
  const savedId  = lsGet('session_id','');
  const savedUrl = lsGet('student_url','');
  const savedName = lsGet('session_name','');
  if(savedId && savedUrl){
    currentSessionId  = savedId;
    currentStudentURL = savedUrl;
    if(savedName){
      document.getElementById('heroTitle').textContent = savedName;
      document.getElementById('topCourse').textContent = savedName;
    }
    // Re-show QR from saved URL (extract pwd from params or just show URL)
    const box = document.getElementById('qrBox');
    box.innerHTML = '';
    box.classList.add('large');
    new QRCode(box, {text:savedUrl, width:340, height:340,
      colorDark:'#060b18', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.M});
    document.getElementById('urlDisplay').textContent = savedUrl;
    startPolling();
  }
  // Restore saved inputs
  const savedPwd = lsGet('passcode','');
  if(savedPwd){
    document.getElementById('passcode').value = savedPwd;
    document.getElementById('pwdBadge').textContent = '通關密語：'+savedPwd;
    document.getElementById('pwdBadge').style.display = savedId ? '' : 'none';
  }
  document.getElementById('sessionName').value = lsGet('session_name','') || CONFIG.course_name;
}

// Save inputs on change
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('sessionName').addEventListener('input',e=>lsSet('session_name',e.target.value));
  document.getElementById('passcode').addEventListener('input',e=>lsSet('passcode',e.target.value));

  // Set course title from CONFIG
  if(CONFIG.course_name){
    document.getElementById('topCourse').textContent = CONFIG.course_name;
  }

  // Run checks & restore
  restoreLastSession();
  runChecks();  // Auto check on every page load
});
</script>
