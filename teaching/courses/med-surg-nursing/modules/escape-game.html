<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>護理知識逃脫室 | 內外護理學</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#080c1a; --navy2:#0f1628; --text:#e2e8f0;
  --dim:#8892a8; --border:rgba(255,255,255,0.08);
  --success:#34d399; --danger:#fb7185; --warn:#fbbf24;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow-x:hidden;}
body{font-family:'Noto Sans TC',sans-serif;background:var(--navy);color:var(--text);min-height:100vh;}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:var(--navy);}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px;}

/* ── CANVAS (particles) ── */
#confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:9999;}

/* ── TOPBAR ── */
.topbar{
  position:fixed;top:0;left:0;right:0;height:56px;
  background:rgba(8,12,26,.95);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;z-index:100;backdrop-filter:blur(16px);
}
.topbar-logo{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;letter-spacing:.1em;}
.topbar-meta{display:flex;align-items:center;gap:20px;font-size:13px;}
.timer{font-family:'JetBrains Mono',monospace;color:var(--warn);}
.hearts{display:flex;gap:4px;font-size:16px;}
.room-progress{font-size:12px;color:var(--dim);}

/* ── PAGE WRAPPER ── */
.page{min-height:100vh;padding:72px 0 40px;}

/* ════════════════════════════════
   HUB SCREEN
════════════════════════════════ */
.hub-hero{text-align:center;padding:40px 20px 32px;}
.hub-badge{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(45,212,191,.1);border:1px solid rgba(45,212,191,.28);
  border-radius:100px;padding:6px 18px;
  font-size:11px;color:#2dd4bf;letter-spacing:.12em;
  margin-bottom:20px;font-weight:700;
}
.hub-badge span{width:5px;height:5px;background:#2dd4bf;border-radius:50%;animation:blink 1.4s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.2;}}
.hub-title{font-family:'Noto Serif TC',serif;font-size:clamp(28px,4vw,48px);font-weight:700;color:#fff;margin-bottom:8px;}
.hub-title em{font-style:normal;background:linear-gradient(135deg,#2dd4bf,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hub-desc{font-size:14px;color:var(--dim);max-width:560px;margin:0 auto;line-height:1.8;}
.hub-how{
  display:flex;align-items:center;justify-content:center;gap:8px;
  flex-wrap:wrap;font-size:12px;color:var(--dim);
  margin-top:16px;
}
.hub-how span{
  background:rgba(255,255,255,.05);border:1px solid var(--border);
  border-radius:100px;padding:4px 12px;
}

.rooms-grid{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:16px;max-width:1100px;margin:0 auto;
  padding:8px 24px;
}
.room-card{
  border-radius:16px;padding:0;overflow:hidden;
  cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);
  position:relative;border:1px solid var(--border);
  background:rgba(15,22,40,.8);
}
.room-card:hover:not(.locked){
  transform:translateY(-4px);
  box-shadow:0 20px 50px rgba(0,0,0,.4);
}
.room-card.locked{cursor:not-allowed;opacity:.55;filter:grayscale(.5);}
.room-card.completed .rc-inner{opacity:.7;}
.rc-stripe{height:4px;width:100%;}
.rc-inner{padding:18px 16px 14px;}
.rc-num{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.15em;margin-bottom:8px;}
.rc-icon{font-size:28px;margin-bottom:8px;display:block;}
.rc-title{font-size:14px;font-weight:700;color:#fff;margin-bottom:3px;line-height:1.3;}
.rc-en{font-size:11px;color:var(--dim);margin-bottom:10px;}
.rc-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px;}
.rc-tag{font-size:9px;padding:2px 7px;border-radius:100px;background:rgba(255,255,255,.06);color:var(--dim);border:1px solid var(--border);}
.rc-status{
  display:flex;align-items:center;gap:6px;
  font-size:11px;font-weight:700;
}
.rc-status.done{color:var(--success);}
.rc-status.locked-st{color:var(--dim);}
.rc-status.open-st{color:var(--warn);}

.hub-start-btn{
  display:block;width:fit-content;margin:28px auto 0;
  background:linear-gradient(135deg,#0d9488,#2dd4bf);
  color:var(--navy);font-weight:900;font-size:15px;
  padding:14px 40px;border-radius:100px;border:none;cursor:pointer;
  transition:all .2s;letter-spacing:.05em;
  box-shadow:0 8px 24px rgba(45,212,191,.35);
}
.hub-start-btn:hover{transform:scale(1.04);box-shadow:0 12px 32px rgba(45,212,191,.45);}

/* ════════════════════════════════
   ROOM SCREEN
════════════════════════════════ */
.room-page{max-width:900px;margin:0 auto;padding:16px 20px 40px;}
.room-header{
  border-radius:16px;padding:22px 26px;margin-bottom:20px;
  border:1px solid var(--border);
  position:relative;overflow:hidden;
}
.room-header::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.room-header-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:10px;}
.room-num-badge{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.15em;}
.room-h-title{font-family:'Noto Serif TC',serif;font-size:22px;font-weight:700;color:#fff;}
.room-h-en{font-size:12px;color:var(--dim);margin-top:2px;}
.room-atm{font-size:13px;color:var(--dim);line-height:1.75;margin-top:8px;}
.room-progress-dots{display:flex;gap:6px;align-items:center;}
.rdot{width:10px;height:10px;border-radius:50%;border:2px solid rgba(255,255,255,.2);transition:all .3s;}
.rdot.done{border-color:var(--success);background:var(--success);}
.rdot.active{border-color:var(--warn);background:var(--warn);}

.stations-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;}
.station-card{
  background:rgba(15,22,40,.8);border:1px solid var(--border);
  border-radius:14px;padding:20px;cursor:pointer;
  transition:all .25s;position:relative;overflow:hidden;
}
.station-card:hover:not(.solved){
  transform:translateY(-2px);
  box-shadow:0 12px 32px rgba(0,0,0,.3);
}
.station-card.solved{cursor:default;border-color:rgba(52,211,153,.4);}
.station-card.solved::after{
  content:'';position:absolute;inset:0;
  background:rgba(52,211,153,.04);
  pointer-events:none;
}
.station-icon{font-size:28px;margin-bottom:10px;display:block;}
.station-name{font-size:14px;font-weight:700;color:#fff;margin-bottom:4px;}
.station-hint{font-size:12px;color:var(--dim);}
.station-solved-badge{
  display:flex;align-items:center;gap:6px;
  margin-top:12px;font-size:12px;font-weight:700;color:var(--success);
}
.station-digit{
  font-family:'JetBrains Mono',monospace;
  font-size:24px;font-weight:700;
  background:rgba(52,211,153,.15);
  border:1px solid rgba(52,211,153,.35);
  color:var(--success);
  width:40px;height:40px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
}
.station-lock{font-size:22px;color:rgba(255,255,255,.2);}

/* Code Entry */
.code-entry{
  background:rgba(15,22,40,.9);border:1px solid var(--border);
  border-radius:14px;padding:20px 24px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.code-label{font-size:12px;color:var(--dim);font-weight:700;letter-spacing:.1em;text-transform:uppercase;}
.code-digits{display:flex;gap:8px;}
.code-input{
  width:44px;height:54px;border-radius:10px;
  background:rgba(255,255,255,.05);border:1px solid var(--border);
  color:#fff;font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;
  text-align:center;outline:none;transition:border-color .2s;
}
.code-input:focus{border-color:rgba(255,255,255,.35);}
.code-separator{font-size:20px;color:var(--dim);}
.code-btn{
  padding:12px 28px;border-radius:100px;border:none;
  font-family:'Noto Sans TC',sans-serif;font-size:14px;font-weight:700;
  cursor:pointer;transition:all .2s;
}
.code-btn.ready{
  background:linear-gradient(135deg,#0d9488,#2dd4bf);
  color:var(--navy);box-shadow:0 6px 18px rgba(45,212,191,.3);
}
.code-btn.ready:hover{transform:scale(1.04);}
.code-btn.disabled{background:rgba(255,255,255,.08);color:var(--dim);cursor:not-allowed;}
.code-error{font-size:12px;color:var(--danger);margin-top:8px;width:100%;animation:shake .4s;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}};

/* Back btn */
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.05);border:1px solid var(--border);
  color:var(--dim);font-size:13px;padding:8px 16px;border-radius:100px;
  cursor:pointer;transition:all .2s;margin-bottom:14px;
}
.back-btn:hover{color:var(--text);background:rgba(255,255,255,.1);}

/* ════════════════════════════════
   QUESTION MODAL
════════════════════════════════ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);
  z-index:500;display:flex;align-items:center;justify-content:center;
  padding:20px;backdrop-filter:blur(8px);
  animation:fadein .2s ease;
}
@keyframes fadein{from{opacity:0;}to{opacity:1;}}
.modal{
  background:#0f1628;border:1px solid var(--border);
  border-radius:20px;width:100%;max-width:540px;
  overflow:hidden;animation:slideup .25s cubic-bezier(.4,0,.2,1);
}
@keyframes slideup{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);}
.modal-station-name{font-size:16px;font-weight:700;color:#fff;margin-bottom:4px;}
.modal-clue-num{font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.1em;}
.modal-body{padding:24px;}
.modal-question{font-size:15px;line-height:1.75;color:var(--text);margin-bottom:20px;font-weight:500;}
.modal-options{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
.option-btn{
  background:rgba(255,255,255,.04);border:1px solid var(--border);
  border-radius:12px;padding:14px 18px;
  color:var(--text);font-size:13px;line-height:1.5;
  cursor:pointer;transition:all .2s;text-align:left;
  font-family:'Noto Sans TC',sans-serif;
  display:flex;align-items:center;gap:12px;
}
.option-btn:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);}
.option-btn.correct{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.5);color:var(--success);}
.option-btn.wrong{background:rgba(251,113,133,.1);border-color:rgba(251,113,133,.4);color:var(--danger);}
.option-btn.disabled{pointer-events:none;}
.opt-label{
  width:26px;height:26px;border-radius:7px;
  background:rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;flex-shrink:0;
}
.option-btn.correct .opt-label{background:rgba(52,211,153,.3);}
.option-btn.wrong .opt-label{background:rgba(251,113,133,.25);}
.modal-hearts{display:flex;gap:4px;font-size:18px;margin-bottom:12px;}
.modal-hint-toggle{
  background:none;border:1px solid var(--border);color:var(--dim);
  font-size:12px;padding:6px 14px;border-radius:100px;cursor:pointer;
  font-family:'Noto Sans TC',sans-serif;transition:all .2s;
}
.modal-hint-toggle:hover{color:var(--text);border-color:rgba(255,255,255,.25);}
.modal-hint{
  background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.2);
  border-radius:10px;padding:12px 14px;
  font-size:12px;color:#fde68a;line-height:1.7;margin-top:10px;
}

/* Result panel */
.result-panel{padding:0 24px 24px;}
.result-correct{
  background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.25);
  border-radius:12px;padding:16px 18px;
}
.result-wrong{
  background:rgba(251,113,133,.08);border:1px solid rgba(251,113,133,.25);
  border-radius:12px;padding:16px 18px;
}
.result-title{font-size:14px;font-weight:700;margin-bottom:6px;}
.result-correct .result-title{color:var(--success);}
.result-wrong .result-title{color:var(--danger);}
.result-expl{font-size:13px;color:var(--dim);line-height:1.75;}
.digit-reveal{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.3);
  border-radius:10px;padding:10px 16px;margin-top:12px;
}
.digit-reveal-num{
  font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;color:var(--success);
}
.digit-reveal-label{font-size:12px;color:var(--dim);}
.continue-btn{
  width:100%;margin-top:14px;padding:13px;border-radius:12px;border:none;
  font-family:'Noto Sans TC',sans-serif;font-size:14px;font-weight:700;
  cursor:pointer;transition:all .2s;
}
.continue-btn.ok{background:var(--success);color:var(--navy);}
.continue-btn.retry{background:rgba(255,255,255,.08);color:var(--text);}
.continue-btn:hover{opacity:.9;}

/* ════════════════════════════════
   ROOM COMPLETE
════════════════════════════════ */
.room-complete{
  max-width:500px;margin:60px auto;padding:20px;text-align:center;
}
.rc-unlocked-icon{font-size:72px;margin-bottom:16px;animation:bounce .6s ease;}
@keyframes bounce{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}
.rc-unlocked-title{font-family:'Noto Serif TC',serif;font-size:28px;font-weight:700;color:#fff;margin-bottom:8px;}
.rc-unlocked-sub{font-size:14px;color:var(--dim);margin-bottom:8px;}
.rc-code-display{
  display:inline-flex;gap:8px;
  background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.3);
  border-radius:14px;padding:14px 20px;margin:16px 0;
}
.rc-code-dig{
  font-family:'JetBrains Mono',monospace;font-size:32px;font-weight:700;
  color:var(--success);
}
.rc-stats{display:flex;gap:16px;justify-content:center;margin:16px 0;}
.rc-stat{text-align:center;}
.rc-stat-val{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;color:#fff;}
.rc-stat-label{font-size:11px;color:var(--dim);}
.next-room-btn{
  background:linear-gradient(135deg,#0d9488,#2dd4bf);
  color:var(--navy);font-weight:900;font-size:15px;
  padding:14px 40px;border-radius:100px;border:none;cursor:pointer;
  transition:all .2s;box-shadow:0 6px 20px rgba(45,212,191,.3);
  margin-top:8px;
}
.next-room-btn:hover{transform:scale(1.04);}

/* ════════════════════════════════
   VICTORY SCREEN
════════════════════════════════ */
.victory{
  max-width:640px;margin:30px auto;padding:20px;text-align:center;
}
.victory-emoji{font-size:80px;margin-bottom:16px;animation:float 3s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}
.victory-title{font-family:'Noto Serif TC',serif;font-size:clamp(28px,5vw,44px);font-weight:700;color:#fff;margin-bottom:8px;}
.victory-sub{font-size:15px;color:var(--dim);line-height:1.8;margin-bottom:24px;}
.victory-stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:14px;
  background:rgba(15,22,40,.8);border:1px solid var(--border);
  border-radius:16px;padding:24px;margin-bottom:24px;
}
.vs-item{text-align:center;}
.vs-val{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;color:#fff;margin-bottom:4px;}
.vs-label{font-size:12px;color:var(--dim);}
.rooms-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:24px;}
.rs-item{
  border-radius:12px;padding:12px 8px;text-align:center;
  border:1px solid rgba(52,211,153,.3);background:rgba(52,211,153,.06);
}
.rs-icon{font-size:20px;margin-bottom:4px;}
.rs-name{font-size:10px;color:var(--dim);line-height:1.4;}
.victory-back{
  background:rgba(255,255,255,.06);border:1px solid var(--border);
  color:var(--text);font-size:14px;padding:12px 28px;border-radius:100px;
  cursor:pointer;transition:all .2s;font-family:'Noto Sans TC',sans-serif;
  margin-right:10px;
}
.victory-back:hover{background:rgba(255,255,255,.12);}
.victory-retry{
  background:linear-gradient(135deg,#0d9488,#2dd4bf);
  color:var(--navy);font-weight:700;font-size:14px;
  padding:12px 28px;border-radius:100px;border:none;
  cursor:pointer;transition:all .2s;
}
.victory-retry:hover{transform:scale(1.04);}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  .rooms-grid{grid-template-columns:1fr 1fr;gap:12px;padding:8px 16px;}
  .stations-grid{grid-template-columns:1fr;}
  .victory-stats{grid-template-columns:1fr 1fr;}
  .rooms-summary{grid-template-columns:repeat(4,1fr);}
  .code-entry{flex-direction:column;align-items:flex-start;}
}
@media(max-width:480px){
  .rooms-grid{grid-template-columns:1fr;}
  .rooms-summary{grid-template-columns:repeat(2,1fr);}
  .topbar{padding:0 14px;}
  .hub-hero{padding:24px 16px 20px;}
}
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-logo" id="tb-logo">🏥 護理逃脫室</div>
  <div class="topbar-meta">
    <div class="hearts" id="tb-hearts"></div>
    <div class="timer" id="tb-timer" style="display:none">⏱ 00:00</div>
    <div class="room-progress" id="tb-progress"></div>
  </div>
</div>

<div class="page" id="app"></div>

<script>
/* ═══════════════════════════════════════
   GAME DATA
═══════════════════════════════════════ */
const ROOMS = [
  {
    id:1, name:"氧合實驗室", nameEn:"Oxygenation Lab",
    color:"#00b4d8", bg:"rgba(0,180,216,0.08)", icon:"🫁",
    tags:["ABG判讀","氧療","COPD","呼吸評估"],
    atm:"⚠️ 氧合實驗室的警報燈不停閃爍，SpO₂監測儀發出嗶嗶聲。您必須回答4個護理問題，解開密碼，才能打開逃生門！",
    code:"8835",
    stations:[
      { name:"血液氣體分析儀", icon:"🔬",
        hint:"正常動脈血氧濃度的數字範圍",
        q:"正常動脈血氧分壓（PaO₂）的正常範圍下限是多少mmHg？",
        opts:["60 mmHg","80 mmHg","100 mmHg","40 mmHg"],
        ans:1, digit:"8",
        hintText:"PaO₂正常值是兩位數的整數，以8開頭…",
        expl:"PaO₂正常範圍80–100 mmHg。低於60 mmHg即為低氧血症，需立即給氧。密碼第1位來自80的第1個數字。" },
      { name:"COPD護理指引牌", icon:"📊",
        hint:"慢性肺病患者需要特殊的氧療目標",
        q:"COPD病人（慢性CO₂滯留者）氧療目標SpO₂範圍的下限是多少？",
        opts:["94%","92%","88%","95%"],
        ans:2, digit:"8",
        hintText:"COPD目標是88-92%，比一般病人低，避免抑制缺氧驅動力…",
        expl:"COPD目標SpO₂ 88–92%，下限88%。太高濃度的氧氣會抑制這類病人的低氧呼吸驅力，造成CO₂積聚。密碼第2位來自88的第1個數字。" },
      { name:"酸鹼平衡圖表", icon:"⚗️",
        hint:"pH值小數點後第一位數字",
        q:"正常動脈血液pH值的正常範圍是？小數點後第一位是3",
        opts:["7.15–7.25","7.25–7.35","7.35–7.45","7.45–7.55"],
        ans:2, digit:"3",

/* ═══════════════════════════════════════
   GAME STATE
═══════════════════════════════════════ */
let state = {
  screen: 'hub',          // hub | room | complete | victory
  currentRoom: 0,
  roomStates: ROOMS.map(()=>({
    completed: false,
    cluesSolved: [false,false,false,false],
    hearts: 3,
    timeSpent: 0
  })),
  globalStartTime: null,
  roomStartTime: null,
  modal: null,            // { stationIdx, answered, correct }
  timerInterval: null,
  showHint: false
};

/* ═══════════════════════════════════════
   UTILITIES
═══════════════════════════════════════ */
function formatTime(ms){
  const s=Math.floor(ms/1000), m=Math.floor(s/60);
  return `${String(m).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
}
function totalSolvedRooms(){
  return state.roomStates.filter(r=>r.completed).length;
}
function currentRS(){ return state.roomStates[state.currentRoom]; }
function currentRM(){ return ROOMS[state.currentRoom]; }

/* ═══════════════════════════════════════
   TOPBAR
═══════════════════════════════════════ */
function updateTopbar(){
  const rs = state.screen==='room' ? currentRS() : null;
  const el = id=>document.getElementById(id);
  el('tb-logo').textContent = state.screen==='hub' ? '🏥 護理逃脫室' : `🏥 ${currentRM().name}`;
  if(rs){
    el('tb-hearts').innerHTML = [0,1,2].map(i=>i<rs.hearts?'❤️':'🖤').join('');
    el('tb-timer').style.display='block';
    el('tb-progress').textContent=`房間 ${state.currentRoom+1} / ${ROOMS.length}`;
  } else {
    el('tb-hearts').innerHTML='';
    el('tb-timer').style.display='none';
    el('tb-progress').textContent=`已解鎖 ${totalSolvedRooms()} / ${ROOMS.length}`;
  }
}

function startTimer(){
  if(state.timerInterval) clearInterval(state.timerInterval);
  state.roomStartTime = Date.now();
  state.timerInterval = setInterval(()=>{
    if(state.screen==='room'){
      const el=document.getElementById('tb-timer');
      if(el) el.textContent='⏱ '+formatTime(Date.now()-state.roomStartTime);
    }
  },1000);
}
function stopTimer(){
  if(state.timerInterval){ clearInterval(state.timerInterval); state.timerInterval=null; }
}

/* ═══════════════════════════════════════
   RENDER: HUB
═══════════════════════════════════════ */
function renderHub(){
  const completedTotal = totalSolvedRooms();
  const firstOpen = ROOMS.findIndex((_,i)=>!state.roomStates[i].completed);
  let html = `
  <div class="hub-hero">
    <div class="hub-badge"><span></span> 內外護理學 · 互動學習</div>
    <h1 class="hub-title">🏥 護理知識<em>逃脫室</em></h1>
    <p class="hub-desc">您被困在醫院！每間診療室都有密碼鎖。回答護理知識問題，解開密碼，一間接一間地逃出去。全部逃完即成為<strong style="color:#2dd4bf">全人護理達人</strong>！</p>
    <div class="hub-how">
      <span>🔒 按順序解鎖</span>
      <span>💡 4題解密碼</span>
      <span>❤️ 3條生命</span>
      <span>⏱ 計時挑戰</span>
      ${completedTotal>0?`<span>✅ 已完成 ${completedTotal}/${ROOMS.length}</span>`:''}
    </div>
  </div>
  <div class="rooms-grid">`;

  ROOMS.forEach((room,i)=>{
    const rs = state.roomStates[i];
    const isLocked = i>0 && !state.roomStates[i-1].completed;
    const isCompleted = rs.completed;
    const isOpen = !isLocked && !isCompleted;
    let statusBadge = '';
    if(isCompleted) statusBadge=`<div class="rc-status done">✅ 已逃出！${rs.timeSpent?'（'+formatTime(rs.timeSpent)+'）':''}</div>`;
    else if(isLocked) statusBadge=`<div class="rc-status locked-st">🔒 尚未解鎖</div>`;
    else statusBadge=`<div class="rc-status open-st">▶ 點擊進入</div>`;
    html+=`
    <div class="room-card ${isLocked?'locked':''} ${isCompleted?'completed':''}"
         onclick="${!isLocked?`enterRoom(${i})`:''}">
      <div class="rc-stripe" style="background:${room.color}"></div>
      <div class="rc-inner">
        <div class="rc-num" style="color:${room.color}">UNIT 0${i+1}</div>
        <span class="rc-icon">${room.icon}</span>
        <div class="rc-title">${room.name}</div>
        <div class="rc-en">${room.nameEn}</div>
        <div class="rc-tags">${room.tags.map(t=>`<span class="rc-tag">${t}</span>`).join('')}</div>
        ${statusBadge}
      </div>
    </div>`;
  });
  html+=`</div>`;
  if(firstOpen>=0 && completedTotal===0){
    html+=`<button class="hub-start-btn" onclick="enterRoom(0)">▶ 開始挑戰！從第一間逃出去</button>`;
  } else if(firstOpen>=0){
    html+=`<button class="hub-start-btn" onclick="enterRoom(${firstOpen})">▶ 繼續挑戰：進入第 ${firstOpen+1} 間</button>`;
  } else {
    html+=`<button class="hub-start-btn" style="background:linear-gradient(135deg,#7c3aed,#a78bfa);" onclick="renderVictory()">🎉 查看通關成果！</button>`;
  }
  document.getElementById('app').innerHTML=html;
}

/* ═══════════════════════════════════════
   RENDER: ROOM
═══════════════════════════════════════ */
function renderRoom(){
  const room = currentRM();
  const rs = currentRS();
  const solvedCount = rs.cluesSolved.filter(Boolean).length;
  const digits = rs.cluesSolved.map((s,i)=>s?room.stations[i].digit:'_');
  const allSolved = solvedCount===4;
  const col = room.color;

  let stationsHtml = '';
  room.stations.forEach((st,i)=>{
    const solved = rs.cluesSolved[i];
    stationsHtml+=`
    <div class="station-card ${solved?'solved':''}" 
         style="${solved?`border-color:rgba(52,211,153,0.3);`:`--hover-border:${col}50;`}"
         onclick="${!solved?`openStation(${i})`:''}">
      <span class="station-icon">${st.icon}</span>
      <div class="station-name">${st.name}</div>
      <div class="station-hint" style="color:${solved?'var(--success)':''}">${solved?'已解鎖線索':st.hint}</div>
      ${solved
        ?`<div class="station-solved-badge"><span>密碼片段：</span><span class="station-digit">${st.digit}</span></div>`
        :`<div style="margin-top:12px;"><span class="station-lock">🔒</span></div>`}
    </div>`;
  });

  // Code input digits
  let codeHtml='<div class="code-digits">';
  for(let i=0;i<4;i++){
    const d = digits[i];
    if(d!=='_'){
      codeHtml+=`<input class="code-input" id="cd${i}" maxlength="1" style="color:var(--success);border-color:rgba(52,211,153,.4)" value="${d}" readonly>`;
    } else {
      codeHtml+=`<input class="code-input" id="cd${i}" maxlength="1" inputmode="numeric" oninput="onCodeInput()" placeholder="-">`;
    }
    if(i<3) codeHtml+=`<span class="code-separator">·</span>`;
  }
  codeHtml+='</div>';

  const dots=['🔴','🟡','🟢','🔵'].map((d,i)=>{
    const s=rs.cluesSolved[i];
    return `<div class="rdot ${s?'done':i===solvedCount?'active':''}" title="線索 ${i+1}"></div>`;
  }).join('');

  document.getElementById('app').innerHTML=`
  <div class="room-page">
    <button class="back-btn" onclick="goHub()">← 返回大廳</button>
    <div class="room-header" style="background:${room.bg};border-color:${col}30">
      <div class="rc-stripe" style="background:${col};margin:-22px -26px 16px;height:4px;width:calc(100% + 52px)"></div>
      <div class="room-header-top">
        <div>
          <div class="room-num-badge" style="color:${col}">UNIT 0${room.id} &nbsp;·&nbsp; ${room.nameEn}</div>
          <div class="room-h-title">${room.icon} ${room.name}</div>
        </div>
        <div class="room-progress-dots">${dots}</div>
      </div>
      <div class="room-atm">${room.atm}</div>
    </div>

    <div class="stations-grid">${stationsHtml}</div>

    <div class="code-entry">
      <div>
        <div class="code-label">🔐 出口密碼</div>
        <div style="font-size:11px;color:var(--dim);margin-top:4px">解開所有線索後輸入4位密碼</div>
      </div>
      ${codeHtml}
      <div>
        <button class="code-btn ${allSolved?'ready':'disabled'}" id="unlock-btn"
          onclick="${allSolved?'checkCode()':''}">
          ${allSolved?'🔓 解鎖出口':'🔒 找到更多線索'}
        </button>
        <div id="code-error" style="display:none" class="code-error">密碼錯誤！請再試一次</div>
      </div>
    </div>
  </div>`;
}

/* ═══════════════════════════════════════
   RENDER: QUESTION MODAL
═══════════════════════════════════════ */
function renderModal(){
  if(!state.modal) return;
  const {stationIdx, answered, correct, selectedOpt} = state.modal;
  const room = currentRM(), rs = currentRS();
  const st = room.stations[stationIdx];
  const col = room.color;

  const optionsHtml = st.opts.map((opt,i)=>{
    let cls='option-btn';
    if(answered){
      cls+=' disabled';
      if(i===st.ans) cls+=' correct';
      else if(i===selectedOpt && !correct) cls+=' wrong';
    }
    return `<button class="${cls}" onclick="${!answered?`selectOption(${i})`:''}">
      <span class="opt-label">${'ABCD'[i]}</span>
      <span>${opt}</span>
    </button>`;
  }).join('');

  const heartsHtml = [0,1,2].map(i=>i<rs.hearts?'❤️':'🖤').join('');

  let resultHtml = '';
  if(answered){
    if(correct){
      resultHtml=`<div class="result-panel">
        <div class="result-correct">
          <div class="result-title">✅ 正確！</div>
          <div class="result-expl">${st.expl}</div>
          <div class="digit-reveal">
            <div class="digit-reveal-num">${st.digit}</div>
            <div class="digit-reveal-label">密碼片段 ${stationIdx+1}</div>
          </div>
        </div>
        <button class="continue-btn ok" onclick="closeModal()">繼續探索 →</button>
      </div>`;
    } else {
      resultHtml=`<div class="result-panel">
        <div class="result-wrong">
          <div class="result-title">❌ 答錯了！${rs.hearts===0?'（已用完生命，自動顯示答案）':''}</div>
          <div class="result-expl">${rs.hearts>0?`請再想想，還剩 ${rs.hearts} 條生命。正確答案是 <strong>${'ABCD'[st.ans]}</strong>。`:`正確答案是 <strong>${'ABCD'[st.ans]}</strong>。${st.expl}`}</div>
        </div>
        <button class="continue-btn ${rs.hearts>0?'retry':'ok'}" onclick="${rs.hearts>0?'retryQuestion()':'forceReveal()'}">
          ${rs.hearts>0?'再試一次':'繼續（已解鎖）'}
        </button>
      </div>`;
    }
  }

  const hintHtml = state.showHint
    ? `<div class="modal-hint">💡 提示：${st.hintText}</div>`
    : `<button class="modal-hint-toggle" onclick="toggleHint()">💡 需要提示？</button>`;

  const overlay = document.createElement('div');
  overlay.className='modal-overlay';
  overlay.id='modal-overlay';
  overlay.innerHTML=`<div class="modal">
    <div class="modal-header" style="border-top:3px solid ${col}">
      <div class="modal-station-name">${st.icon} ${st.name}</div>
      <div class="modal-clue-num">線索 ${stationIdx+1} of 4 &nbsp;·&nbsp; ${heartsHtml}</div>
    </div>
    <div class="modal-body">
      <div class="modal-question">${st.q}</div>
      <div class="modal-options">${optionsHtml}</div>
      ${!answered?hintHtml:''}
    </div>
    ${resultHtml}
  </div>`;
  document.body.appendChild(overlay);
}

function removeModal(){
  const m=document.getElementById('modal-overlay');
  if(m) m.remove();
}

/* ═══════════════════════════════════════
   GAME ACTIONS
═══════════════════════════════════════ */
function enterRoom(idx){
  state.currentRoom = idx;
  state.screen = 'room';
  state.modal = null;
  state.showHint = false;
  if(!state.globalStartTime) state.globalStartTime = Date.now();
  startTimer();
  renderRoom();
  updateTopbar();
  window.scrollTo(0,0);
}

function goHub(){
  stopTimer();
  state.screen='hub';
  state.modal=null;
  removeModal();
  renderHub();
  updateTopbar();
  window.scrollTo(0,0);
}

function openStation(idx){
  const rs=currentRS();
  if(rs.cluesSolved[idx]) return;
  state.modal={ stationIdx:idx, answered:false, correct:false, selectedOpt:null };
  state.showHint=false;
  renderModal();
}

function selectOption(optIdx){
  if(!state.modal || state.modal.answered) return;
  const st = currentRM().stations[state.modal.stationIdx];
  const correct = optIdx===st.ans;
  const rs = currentRS();
  if(!correct){ rs.hearts = Math.max(0,rs.hearts-1); }
  state.modal = { ...state.modal, answered:true, correct, selectedOpt:optIdx };
  if(correct){
    rs.cluesSolved[state.modal.stationIdx]=true;
  }
  removeModal();
  renderModal();
  updateTopbar();
}

function retryQuestion(){
  removeModal();
  const rs=currentRS();
  if(rs.hearts===0){
    forceReveal();
    return;
  }
  state.modal = { ...state.modal, answered:false, correct:false, selectedOpt:null };
  renderModal();
}

function forceReveal(){
  // Reveal answer even without correct answer (hearts=0 fallback)
  const rs=currentRS();
  rs.cluesSolved[state.modal.stationIdx]=true;
  closeModal();
}

function closeModal(){
  removeModal();
  state.modal=null;
  renderRoom();
  updateTopbar();
}

function toggleHint(){
  state.showHint=!state.showHint;
  removeModal();
  renderModal();
}

function onCodeInput(){
  const allFilled=['cd0','cd1','cd2','cd3'].every(id=>{
    const el=document.getElementById(id);
    return el && el.value.length>0;
  });
  // nothing to do since auto-fill from solved
}

function checkCode(){
  const rs=currentRS(), room=currentRM();
  if(!rs.cluesSolved.every(Boolean)) return;
  // Code is always correct when all solved (digits are revealed)
  // Just confirm entry
  const entered = ['cd0','cd1','cd2','cd3'].map(id=>{
    const el=document.getElementById(id);
    return el?el.value:'';
  }).join('');
  if(entered===room.code || rs.cluesSolved.every(Boolean)){
    // Complete this room
    rs.completed=true;
    rs.timeSpent=Date.now()-state.roomStartTime;
    stopTimer();
    state.screen='complete';
    renderRoomComplete();
    updateTopbar();
  } else {
    // Show error (shouldn't reach here if all solved)
    const err=document.getElementById('code-error');
    if(err){ err.style.display='block'; setTimeout(()=>err.style.display='none',2000); }
  }
}

function resetGame(){
  stopTimer();
  state = {
    screen:'hub',
    currentRoom:0,
    roomStates:ROOMS.map(()=>({ completed:false, cluesSolved:[false,false,false,false], hearts:3, timeSpent:0 })),
    globalStartTime:null,
    roomStartTime:null,
    modal:null,
    timerInterval:null,
    showHint:false
  };
  renderHub();
  updateTopbar();
  window.scrollTo(0,0);
}

/* ═══════════════════════════════════════
   CONFETTI
═══════════════════════════════════════ */
function launchConfetti(){
  const canvas=document.getElementById('confetti-canvas');
  const ctx=canvas.getContext('2d');
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
  const colors=['#2dd4bf','#818cf8','#f472b6','#fbbf24','#34d399','#fb7185','#f97316','#a78bfa'];
  const particles=[];
  for(let i=0;i<150;i++){
    particles.push({
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height-canvas.height,
      w:Math.random()*10+4,
      h:Math.random()*5+2,
      color:colors[Math.floor(Math.random()*colors.length)],
      vy:Math.random()*4+2,
      vx:Math.random()*2-1,
      rot:Math.random()*360,
      vrot:Math.random()*6-3
    });
  }
  let frames=0;
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      p.y+=p.vy; p.x+=p.vx; p.rot+=p.vrot;
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.color;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    });
    frames++;
    if(frames<120) requestAnimationFrame(draw);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  draw();
}

/* ═══════════════════════════════════════
   INIT
═══════════════════════════════════════ */
renderHub();
updateTopbar();
</script>
